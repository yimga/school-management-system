      - alert: "SLOWebAvailabilityFastBurn"
        expr: "(sum(rate(runmycampus_web_availability_failures_total[1h])) / clamp_min(sum(rate(runmycampus_web_availability_requests_total[1h])), 1)) > 0.0144"
        for: "2m"
        labels:
          slo: "web.availability"
          owner: "platform"
          kind: "availability"
          severity: "page"
        annotations:
          summary: "Web availability (5xx-free request rate): fast error-budget burn"
          description: "Web availability (5xx-free request rate) is burning its 30d error budget at >=14.4x (target 99.9%). At this rate ~2% of the budget is gone in 1h."
          runbook: "docs/OBSERVABILITY_METRICS.md"
