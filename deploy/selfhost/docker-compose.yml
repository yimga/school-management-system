# Self-hosted RunMyCampus — full open-source stack on YOUR server, $0 hosting fees.
# Mirrors the Render topology: web + worker + beat + PostgreSQL + Valkey (Redis).
# All images are open-source (PostgreSQL License / BSD). Nothing here affects the
# Render deployment — this is the future migration target (docs/SELF_HOST_MIGRATION.md).
#
# Run from the repo root (beta/school-management-system/):
#   cp deploy/selfhost/.env.example deploy/selfhost/.env   # then edit secrets
#   docker compose -f deploy/selfhost/docker-compose.yml up -d --build

x-app: &app
  build:
    context: ../..
    dockerfile: deploy/selfhost/Dockerfile
    args:
      # Optional. Left empty, the image stamps itself from the .git in the build
      # context, so a plain `docker compose build` already produces a box that can
      # answer /-/version/. Set these when you build from a tarball (no .git) or
      # want the stamp to name a CI run rather than a working copy:
      #   GIT_COMMIT=$(git rev-parse HEAD) docker compose -f ... build
      GIT_COMMIT: "${GIT_COMMIT:-}"
      BUILD_TIME: "${BUILD_TIME:-}"
      ENVIRONMENT: "${ENVIRONMENT:-}"
  image: runmycampus-selfhost:latest
  env_file: .env
  environment:
    # Service-wired URLs (override any placeholders in .env).
    DATABASE_URL: "postgres://${POSTGRES_USER:-rmc}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@db:5432/${POSTGRES_DB:-runmycampus}"
    REDIS_URL: "redis://valkey:6379/0"
    # Broker is explicit + safe here because a worker service runs below.
    CELERY_BROKER_URL: "redis://valkey:6379/1"
    # Display label for /-/version/, so a support engineer can tell a self-hosted
    # box apart from Render at a glance. Deliberately ENVIRONMENT and NOT
    # DJANGO_ENV: config/settings.py feeds DJANGO_ENV into _IS_CLOUD_DEPLOYED, so
    # labelling an appliance `DJANGO_ENV=production` would silently flip it into
    # hosted-cloud posture — dropping its local Ollama tier and switching on
    # hosted conversion / paid-install enforcement. A label must not route.
    ENVIRONMENT: "${ENVIRONMENT:-selfhost}"
  volumes:
    # PERSIST uploaded media (student/teacher photos, evaluation evidence, logos,
    # receipts, documents). MEDIA_ROOT is /app/media INSIDE the container; without a
    # named volume `docker compose up --build` recreates the web container and WIPES all
    # uploads on every version update. Shared across web/worker/beat so a worker that
    # writes a generated file and the web that serves it agree. Use a bind mount (e.g.
    # `/srv/rmc/media:/app/media`) instead if you back that host path up off-box.
    - mediadata:/app/media
  depends_on:
    db:
      condition: service_healthy
    valkey:
      condition: service_started
  restart: unless-stopped

services:
  db:
    # pgvector/pgvector:pg16 == the official postgres:16 (bookworm) image plus the
    # pgvector extension files preinstalled. Drop-in data-compatible with a volume
    # first initialised by postgres:16-bookworm. Required so migration 0123 (and the
    # opt-in migrate_embeddings_to_pgvector command) can `CREATE EXTENSION vector`
    # instead of crash-looping the web boot on a stock image that lacks it.
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: "${POSTGRES_DB:-runmycampus}"
      POSTGRES_USER: "${POSTGRES_USER:-rmc}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-rmc} -d ${POSTGRES_DB:-runmycampus}"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  valkey:
    # Valkey = the open-source (BSD) Redis fork. Persistent + LRU eviction.
    image: valkey/valkey:8-alpine
    command: ["valkey-server", "--maxmemory-policy", "allkeys-lru", "--appendonly", "yes"]
    volumes:
      - valkeydata:/data
    restart: unless-stopped

  web:
    <<: *app
    command: ["bash", "deploy/selfhost/entrypoint.web.sh"]
    ports:
      - "${WEB_PORT:-10000}:10000"
    # This healthcheck is LOAD-BEARING, not just observability. `/health/` is the AUTO
    # driver for the in-process periodic scheduler (apps.platform_runtime.periodic
    # .maybe_run_due_jobs) — on Render the platform's own probe supplies that tick for
    # free, and until 2026-08-20 nothing supplied it here, because the only healthcheck
    # in this file was on `db`. A box could hold a perfect address, a perfect credential
    # and a resolved school and still never run a single sync cycle, which from the
    # cloud is indistinguishable from a box that is switched off.
    #
    # 30s matches the scheduler's own throttle floor closely enough that a job never
    # waits materially longer than its interval, and is far too cheap to matter: the
    # request thread does a monotonic compare and returns.
    #
    # urllib, not curl — the runtime image is not guaranteed to carry curl, and a
    # healthcheck that fails because its own tool is missing marks a healthy box
    # unhealthy. Python is guaranteed; this is a Django image.
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import sys,urllib.request; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:10000/health/', timeout=5).status == 200 else 1)\""]
      interval: 30s
      timeout: 10s
      retries: 3
      # Migrations run on boot and can take minutes on a cold volume; do not let the
      # container be declared unhealthy while it is legitimately still starting.
      start_period: 180s

  worker:
    <<: *app
    command: ["celery", "-A", "config", "worker", "-l", "info", "--concurrency=${CELERY_WORKER_CONCURRENCY:-2}"]
    # The worker doesn't serve HTTP; it drains the task queue.
    # `inspect ping` is the only check that proves the worker is CONSUMING rather than
    # merely running — a worker attached to the wrong broker DB answers no ping.
    healthcheck:
      test: ["CMD-SHELL", "celery -A config inspect ping -t 10 > /dev/null 2>&1 || exit 1"]
      interval: 60s
      timeout: 15s
      retries: 3
      start_period: 120s

  beat:
    <<: *app
    command: ["celery", "-A", "config", "beat", "-l", "info", "--scheduler", "django_celery_beat.schedulers:DatabaseScheduler"]
    # No HTTP surface and no inspect protocol, so liveness is judged by the thing that
    # actually matters: whether beat is PUBLISHING. `schools.resume_stuck_provisions`
    # (CELERY_BEAT_SCHEDULE, every 120s) is the canary the application already reads to
    # decide whether the in-process scheduler must take over; a beat process that is up
    # but publishing nothing is exactly the state that stopped this box, so checking the
    # process would have proved nothing.
    healthcheck:
      test: ["CMD-SHELL", "python manage.py check_beat_publishing || exit 1"]
      interval: 120s
      timeout: 30s
      retries: 3
      start_period: 180s

volumes:
  pgdata:
  valkeydata:
  mediadata:
