# Self-hosted RunMyCampus — full open-source stack on YOUR server, $0 hosting fees.
# Mirrors the Render topology: web + worker + beat + PostgreSQL + Valkey (Redis).
# All images are open-source (PostgreSQL License / BSD). Nothing here affects the
# Render deployment — this is the future migration target (docs/SELF_HOST_MIGRATION.md).
#
# Run from the repo root (beta/school-management-system/):
#   cp deploy/selfhost/.env.example deploy/selfhost/.env   # then edit secrets
#   docker compose -f deploy/selfhost/docker-compose.yml up -d --build
#
# That bare `up -d` is right for a FIRST run, where RMC_EDGE_TLS_MODE is still
# `off`. Once a box has TLS it is wrong: the terminator below sits behind a
# compose PROFILE, and `up -d` does not start a profiled service -- the stack
# comes back with :10000 answering and :443 dead, saying nothing about why.
# Use deploy/selfhost/box-rebuild.sh, which reads the box's own mode and carries
# --profile tls when there is one to carry.

x-app: &app
  build:
    context: ../..
    dockerfile: deploy/selfhost/Dockerfile
    args:
      # Optional. Left empty, the image stamps itself from the .git in the build
      # context, so a plain `docker compose build` already produces a box that can
      # answer /-/version/. Set these when you build from a tarball (no .git) or
      # want the stamp to name a CI run rather than a working copy:
      #   GIT_COMMIT=$(git rev-parse HEAD) docker compose -f ... build
      GIT_COMMIT: "${GIT_COMMIT:-}"
      BUILD_TIME: "${BUILD_TIME:-}"
      ENVIRONMENT: "${ENVIRONMENT:-}"
  image: runmycampus-selfhost:latest
  env_file: .env
  environment:
    # Service-wired URLs (override any placeholders in .env).
    DATABASE_URL: "postgres://${POSTGRES_USER:-rmc}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@db:5432/${POSTGRES_DB:-runmycampus}"
    REDIS_URL: "redis://valkey:6379/0"
    # Broker is explicit + safe here because a worker service runs below.
    CELERY_BROKER_URL: "redis://valkey:6379/1"
    # Display label for /-/version/, so a support engineer can tell a self-hosted
    # box apart from Render at a glance. Deliberately ENVIRONMENT and NOT
    # DJANGO_ENV: config/settings.py feeds DJANGO_ENV into _IS_CLOUD_DEPLOYED, so
    # labelling an appliance `DJANGO_ENV=production` would silently flip it into
    # hosted-cloud posture — dropping its local Ollama tier and switching on
    # hosted conversion / paid-install enforcement. A label must not route.
    ENVIRONMENT: "${ENVIRONMENT:-selfhost}"
    # PROVENANCE. Deliberately a literal and NOT "${RMC_SELFHOST_STACK:-1}": every
    # other marker that says "this is a box" can be undone by an .env edit, and one
    # school found out what that costs -- reached by IP, not recognised as a box,
    # served the developer urlconf, and shown an operator surface offering to
    # request access into the control plane. This one answers a question about the
    # deployment ("which stack started this process") rather than a preference
    # about it, so there is nothing an operator could legitimately want to set it
    # to. config/deployment_kind.py reads it, and check_edge_readiness uses it to
    # know it is allowed to speak.
    #
    # This does not violate the rule above that a label must not route. That rule
    # guards against a label silently GRANTING hosted-cloud posture; this only ever
    # REMOVES capability -- it takes the control plane away from a box and grants
    # nothing -- and _IS_CLOUD_DEPLOYED still wins over it outright.
    RMC_SELFHOST_STACK: "1"
  volumes:
    # Certificates the box mints for itself (manage.py edge_tls --issue-selfsigned)
    # and the box CA that signs them. A named volume because losing ca.key means
    # every device that trusted this box has to install a new CA by hand.
    - edgetlsdata:/app/var/edge-tls
    # Blue-green OTA releases, when RMC_OTA_RELEASE_ROOT is set. Commented out because
    # the layout is opt-in: without it the box boots from the image tree and a FULL
    # upgrade honestly defers. Uncomment BOTH this and RMC_OTA_RELEASE_ROOT in .env to
    # let a code upgrade swap in one atomic rename instead of waiting for an image
    # rebuild. Budget roughly twice the tree -- ~1GB at the 2026-08-22 measurement of
    # 496MB across 16333 files -- because two releases are kept: the running one and
    # the rollback target (RMC_OTA_RELEASES_KEPT, floored at 2). Older ones are pruned
    # after every successful flip, and a box that cannot spare the room refuses the
    # swap and keeps running rather than filling its disk.
    # - otareleases:/srv/rmc
    # PERSIST uploaded media (student/teacher photos, evaluation evidence, logos,
    # receipts, documents). MEDIA_ROOT is /app/media INSIDE the container; without a
    # named volume `docker compose up --build` recreates the web container and WIPES all
    # uploads on every version update. Shared across web/worker/beat so a worker that
    # writes a generated file and the web that serves it agree. Use a bind mount (e.g.
    # `/srv/rmc/media:/app/media`) instead if you back that host path up off-box.
    - mediadata:/app/media
  depends_on:
    db:
      condition: service_healthy
    valkey:
      condition: service_started
  restart: unless-stopped

services:
  db:
    # pgvector/pgvector:pg16 == the official postgres:16 (bookworm) image plus the
    # pgvector extension files preinstalled. Drop-in data-compatible with a volume
    # first initialised by postgres:16-bookworm. Required so migration 0123 (and the
    # opt-in migrate_embeddings_to_pgvector command) can `CREATE EXTENSION vector`
    # instead of crash-looping the web boot on a stock image that lacks it.
    image: pgvector/pgvector:pg16
    # Postgres ships max_connections=100. A box runs 4 gunicorn workers x 4 threads
    # plus a celery worker and beat, so 100 is tight and the failure is ugly: new
    # requests get "sorry, too many clients already" while the box looks healthy.
    # A knob rather than a literal because the right number follows the hardware --
    # and because a box that edits this file by hand fights every `git pull`, which
    # is exactly how one box arrived 269 commits behind with an unmergeable tree.
    command: ["postgres", "-c", "max_connections=${POSTGRES_MAX_CONNECTIONS:-200}"]
    environment:
      POSTGRES_DB: "${POSTGRES_DB:-runmycampus}"
      POSTGRES_USER: "${POSTGRES_USER:-rmc}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-rmc} -d ${POSTGRES_DB:-runmycampus}"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  valkey:
    # Valkey = the open-source (BSD) Redis fork. Persistent + LRU eviction.
    image: valkey/valkey:8-alpine
    command: ["valkey-server", "--maxmemory-policy", "allkeys-lru", "--appendonly", "yes"]
    volumes:
      - valkeydata:/data
    restart: unless-stopped

  web:
    <<: *app
    command: ["bash", "deploy/selfhost/entrypoint.web.sh"]
    ports:
      - "${WEB_PORT:-10000}:10000"
    # This healthcheck is LOAD-BEARING, not just observability. `/health/` is the AUTO
    # driver for the in-process periodic scheduler (apps.platform_runtime.periodic
    # .maybe_run_due_jobs) — on Render the platform's own probe supplies that tick for
    # free, and until 2026-08-20 nothing supplied it here, because the only healthcheck
    # in this file was on `db`. A box could hold a perfect address, a perfect credential
    # and a resolved school and still never run a single sync cycle, which from the
    # cloud is indistinguishable from a box that is switched off.
    #
    # 30s matches the scheduler's own throttle floor closely enough that a job never
    # waits materially longer than its interval, and is far too cheap to matter: the
    # request thread does a monotonic compare and returns.
    #
    # urllib, not curl — the runtime image is not guaranteed to carry curl, and a
    # healthcheck that fails because its own tool is missing marks a healthy box
    # unhealthy. Python is guaranteed; this is a Django image.
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import sys,urllib.request; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:10000/health/', timeout=5).status == 200 else 1)\""]
      interval: 30s
      timeout: 10s
      retries: 3
      # Migrations run on boot and can take minutes on a cold volume; do not let the
      # container be declared unhealthy while it is legitimately still starting.
      start_period: 180s

  worker:
    <<: *app
    command: ["celery", "-A", "config", "worker", "-l", "info", "--concurrency=${CELERY_WORKER_CONCURRENCY:-2}"]
    # The worker doesn't serve HTTP; it drains the task queue.
    # `inspect ping` is the only check that proves the worker is CONSUMING rather than
    # merely running — a worker attached to the wrong broker DB answers no ping.
    healthcheck:
      test: ["CMD-SHELL", "celery -A config inspect ping -t 10 > /dev/null 2>&1 || exit 1"]
      interval: 60s
      timeout: 15s
      retries: 3
      start_period: 120s

  beat:
    <<: *app
    command: ["celery", "-A", "config", "beat", "-l", "info", "--scheduler", "django_celery_beat.schedulers:DatabaseScheduler"]
    # No HTTP surface and no inspect protocol, so liveness is judged by the thing that
    # actually matters: whether beat is PUBLISHING. `schools.resume_stuck_provisions`
    # (CELERY_BEAT_SCHEDULE, every 120s) is the canary the application already reads to
    # decide whether the in-process scheduler must take over; a beat process that is up
    # but publishing nothing is exactly the state that stopped this box, so checking the
    # process would have proved nothing.
    healthcheck:
      test: ["CMD-SHELL", "python manage.py check_beat_publishing || exit 1"]
      interval: 120s
      timeout: 30s
      retries: 3
      start_period: 180s

  # TLS terminator. OPT-IN: it only starts with `--profile tls`, so an existing
  # plain-HTTP box is completely unaffected by this file until a school chooses
  # otherwise. Which certificate it presents is the school's decision
  # (RMC_EDGE_TLS_MODE: off | selfsigned | provided | acme) -- see
  # docs/EDGE_TLS_RUNBOOK.md and `manage.py edge_tls`.
  #
  # This is what makes "make this device offline ready" possible at all: the offline
  # PIN vault derives its key with crypto.subtle, which browsers withhold outside a
  # secure context, so on plain HTTP it could never seal on ANY browser.
  edge-tls:
    profiles: ["tls"]
    image: caddy:2-alpine
    depends_on:
      web:
        condition: service_started
    ports:
      - "${EDGE_TLS_HTTPS_PORT:-443}:443"
      # 80 is needed for the ACME HTTP-01 challenge and for the plain-HTTP redirect.
      # Harmless on a LAN in the other modes.
      - "${EDGE_TLS_HTTP_PORT:-80}:80"
    volumes:
      # The RENDERED config (gitignored), never the tracked template. See
      # edge-bootstrap.sh: writing a render over a tracked path left every box
      # dirty and unable to pull.
      - ./Caddyfile.edge.rendered:/etc/caddy/Caddyfile:ro
      # Caddy's own local CA (mode=selfsigned with `tls internal`) and any ACME
      # material live here. Losing this volume means every device that installed the
      # box CA has to install the new one, so it is NAMED, not anonymous.
      - edgecaddydata:/data
      - edgecaddyconfig:/config
      # Certificates minted by `manage.py edge_tls --issue-selfsigned`, or files
      # supplied by the school's CA. Shared read-only with the terminator; the web
      # container writes them.
      - edgetlsdata:/app/var/edge-tls:ro
    restart: unless-stopped
    healthcheck:
      # Proves the terminator is actually serving TLS, not merely running. --insecure
      # because in selfsigned / provided mode the container itself has no reason to
      # trust the school's CA -- we are checking the handshake, not the trust chain.
      test: ["CMD-SHELL", "wget -q --spider --no-check-certificate https://127.0.0.1/health/ || exit 1"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 60s

volumes:
  # otareleases:   # uncomment with the mount above + RMC_OTA_RELEASE_ROOT
  pgdata:
  valkeydata:
  mediadata:
  edgetlsdata:
  edgecaddydata:
  edgecaddyconfig:
