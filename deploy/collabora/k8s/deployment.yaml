apiVersion: apps/v1
kind: Deployment
metadata:
  name: collabora
  namespace: collabora
spec:
  replicas: 1
  selector:
    matchLabels:
      app: collabora
  template:
    metadata:
      labels:
        app: collabora
    spec:
      containers:
        - name: collabora
          image: collabora/code:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 9980
          env:
            - name: domain
              valueFrom:
                secretKeyRef:
                  name: collabora-env
                  key: domain
            - name: username
              valueFrom:
                secretKeyRef:
                  name: collabora-env
                  key: username
            - name: password
              valueFrom:
                secretKeyRef:
                  name: collabora-env
                  key: password
            - name: extra_params
              value: "--o:ssl.enable=false --o:ssl.termination=true --o:storage.wopi.host[0]=.*"
          readinessProbe:
            httpGet:
              path: /hosting/discovery
              port: 9980
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /hosting/discovery
              port: 9980
            initialDelaySeconds: 40
            periodSeconds: 20
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "2"
              memory: "2Gi"
