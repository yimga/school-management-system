<?xml version="1.0" encoding="UTF-8"?>
<!--
  v2.79 follow-up — integration brand-mark sprite.

  One <symbol> per CATEGORY (not per connector slug) — we use a category
  glyph as the default so the platform doesn't have to ship 28 brand-owned
  logos that we may not have redistribution rights for. Tenants / operators
  who want real brand logos can drop additional <symbol id="integration-<slug>">
  entries into this file and the template will pick them up automatically
  via the slug-first lookup.

  All glyphs are 24x24, drawn with fill="currentColor" so they pick up the
  text color of the surrounding .rmc-integration-mark__glyph rule (defaults
  to white-on-brand-tile in rmc-class-grammar.css).

  Source: Bootstrap Icons (MIT License) https://icons.getbootstrap.com/
-->
