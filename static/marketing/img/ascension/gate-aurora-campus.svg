<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" role="img" aria-label="Aurora over global campus  illustrative editorial composite">
  <defs>
    <linearGradient id="sky" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1020"/>
      <stop offset="45%" stop-color="#312e81"/>
      <stop offset="100%" stop-color="#c2410c"/>
    </linearGradient>
    <radialGradient id="aurora" cx="50%" cy="35%" r="55%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.55"/>
      <stop offset="60%" stop-color="#fb923c" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#030308" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#14141f" stop-opacity="0"/>
      <stop offset="100%" stop-color="#030308"/>
    </linearGradient>
  </defs>
  <rect width="1920" height="1080" fill="url(#sky)"/>
  <ellipse cx="960" cy="380" rx="820" ry="420" fill="url(#aurora)"/>
  <rect y="620" width="1920" height="460" fill="url(#ground)"/>
  <!-- campus silhouettes -->
  <g fill="#faf7f2" opacity="0.12">
    <rect x="280" y="520" width="120" height="200" rx="4"/>
    <rect x="420" y="480" width="90" height="240" rx="4"/>
    <rect x="540" y="500" width="140" height="220" rx="4"/>
    <rect x="1180" y="490" width="100" height="230" rx="4"/>
    <rect x="1300" y="510" width="160" height="210" rx="4"/>
    <rect x="1480" y="470" width="110" height="250" rx="4"/>
  </g>
  <!-- orbit arcs = data thread -->
  <g fill="none" stroke="#6366f1" stroke-width="2" opacity="0.35">
    <path d="M200 700 Q960 200 1720 700"/>
    <path d="M320 760 Q960 320 1600 760"/>
  </g>
  <g fill="#10b981" opacity="0.85">
    <circle cx="420" cy="620" r="6"/><circle cx="960" cy="480" r="8"/><circle cx="1480" cy="640" r="6"/>
  </g>
  <text x="960" y="920" text-anchor="middle" fill="#faf7f2" opacity="0.35" font-family="Georgia,serif" font-size="28">Illustrative · RunMyCampus Ascension</text>
</svg>
