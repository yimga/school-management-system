<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-labelledby="hero-composite-title hero-composite-desc">
  <title id="hero-composite-title">RunMyCampus: admin command center, teacher workspace, parent mobile portal, student profile, finance, and analytics</title>
  <desc id="hero-composite-desc">Layered dark-glass dashboard composite showing six school software surfaces plus a mobile parent frame.</desc>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c1220"/>
      <stop offset="55%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="glass" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.88"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000" flood-opacity="0.45"/>
    </filter>
    <style>
      .panel { fill: url(#glass); stroke: rgba(148,163,184,0.35); stroke-width: 1.2; rx: 14; filter: url(#shadow); }
      .accent-line { stroke: #f59e0b; stroke-width: 2; fill: none; opacity: 0.9; }
      .bar { fill: #334155; rx: 4; opacity: 0.85; }
      .bar-hot { fill: #f59e0b; opacity: 0.75; rx: 4; }
      .lbl { fill: #f1f5f9; font: 700 12px ui-sans-serif, system-ui, sans-serif; }
      .lbl-sm { fill: #94a3b8; font: 600 10px ui-sans-serif, system-ui, sans-serif; }
      .phone { fill: #020617; stroke: rgba(148,163,184,0.5); stroke-width: 1.5; rx: 18; }
      .shine { fill: url(#glass); opacity: 0.15; }
    </style>
  </defs>
  <rect width="960" height="520" fill="url(#bg)"/>
  <text class="lbl" x="480" y="34" text-anchor="middle" font-size="13">One operating system — leadership, staff, families, finance, and governance</text>

  <!-- Admin command center -->
  <rect class="panel" x="20" y="52" width="288" height="198"/>
  <text class="lbl-sm" x="36" y="76">Admin command center</text>
  <rect class="bar-hot" x="36" y="86" width="72" height="7"/>
  <rect class="bar" x="114" y="86" width="72" height="7"/>
  <rect class="bar" x="192" y="86" width="100" height="7"/>
  <rect class="bar" x="36" y="102" width="120" height="52" opacity="0.7"/>
  <rect class="bar" x="164" y="102" width="128" height="52" opacity="0.55"/>
  <rect class="bar" x="36" y="162" width="256" height="36" opacity="0.65"/>
  <rect class="bar-hot" x="36" y="206" width="110" height="32" opacity="0.5"/>

  <!-- Teacher workspace -->
  <rect class="panel" x="322" y="52" width="300" height="198"/>
  <text class="lbl-sm" x="338" y="76">Teacher workspace</text>
  <rect class="bar" x="338" y="86" width="268" height="10"/>
  <rect class="bar-hot" x="338" y="104" width="84" height="118"/>
  <rect class="bar" x="430" y="104" width="84" height="118"/>
  <rect class="bar" x="522" y="104" width="84" height="56"/>
  <rect class="bar" x="522" y="166" width="84" height="56"/>

  <!-- Analytics & governance -->
  <rect class="panel" x="636" y="52" width="304" height="198"/>
  <text class="lbl-sm" x="652" y="76">Analytics &amp; governance</text>
  <rect class="bar-hot" x="652" y="86" width="140" height="64"/>
  <rect class="bar" x="800" y="86" width="124" height="64"/>
  <rect class="bar" x="652" y="158" width="272" height="10"/>
  <rect class="bar" x="652" y="176" width="88" height="62"/>
  <rect class="bar" x="748" y="176" width="88" height="62"/>
  <rect class="bar" x="844" y="176" width="80" height="62"/>

  <!-- Parent mobile portal -->
  <rect class="phone" x="48" y="278" width="188" height="220"/>
  <rect class="shine" x="58" y="292" width="168" height="28" rx="8"/>
  <text class="lbl-sm" x="142" y="310" text-anchor="middle">Parent mobile</text>
  <rect class="bar" x="68" y="328" width="148" height="9"/>
  <rect class="bar-hot" x="68" y="346" width="148" height="64" opacity="0.55"/>
  <rect class="bar" x="68" y="418" width="68" height="22"/>
  <rect class="bar" x="144" y="418" width="72" height="22"/>

  <!-- Finance & payments -->
  <rect class="panel" x="258" y="278" width="352" height="220"/>
  <text class="lbl-sm" x="274" y="302">Finance &amp; payments</text>
  <rect class="bar" x="274" y="314" width="96" height="58"/>
  <rect class="bar-hot" x="378" y="314" width="96" height="58"/>
  <rect class="bar" x="482" y="314" width="112" height="58"/>
  <rect class="bar" x="274" y="380" width="320" height="11"/>
  <rect class="bar" x="274" y="400" width="320" height="78" opacity="0.7"/>

  <!-- Student profile -->
  <rect class="panel" x="626" y="278" width="314" height="220"/>
  <text class="lbl-sm" x="642" y="302">Student profile</text>
  <rect class="bar" x="642" y="314" width="282" height="34"/>
  <rect class="bar-hot" x="642" y="358" width="130" height="92"/>
  <rect class="bar" x="782" y="358" width="142" height="42"/>
  <rect class="bar" x="782" y="408" width="142" height="42"/>

  <!-- Connector accent -->
  <path class="accent-line" d="M274 268 L400 268 M520 268 L626 268" filter="url(#glow)"/>
</svg>
