<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 340" width="920" height="340" role="img" aria-labelledby="tw-title tw-desc">
  <title id="tw-title">Teacher classroom workspace</title>
  <desc id="tw-desc">Desktop layout with class list, attendance, marks, assignments, lesson coverage, and student notes.</desc>
  <defs>
    <linearGradient id="tw-bg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0c4a6e"/><stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <filter id="tw-sh"><feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000" flood-opacity="0.35"/></filter>
    <style>
      .panel { fill: #0f172a; stroke: #38bdf8; stroke-width: 1; rx: 12; filter: url(#tw-sh); opacity: 0.95; }
      .t { fill: #e0f2fe; font: 700 11px ui-sans-serif, system-ui, sans-serif; }
      .ts { fill: #7dd3fc; font: 600 9px ui-sans-serif, system-ui, sans-serif; }
      .row { fill: #1e3a5f; rx: 3; }
      .hot { fill: #38bdf8; opacity: 0.35; rx: 3; }
    </style>
  </defs>
  <rect width="920" height="340" fill="url(#tw-bg)"/>
  <text class="t" x="460" y="26" text-anchor="middle" font-size="13">Teacher workspace  one surface for the school day</text>
  <rect class="panel" x="24" y="44" width="200" height="280"/>
  <text class="ts" x="40" y="68">Class list</text>
  <rect class="hot" x="40" y="78" width="168" height="14"/>
  <rect class="row" x="40" y="98" width="168" height="10"/>
  <rect class="row" x="40" y="114" width="168" height="10"/>
  <rect class="row" x="40" y="130" width="168" height="10"/>
  <rect class="row" x="40" y="146" width="168" height="10"/>
  <rect class="panel" x="240" y="44" width="300" height="130"/>
  <text class="ts" x="256" y="68">Attendance</text>
  <rect class="hot" x="256" y="80" width="80" height="24" rx="6"/>
  <rect class="row" x="344" y="80" width="80" height="24" rx="6"/>
  <rect class="row" x="432" y="80" width="92" height="24" rx="6"/>
  <rect class="row" x="256" y="112" width="268" height="10"/>
  <rect class="row" x="256" y="128" width="268" height="10"/>
  <rect class="row" x="256" y="144" width="200" height="10"/>
  <rect class="panel" x="240" y="188" width="300" height="136"/>
  <text class="ts" x="256" y="212">Marks &amp; assignments</text>
  <rect class="hot" x="256" y="222" width="130" height="40" rx="6"/>
  <rect class="row" x="394" y="222" width="130" height="40" rx="6"/>
  <rect class="row" x="256" y="272" width="268" height="10"/>
  <rect class="row" x="256" y="288" width="220" height="10"/>
  <rect class="panel" x="556" y="44" width="340" height="130"/>
  <text class="ts" x="572" y="68">Lesson coverage</text>
  <rect class="row" x="572" y="80" width="308" height="10"/>
  <rect class="hot" x="572" y="98" width="200" height="12"/>
  <rect class="row" x="572" y="118" width="308" height="10"/>
  <rect class="row" x="572" y="134" width="260" height="10"/>
  <rect class="row" x="572" y="150" width="308" height="10"/>
  <rect class="panel" x="556" y="188" width="340" height="136"/>
  <text class="ts" x="572" y="212">Student notes</text>
  <rect class="row" x="572" y="222" width="308" height="36"/>
  <rect class="hot" x="572" y="266" width="140" height="44" rx="8"/>
  <rect class="row" x="720" y="266" width="160" height="20"/>
  <rect class="row" x="720" y="292" width="120" height="10"/>
</svg>
