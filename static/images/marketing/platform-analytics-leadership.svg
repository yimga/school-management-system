<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 340" width="920" height="340" role="img" aria-labelledby="an-dash-title an-dash-desc">
  <title id="an-dash-title">Leadership analytics: enrollment, attendance, collection, academic signals</title>
  <desc id="an-dash-desc">Stylized dashboard with trend charts, campus rollups, early-warning panel, and export-ready summary.</desc>
  <defs>
    <linearGradient id="an-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/><stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
    <filter id="an-s"><feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.35"/></filter>
    <style>
      .p { fill: #1e293b; stroke: #475569; rx: 10; filter: url(#an-s); }
      .t { fill: #e0e7ff; font: 700 12px ui-sans-serif, system-ui, sans-serif; }
      .ts { fill: #94a3b8; font: 600 10px ui-sans-serif, system-ui, sans-serif; }
      .bar { fill: #6366f1; opacity: 0.55; rx: 3; }
      .bar2 { fill: #22d3ee; opacity: 0.45; rx: 3; }
      .line { fill: none; stroke: #a5b4fc; stroke-width: 2.5; opacity: 0.9; }
      .warn { fill: #fbbf24; opacity: 0.35; rx: 6; }
    </style>
  </defs>
  <rect width="920" height="340" fill="url(#an-bg)"/>
  <text class="t" x="460" y="28" text-anchor="middle">Leadership intelligence  trends, rollups, early signals</text>
  <rect class="p" x="24" y="48" width="280" height="130"/>
  <text class="ts" x="40" y="72">Enrollment &amp; attendance</text>
  <rect class="bar" x="48" y="92" width="36" height="68"/>
  <rect class="bar2" x="92" y="108" width="36" height="52"/>
  <rect class="bar" x="136" y="84" width="36" height="76"/>
  <rect class="bar2" x="180" y="100" width="36" height="60"/>
  <rect class="p" x="320" y="48" width="360" height="130"/>
  <text class="ts" x="336" y="72">Collection &amp; arrears trend</text>
  <polyline class="line" points="340,150 400,120 460,128 520,95 580,102 640,78 660,88"/>
  <rect class="p" x="696" y="48" width="200" height="130"/>
  <text class="ts" x="712" y="72">Early warning</text>
  <rect class="warn" x="712" y="88" width="168" height="28"/>
  <rect class="warn" x="712" y="124" width="140" height="22" opacity="0.6"/>
  <rect class="p" x="24" y="196" width="872" height="120"/>
  <text class="ts" x="40" y="220">Multi-campus rollup</text>
  <rect class="bar" x="48" y="236" width="120" height="12"/>
  <rect class="bar2" x="48" y="256" width="200" height="12"/>
  <rect class="bar" x="48" y="276" width="160" height="12"/>
  <rect class="bar2" x="320" y="236" width="180" height="12"/>
  <rect class="bar" x="320" y="256" width="240" height="12"/>
</svg>
