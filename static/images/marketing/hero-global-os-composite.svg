<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-labelledby="hero-composite-title hero-composite-desc">
  <title id="hero-composite-title">RunMyCampus product surfaces: leadership analytics, administration, teacher tools, parent mobile, finance, and student portal</title>
  <desc id="hero-composite-desc">Stylized composite of six school software screens in a dark premium layout.</desc>
  <defs>
    <linearGradient id="g" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e293b"/>
      <stop offset="100%" style="stop-color:#0f172a"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.35"/>
    </filter>
    <style>
      .frame { fill: url(#g); stroke: #334155; stroke-width: 1.5; rx: 12; filter: url(#shadow); }
      .accent { stroke: #f59e0b; stroke-width: 2; fill: none; opacity: 0.85; }
      .bar { fill: #334155; rx: 3; }
      .bar-hot { fill: #f59e0b; opacity: 0.9; rx: 3; }
      .lbl { fill: #e2e8f0; font: 600 13px ui-sans-serif, system-ui, sans-serif; }
      .lbl-sm { fill: #94a3b8; font: 11px ui-sans-serif, system-ui, sans-serif; }
      .mobile-notch { fill: #020617; rx: 14; stroke: #475569; stroke-width: 1.5; }
    </style>
  </defs>
  <rect width="960" height="520" fill="#020617"/>
  <text class="lbl" x="480" y="36" text-anchor="middle">Unified school operating system  desktop &amp; mobile</text>
  <!-- Leadership -->
  <rect class="frame" x="24" y="56" width="280" height="200"/>
  <text class="lbl-sm" x="40" y="82">Leadership analytics</text>
  <rect class="bar-hot" x="40" y="96" width="120" height="8"/>
  <rect class="bar" x="168" y="96" width="80" height="8"/>
  <rect class="bar" x="40" y="118" width="240" height="56" opacity="0.65"/>
  <rect class="bar" x="40" y="182" width="110" height="58"/>
  <rect class="bar" x="158" y="182" width="122" height="58"/>
  <!-- Admin -->
  <rect class="frame" x="320" y="56" width="300" height="200"/>
  <text class="lbl-sm" x="336" y="82">Administration</text>
  <rect class="bar" x="336" y="96" width="60" height="8"/>
  <rect class="bar" x="404" y="96" width="60" height="8"/>
  <rect class="bar" x="472" y="96" width="60" height="8"/>
  <rect class="bar" x="336" y="118" width="130" height="70"/>
  <rect class="bar" x="474" y="118" width="130" height="70"/>
  <rect class="bar-hot" x="336" y="198" width="268" height="42" opacity="0.5"/>
  <!-- Teacher -->
  <rect class="frame" x="636" y="56" width="300" height="200"/>
  <text class="lbl-sm" x="652" y="82">Teacher workspace</text>
  <rect class="bar" x="652" y="96" width="268" height="12"/>
  <rect class="bar-hot" x="652" y="120" width="86" height="120"/>
  <rect class="bar" x="746" y="120" width="82" height="120"/>
  <rect class="bar" x="836" y="120" width="84" height="120"/>
  <!-- Parent mobile -->
  <rect class="mobile-notch" x="60" y="288" width="200" height="200"/>
  <rect x="76" y="308" width="168" height="24" rx="6" fill="#1e293b" stroke="#475569"/>
  <text class="lbl-sm" x="160" y="324" text-anchor="middle">Parent portal</text>
  <rect class="bar" x="88" y="346" width="144" height="10"/>
  <rect class="bar-hot" x="88" y="366" width="144" height="72" opacity="0.55"/>
  <rect class="bar" x="88" y="448" width="64" height="24"/>
  <rect class="bar" x="160" y="448" width="72" height="24"/>
  <!-- Finance -->
  <rect class="frame" x="288" y="288" width="340" height="200"/>
  <text class="lbl-sm" x="304" y="314">Finance &amp; fees</text>
  <rect class="bar" x="304" y="328" width="100" height="64"/>
  <rect class="bar-hot" x="412" y="328" width="100" height="64"/>
  <rect class="bar" x="520" y="328" width="92" height="64"/>
  <rect class="bar" x="304" y="402" width="308" height="12"/>
  <rect class="bar" x="304" y="424" width="308" height="48" opacity="0.7"/>
  <!-- Student -->
  <rect class="frame" x="652" y="288" width="284" height="200"/>
  <text class="lbl-sm" x="668" y="314">Student portal</text>
  <rect class="bar" x="668" y="328" width="252" height="36"/>
  <rect class="bar-hot" x="668" y="376" width="120" height="96"/>
  <rect class="bar" x="796" y="376" width="124" height="44"/>
  <rect class="bar" x="796" y="428" width="124" height="44"/>
  <path class="accent" d="M304 276 L476 276 L476 244 M556 244 L556 276 L728 276"/>
</svg>
