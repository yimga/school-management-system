; pytest config for RunMyCampus.
;
; 12-pillar audit P12 follow-up. Establishes the platform's first
; commit-pinned test config. Coverage thresholds, markers, and
; reporting defaults live here so they survive across waves.
;
; Coverage targets (per-app, ramp from current baseline):
;   apps/analytics/   ≥ 80%
;   apps/finance/     ≥ 85%
;   apps/security/    ≥ 90%
;   apps/api/         ≥ 75%
;   (others)          ≥ 60%   (platform-wide floor)
;
; Enforcement is OFF by default (coverage runs are opt-in via
; `pytest --cov`); operators add `--cov-fail-under=60` in the CI
; matrix once the coverage tool is wired. This file declares the
; thresholds; the wire-up is the next operator action.

[pytest]
DJANGO_SETTINGS_MODULE = config.settings
python_files = test_*.py *_test.py *_tests.py
python_classes = Test* *Tests
python_functions = test_*
addopts =
    --strict-markers
    --tb=short
    -ra

; Markers used across the platform. Adding a new marker without
; declaring it here fails --strict-markers.
markers =
    slow: tests > 5s individually; skip in fast PR matrix.
    flaky: known intermittent; gated by RUN_FLAKY_TESTS=1.
    integration: hits a real external service (Sentry, Stripe sandbox, etc).
    e2e: Playwright / browser-driving smoke tests.
    ai_live_ollama: tests that require a running Ollama service (CI: ai-live-ollama.yml).
    requires_postgres: tests that need a real Postgres backend (CI: tenant-isolation, pgvector-readiness).
    visual_truth: marketing visual-regression tests (CI: marketing-visual-truth).

; Coverage thresholds. Caller passes --cov to activate.
; These are *advisory* until CI bumps --cov-fail-under against the
; per-app target -- the baseline shape below documents the intent.
;
; [tool.coverage.report]
;   precision = 1
;   show_missing = true
;   fail_under = 60
;
; Per-app overrides live in .coveragerc when the operator turns on
; the gate. The current floor (60%) is platform-wide; tightening
; apps/finance to 85% and apps/security to 90% is a follow-up PR
; after the first coverage run lands the numbers we actually have.

filterwarnings =
    ignore::DeprecationWarning:django.*
    ignore::PendingDeprecationWarning
