# Render Blueprint: Web Service + PostgreSQL + Redis + Celery Worker + Beat
# Set EMAIL_HOST_USER and EMAIL_HOST_PASSWORD in Dashboard for real SMTP (delegate/summary emails).
#
# Pre-Deploy: With USE_DJANGO_TENANTS=1 the service MUST use preDeployCommand below
# (migrate_schemas --shared then --tenant). Do not override with "migrate" or deploy will fail.
#
# Health: healthCheckPath uses /health/. /status/ is also a health endpoint on all hosts.
# Marketing trust/uptime page on public host is /uptime/ (not /status/).
services:
  - type: web
    name: school-management-system
    env: python
    plan: free
    buildCommand: "./build.sh"
    preDeployCommand: "./scripts/release/render_predeploy.sh"
    startCommand: "bash ./scripts/release/render_start_web.sh"
    healthCheckPath: /health/
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: school-management-db
          property: connectionString
      - key: DEBUG
        value: "0"
      - key: PYTHON_VERSION
        value: "3.12.3"
      - key: ALLOWED_HOSTS
        value: "runmycampus.com,.runmycampus.com,school-management-system-2kzk.onrender.com"
      - key: MULTI_TENANT_BASE_DOMAIN
        value: "runmycampus.com"
      - key: MULTI_TENANT_LEGACY_BASE_DOMAINS
        value: ""
      - key: CSRF_TRUSTED_ORIGINS
        value: "https://runmycampus.com,https://*.runmycampus.com,https://school-management-system-2kzk.onrender.com"
      - key: SESSION_COOKIE_DOMAIN
        value: ".runmycampus.com"
      - key: CSRF_COOKIE_DOMAIN
        value: ".runmycampus.com"
      - key: USE_DJANGO_TENANTS
        value: "1"
      - key: SECURE_SSL_REDIRECT
        value: "1"
      - key: SECRET_KEY
        generateValue: true
      - key: APPLY_UI_FIXTURE_ON_DEPLOY
        value: "1"
      - key: RUN_INTEGRATION_PREFLIGHT
        value: "1"
      # Seed marketplace/catalog/Studio on every deploy so changes appear after deploy (see docs/CHANGES_NOT_VISIBLE_AFTER_DEPLOY.md)
      - key: RUN_BOOTSTRAP_PLATFORM_CATALOG
        value: "1"
      - key: REDIS_URL
        fromService:
          type: redis
          name: school-management-redis
          property: connectionString
      - key: CELERY_BROKER_URL
        fromService:
          type: redis
          name: school-management-redis
          property: connectionString
      # Email (delegate notifications, delegation summary on return). Set in Dashboard if sending real email.
      - key: EMAIL_BACKEND
        value: "django.core.mail.backends.smtp.EmailBackend"
      - key: EMAIL_HOST
        value: "smtp.gmail.com"
      - key: EMAIL_PORT
        value: "587"
      - key: EMAIL_USE_TLS
        value: "True"
      - key: DEFAULT_FROM_EMAIL
        value: "noreply@runmycampus.com"
      # Set EMAIL_HOST_USER and EMAIL_HOST_PASSWORD in Dashboard (secrets) for real SMTP.

  - type: worker
    name: school-management-system-worker
    env: python
    plan: free
    buildCommand: "./build.sh"
    startCommand: ".venv/bin/celery -A config worker -l info --concurrency=${CELERY_WORKER_CONCURRENCY:-2}"
    envVars:
      - key: DEBUG
        value: "0"
      - key: PYTHON_VERSION
        value: "3.12.3"
      - key: DJANGO_SETTINGS_MODULE
        value: "config.settings"
      - key: MULTI_TENANT_BASE_DOMAIN
        value: "runmycampus.com"
      - key: MULTI_TENANT_LEGACY_BASE_DOMAINS
        value: ""
      - key: SECRET_KEY
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: school-management-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: school-management-redis
          property: connectionString
      - key: CELERY_BROKER_URL
        fromService:
          type: redis
          name: school-management-redis
          property: connectionString
  - type: worker
    name: school-management-system-beat
    env: python
    plan: free
    buildCommand: "./build.sh"
    startCommand: ".venv/bin/celery -A config beat -l info --scheduler django_celery_beat.schedulers:DatabaseScheduler"
    envVars:
      - key: DEBUG
        value: "0"
      - key: PYTHON_VERSION
        value: "3.12.3"
      - key: DJANGO_SETTINGS_MODULE
        value: "config.settings"
      - key: MULTI_TENANT_BASE_DOMAIN
        value: "runmycampus.com"
      - key: MULTI_TENANT_LEGACY_BASE_DOMAINS
        value: ""
      - key: SECRET_KEY
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: school-management-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: school-management-redis
          property: connectionString
      - key: CELERY_BROKER_URL
        fromService:
          type: redis
          name: school-management-redis
          property: connectionString
  - type: redis
    name: school-management-redis
    plan: free

databases:
  - name: school-management-db
    plan: free
