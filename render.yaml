# Render Blueprint: Web Service + PostgreSQL + Redis + Celery Worker + Beat
# Outbound mail: set EMAIL_HOST_USER + EMAIL_HOST_PASSWORD on WEB *and* WORKER (see docs/RENDER_EMAIL_SETUP.md).
# Recommended free SMTP: Brevo — smtp-relay.brevo.com:587 (≈300 emails/day).
#
# Pre-Deploy: With USE_DJANGO_TENANTS=1 the service MUST use preDeployCommand below
# (migrate_schemas --shared then --tenant). Do not override with "migrate" or deploy will fail.
#
# Health: healthCheckPath uses /health/. /status/ is also a health endpoint on all hosts.
# Marketing trust/uptime page on public host is /uptime/ (not /status/).
services:
  - type: web
    name: school-management-system
    env: python
    # FREE tier (512MB/0.1CPU) = a single gunicorn worker. The fix for the
    # /health/ thread-starvation restart loop is the SSE concurrency cap in
    # services/sse_wsgi_limits.py (free code), NOT a paid upgrade: the reserve
    # below keeps threads free for /health/ + normal requests even when streams
    # are open. Do NOT raise WEB_CONCURRENCY above 1 on free (2 workers OOM
    # 512MB). More SSE headroom comes from GUNICORN_THREADS, not more workers.
    plan: free
    buildCommand: "./build.sh"
    preDeployCommand: "./scripts/release/render_predeploy.sh"
    startCommand: "bash ./scripts/release/render_start_web.sh"
    healthCheckPath: /health/
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: school-management-db
          property: connectionString
      - key: DEBUG
        value: "0"
      - key: GUNICORN_TIMEOUT
        value: "120"
      - key: GUNICORN_WORKER_CLASS
        value: "gthread"
      # Stay at 1 on free tier — a 2nd worker OOMs 512MB.
      - key: WEB_CONCURRENCY
        value: "1"
      # More gthread threads = more SSE headroom on the single free worker at
      # $0 (threads are cheap, mostly I/O-bound here). 8 - SSE_THREAD_RESERVE(2)
      # = 6 concurrent SSE slots, with 2 threads always reserved for /health/.
      - key: GUNICORN_THREADS
        value: "8"
      # SSE streams may use at most (GUNICORN_THREADS - SSE_THREAD_RESERVE)
      # threads; the reserve guarantees /health/ + normal requests always have one.
      - key: SSE_THREAD_RESERVE
        value: "2"
      - key: RUN_STARTUP_SCHEMA_CHECK
        value: "0"
      - key: PYTHON_VERSION
        value: "3.12.3"
      - key: ALLOWED_HOSTS
        value: "runmycampus.com,.runmycampus.com,school-management-system-2kzk.onrender.com"
      - key: MULTI_TENANT_BASE_DOMAIN
        value: "runmycampus.com"
      - key: MULTI_TENANT_LEGACY_BASE_DOMAINS
        value: ""
      - key: CSRF_TRUSTED_ORIGINS
        value: "https://runmycampus.com,https://*.runmycampus.com,https://school-management-system-2kzk.onrender.com"
      - key: SESSION_COOKIE_DOMAIN
        value: ".runmycampus.com"
      - key: CSRF_COOKIE_DOMAIN
        value: ".runmycampus.com"
      - key: USE_DJANGO_TENANTS
        value: "1"
      - key: OAUTH_CALLBACK_BASE_URL
        value: "https://manager.runmycampus.com"
      - key: MANAGER_PLATFORM_BASE_URL
        value: "https://manager.runmycampus.com"
      - key: SECURE_SSL_REDIRECT
        value: "1"
      - key: SECRET_KEY
        generateValue: true
      # ── Per-deploy seeding: OFF for steady-state production ──────────────
      # These ran heavy, sometimes destructive work on EVERY deploy (SEED_DEMO
      # does `seed_demo --reset`), bloating boot time and memory. The DB is
      # already seeded, so steady-state deploys only need migrations +
      # seed_render_users + collectstatic (all kept, always-on in predeploy).
      # When you actually change catalog/UI/fixtures, run the matching command
      # manually — see docs/DEPLOY_SEEDING_MANUAL_RUNBOOK.md. On a brand-new
      # environment, flip the relevant flag to "1" for the first deploy only.
      - key: APPLY_UI_FIXTURE_ON_DEPLOY
        value: "0"
      - key: RUN_BOOTSTRAP_PLATFORM_CATALOG
        value: "0"
      - key: SEED_DEMO
        value: "0"
      - key: RUN_PLATFORM_SEED
        value: "0"
      - key: RUN_PGVECTOR_MIGRATE
        value: "0"
      # Kept ON: cheap pre-traffic safety gate (fails only on misconfigured
      # feature flags), not seeding.
      - key: RUN_INTEGRATION_PREFLIGHT
        value: "1"
      - key: COLLABORA_BASE_URL
        value: ""
      - key: WOPI_SHARED_SECRET
        sync: false
      - key: REDIS_URL
        fromService:
          type: redis
          name: school-management-redis
          property: connectionString
      - key: CELERY_BROKER_URL
        fromService:
          type: redis
          name: school-management-redis
          property: connectionString
      # Email — Brevo SMTP defaults; set EMAIL_HOST_USER + EMAIL_HOST_PASSWORD in Dashboard (secrets).
      - key: EMAIL_BACKEND
        value: "django.core.mail.backends.smtp.EmailBackend"
      - key: EMAIL_HOST
        value: "smtp-relay.brevo.com"
      - key: EMAIL_PORT
        value: "587"
      - key: EMAIL_USE_TLS
        value: "True"
      - key: DEFAULT_FROM_EMAIL
        value: "noreply@runmycampus.com"
      # EMAIL_HOST_USER / EMAIL_HOST_PASSWORD: Brevo SMTP key (see docs/RENDER_EMAIL_SETUP.md).
      # Tenant lifecycle / offboarding (Lane 2) — explicit defaults; see docs/TENANT_OFFBOARDING.md
      - key: TENANT_SELF_SERVICE_OFFBOARDING_ENABLED
        value: "1"
      - key: TENANT_AUTO_PURGE_ENABLED
        value: "0"
      - key: TENANT_AUTO_PURGE_GRACE_DAYS
        value: "30"
      - key: TENANT_OFFBOARDING_EMAIL_ENABLED
        value: "1"
      - key: TENANT_OFFBOARDING_NOTIFY_TENANT_ADMINS
        value: "1"
      - key: TENANT_OFFBOARDING_S3_CLEANUP_ENABLED
        value: "1"

  - type: worker
    name: school-management-system-worker
    env: python
    plan: free
    buildCommand: "./build.sh"
    startCommand: ".venv/bin/celery -A config worker -l info --concurrency=${CELERY_WORKER_CONCURRENCY:-2}"
    envVars:
      - key: DEBUG
        value: "0"
      - key: PYTHON_VERSION
        value: "3.12.3"
      - key: DJANGO_SETTINGS_MODULE
        value: "config.settings"
      - key: MULTI_TENANT_BASE_DOMAIN
        value: "runmycampus.com"
      - key: MULTI_TENANT_LEGACY_BASE_DOMAINS
        value: ""
      - key: SECRET_KEY
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: school-management-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: school-management-redis
          property: connectionString
      - key: CELERY_BROKER_URL
        fromService:
          type: redis
          name: school-management-redis
          property: connectionString
      # Same SMTP as web — welcome email sends from this worker after provisioning.
      - key: EMAIL_BACKEND
        value: "django.core.mail.backends.smtp.EmailBackend"
      - key: EMAIL_HOST
        value: "smtp-relay.brevo.com"
      - key: EMAIL_PORT
        value: "587"
      - key: EMAIL_USE_TLS
        value: "True"
      - key: DEFAULT_FROM_EMAIL
        value: "noreply@runmycampus.com"
      - key: TENANT_SELF_SERVICE_OFFBOARDING_ENABLED
        value: "1"
      - key: TENANT_AUTO_PURGE_ENABLED
        value: "0"
      - key: TENANT_AUTO_PURGE_GRACE_DAYS
        value: "30"
      - key: TENANT_OFFBOARDING_EMAIL_ENABLED
        value: "1"
      - key: TENANT_OFFBOARDING_NOTIFY_TENANT_ADMINS
        value: "1"
      - key: TENANT_OFFBOARDING_S3_CLEANUP_ENABLED
        value: "1"
  - type: worker
    name: school-management-system-beat
    env: python
    plan: free
    buildCommand: "./build.sh"
    startCommand: ".venv/bin/celery -A config beat -l info --scheduler django_celery_beat.schedulers:DatabaseScheduler"
    envVars:
      - key: DEBUG
        value: "0"
      - key: PYTHON_VERSION
        value: "3.12.3"
      - key: DJANGO_SETTINGS_MODULE
        value: "config.settings"
      - key: MULTI_TENANT_BASE_DOMAIN
        value: "runmycampus.com"
      - key: MULTI_TENANT_LEGACY_BASE_DOMAINS
        value: ""
      - key: SECRET_KEY
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: school-management-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: school-management-redis
          property: connectionString
      - key: CELERY_BROKER_URL
        fromService:
          type: redis
          name: school-management-redis
          property: connectionString
      - key: TENANT_AUTO_PURGE_ENABLED
        value: "0"
      - key: TENANT_AUTO_PURGE_GRACE_DAYS
        value: "30"
  - type: redis
    name: school-management-redis
    plan: free

databases:
  - name: school-management-db
    plan: free
