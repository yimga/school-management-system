# Render Blueprint: Web Service + PostgreSQL
# Set DATABASE_URL in Dashboard → Environment (Internal DB URL from your Postgres).
services:
  - type: web
    name: school-management-system
    env: python
    plan: free
    buildCommand: "./build.sh"
    preDeployCommand: ".venv/bin/python manage.py migrate --noinput && .venv/bin/python manage.py seed_admin_dashboard_palettes && if [ \"${APPLY_UI_FIXTURE_ON_DEPLOY:-1}\" = \"1\" ] && [ -f fixtures/ui_config.json ]; then .venv/bin/python manage.py import_ui_config fixtures/ui_config.json; fi && .venv/bin/python manage.py normalize_ui_config"
    startCommand: ".venv/bin/gunicorn config.wsgi:application --bind 0.0.0.0:$PORT"
    envVars:
      - key: DEBUG
        value: "0"
      - key: PYTHON_VERSION
        value: "3.12.3"
      - key: ALLOWED_HOSTS
        value: "school-management-system-2kzk.onrender.com"
      - key: SECRET_KEY
        generateValue: true
      - key: APPLY_UI_FIXTURE_ON_DEPLOY
        value: "1"
      - key: REDIS_URL
        fromService:
          type: redis
          name: school-management-redis
          property: connectionString
      - key: CELERY_BROKER_URL
        fromService:
          type: redis
          name: school-management-redis
          property: connectionString
  - type: worker
    name: school-management-system-worker
    env: python
    plan: free
    buildCommand: "./build.sh"
    startCommand: ".venv/bin/celery -A config worker -l info --concurrency=${CELERY_WORKER_CONCURRENCY:-2}"
    envVars:
      - key: DEBUG
        value: "0"
      - key: PYTHON_VERSION
        value: "3.12.3"
      - key: DJANGO_SETTINGS_MODULE
        value: "config.settings"
      - key: SECRET_KEY
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: school-management-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: school-management-redis
          property: connectionString
      - key: CELERY_BROKER_URL
        fromService:
          type: redis
          name: school-management-redis
          property: connectionString
  - type: worker
    name: school-management-system-beat
    env: python
    plan: free
    buildCommand: "./build.sh"
    startCommand: ".venv/bin/celery -A config beat -l info --scheduler django_celery_beat.schedulers:DatabaseScheduler"
    envVars:
      - key: DEBUG
        value: "0"
      - key: PYTHON_VERSION
        value: "3.12.3"
      - key: DJANGO_SETTINGS_MODULE
        value: "config.settings"
      - key: SECRET_KEY
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: school-management-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: school-management-redis
          property: connectionString
      - key: CELERY_BROKER_URL
        fromService:
          type: redis
          name: school-management-redis
          property: connectionString
  - type: redis
    name: school-management-redis
    plan: free

databases:
  - name: school-management-db
    plan: free
