# Render Blueprint: Web Service + PostgreSQL + Valkey (cache/sessions).
# Worker + Beat are present but COMMENTED OUT (no-worker, cost-minimal default —
# background tasks run eager/inline). See the worker section to enable them.
# Outbound mail: set EMAIL_HOST_USER + EMAIL_HOST_PASSWORD on WEB *and* WORKER (see docs/RENDER_EMAIL_SETUP.md).
# Recommended free SMTP: Brevo — smtp-relay.brevo.com:587 (≈300 emails/day).
#
# Pre-Deploy: With USE_DJANGO_TENANTS=1 the service MUST use preDeployCommand below
# (migrate_schemas --shared then --tenant). Do not override with "migrate" or deploy will fail.
#
# Health: healthCheckPath uses /health/. /status/ is also a health endpoint on all hosts.
# Marketing trust/uptime page on public host is /uptime/ (not /status/).
services:
  - type: web
    name: school-management-system
    env: python
    # Standard (2GB/1CPU). 2 workers x 4 threads + the SSE concurrency cap
    # (services/sse_wsgi_limits) keep threads free for /health/ and normal
    # requests even under live SSE load — the fix for the restart loop. Threads
    # kept at 4 (not higher) to stay within the DB connection budget:
    # 2 workers x 4 + Celery(2) + beat ~= 12 connections.
    plan: standard
    buildCommand: "./build.sh"
    preDeployCommand: "./scripts/release/render_predeploy.sh"
    startCommand: "bash ./scripts/release/render_start_web.sh"
    healthCheckPath: /health/
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: school-management-db
          property: connectionString
      - key: DEBUG
        value: "0"
      - key: DB_CONN_MAX_AGE
        value: "120"
      - key: DB_CONNECT_TIMEOUT
        value: "10"
      - key: GUNICORN_TIMEOUT
        value: "120"
      - key: GUNICORN_WORKER_CLASS
        value: "gthread"
      # ── Resource-aware autoscaling (services/web_runtime.py) ───────────────
      # Workers are computed from the container's DETECTED RAM/CPU (cgroup-aware)
      # bounded by the DB connection budget below — not a fixed number. On this
      # Standard plan (2GB/1CPU) that resolves to ~2 workers (memory-bound),
      # matching the previous hand-tuned value, but it auto-adjusts if you change
      # the instance size. To pin an explicit count, set GUNICORN_WORKERS=<n>
      # (digits only); to disable autoscaling, set GUNICORN_AUTOSCALE=0.
      - key: GUNICORN_AUTOSCALE
        value: "1"
      - key: GUNICORN_PER_WORKER_MB
        value: "600"
      - key: GUNICORN_MEM_HEADROOM_MB
        value: "400"
      - key: GUNICORN_MAX_WORKERS
        value: "4"
      # Basic Postgres has a small connection cap. workers*threads is held below
      # this so the app never trips "FATAL: too many connections". Celery
      # worker+beat consume their own connections separately — keep this < the
      # DB max minus that reserve. Raise only after upgrading the DB tier.
      - key: DB_MAX_APP_CONNECTIONS
        value: "12"
      - key: GUNICORN_THREADS
        value: "4"
      # SSE streams may use at most (GUNICORN_THREADS - SSE_THREAD_RESERVE)
      # threads per worker; the reserve guarantees /health/ always has one.
      - key: SSE_THREAD_RESERVE
        value: "2"
      # ── Crash-loop guards (the 502/503 fix) ────────────────────────────────
      # Recycle each worker every ~MAX_REQUESTS (+jitter so they don't all
      # recycle at once) to bound slow memory growth -> stops OOM (502) loops.
      - key: GUNICORN_MAX_REQUESTS
        value: "400"
      - key: GUNICORN_MAX_REQUESTS_JITTER
        value: "80"
      # Fork workers from a preloaded master (copy-on-write) -> less RAM/worker.
      - key: GUNICORN_PRELOAD
        value: "1"
      # Give in-flight requests time to finish when a worker recycles/restarts.
      - key: GUNICORN_GRACEFUL_TIMEOUT
        value: "30"
      - key: RUN_STARTUP_SCHEMA_CHECK
        value: "0"
      - key: PYTHON_VERSION
        value: "3.12.3"
      - key: ALLOWED_HOSTS
        value: "runmycampus.com,.runmycampus.com,school-management-system-2kzk.onrender.com"
      - key: MULTI_TENANT_BASE_DOMAIN
        value: "runmycampus.com"
      - key: MULTI_TENANT_LEGACY_BASE_DOMAINS
        value: ""
      - key: CSRF_TRUSTED_ORIGINS
        value: "https://runmycampus.com,https://*.runmycampus.com,https://school-management-system-2kzk.onrender.com"
      - key: SESSION_COOKIE_DOMAIN
        value: ".runmycampus.com"
      - key: CSRF_COOKIE_DOMAIN
        value: ".runmycampus.com"
      - key: USE_DJANGO_TENANTS
        value: "1"
      - key: OAUTH_CALLBACK_BASE_URL
        value: "https://manager.runmycampus.com"
      - key: MANAGER_PLATFORM_BASE_URL
        value: "https://manager.runmycampus.com"
      - key: SECURE_SSL_REDIRECT
        value: "1"
      - key: SECRET_KEY
        generateValue: true
      # ── Per-deploy seeding: OFF for steady-state production ──────────────
      # These ran heavy, sometimes destructive work on EVERY deploy (SEED_DEMO
      # does `seed_demo --reset`), bloating boot time and memory. The DB is
      # already seeded, so steady-state deploys only need migrations +
      # seed_render_users + collectstatic (all kept, always-on in predeploy).
      # When you actually change catalog/UI/fixtures, run the matching command
      # manually — see docs/DEPLOY_SEEDING_MANUAL_RUNBOOK.md. On a brand-new
      # environment, flip the relevant flag to "1" for the first deploy only.
      - key: APPLY_UI_FIXTURE_ON_DEPLOY
        value: "0"
      - key: RUN_BOOTSTRAP_PLATFORM_CATALOG
        value: "0"
      - key: SEED_DEMO
        value: "0"
      - key: RUN_PLATFORM_SEED
        value: "0"
      # Starter Knowledge Base articles (per-tenant content). OFF by default —
      # flip to "1" for a one-time backfill when you want tenant KBs populated.
      # Idempotent (get_or_create on slug); seeds every tenant schema.
      - key: RUN_SEED_KB_ARTICLES
        value: "0"
      - key: RUN_PGVECTOR_MIGRATE
        value: "0"
      # Kept ON: cheap pre-traffic safety gate (fails only on misconfigured
      # feature flags), not seeding.
      - key: RUN_INTEGRATION_PREFLIGHT
        value: "1"
      - key: COLLABORA_BASE_URL
        value: ""
      - key: WOPI_SHARED_SECRET
        sync: false
      # ── Cache / sessions (production foundation) ────────────────────────────
      # REDIS_URL wires a Render Key Value (Valkey, the open-source Redis fork).
      # When set it backs the CACHE + cache-SESSIONS only (moving sessions off
      # Postgres) — it does NOT auto-enable the task broker. Safe to set even
      # without a worker; tasks keep running inline (eager). This is the
      # cost-minimal default topology: web + Valkey + Postgres, NO worker.
      - key: REDIS_URL
        fromService:
          type: redis
          name: school-management-redis
          property: connectionString
      - key: CELERY_BROKER_URL
        fromService:
          type: redis
          name: school-management-redis
          property: connectionString
      # Worker + beat services below drain this broker (never set broker without workers).
      # Broker publish resilience (crash-loop guard, broker side) — code defaults
      # live in config/settings.py; surfaced here so they're tunable. A web-request
      # .delay() fails fast instead of hanging when the broker is briefly slow.
      - key: CELERY_BROKER_CONNECT_TIMEOUT
        value: "2"
      - key: CELERY_BROKER_SOCKET_TIMEOUT
        value: "4"
      # Redis socket bounds for the cache/session client (django_redis). With
      # IGNORE_EXCEPTIONS a stalled cache degrades to a clean miss, never a hang.
      - key: REDIS_SOCKET_CONNECT_TIMEOUT
        value: "2"
      - key: REDIS_SOCKET_TIMEOUT
        value: "3"
      # Email — Brevo SMTP defaults; set EMAIL_HOST_USER + EMAIL_HOST_PASSWORD in Dashboard (secrets).
      - key: EMAIL_BACKEND
        value: "django.core.mail.backends.smtp.EmailBackend"
      - key: EMAIL_HOST
        value: "smtp-relay.brevo.com"
      - key: EMAIL_PORT
        value: "587"
      - key: EMAIL_USE_TLS
        value: "True"
      - key: DEFAULT_FROM_EMAIL
        value: "noreply@runmycampus.com"
      # EMAIL_HOST_USER / EMAIL_HOST_PASSWORD: Brevo SMTP login + key (see docs/RENDER_EMAIL_SETUP.md).
      # Declared sync:false so Render prompts for them as secrets — REQUIRED for
      # real delivery; until both are set, prod mail silently no-ops at SMTP auth.
      - key: EMAIL_HOST_USER
        sync: false
      - key: EMAIL_HOST_PASSWORD
        sync: false
      # Operator alert recipient (audit H8) — matrix operator alerts (signup-
      # verification-stale, workflow-stuck/failed, SLA breach) + Django 500
      # mails dead-end without this. Set to the ops inbox in the Dashboard.
      - key: RMC_OPERATOR_ALERT_EMAIL
        sync: false
      - key: RMC_REBAC_ENFORCE_SENSITIVE
        value: "1"
      - key: RMC_REBAC_ENABLED
        value: "1"
      # Legal sender identity for email footers (CAN-SPAM / CASL / GDPR — audit).
      - key: RMC_COMPANY_LEGAL_NAME
        value: "RunMyCampus"
      - key: RMC_COMPANY_POSTAL_ADDRESS
        sync: false
      - key: RMC_PUBLIC_SITE_URL
        value: "https://runmycampus.com"
      # Durable Celery mail tasks — requires an always-on worker. Default "0"
      # for the no-worker topology (mail sends inline via eager execution).
      # Flip to "1" only when the worker service below is enabled (see the
      # CELERY_BROKER_URL note above).
      - key: SCHOOLOPS_EMAIL_ASYNC_USE_CELERY
        value: "1"
      # Web Push (optional) — portal-ready browser notifications after owner subscribes.
      - key: WEB_PUSH_VAPID_PUBLIC_KEY
        sync: false
      - key: WEB_PUSH_VAPID_PRIVATE_KEY
        sync: false
      - key: WEB_PUSH_VAPID_CLAIMS_EMAIL
        value: "mailto:ops@runmycampus.com"
      # Tenant lifecycle / offboarding (Lane 2) — explicit defaults; see docs/TENANT_OFFBOARDING.md
      - key: TENANT_SELF_SERVICE_OFFBOARDING_ENABLED
        value: "0"
      - key: TENANT_AUTO_PURGE_ENABLED
        value: "0"
      - key: TENANT_AUTO_PURGE_GRACE_DAYS
        value: "30"
      - key: TENANT_OFFBOARDING_EMAIL_ENABLED
        value: "1"
      - key: TENANT_OFFBOARDING_NOTIFY_TENANT_ADMINS
        value: "1"
      - key: TENANT_OFFBOARDING_S3_CLEANUP_ENABLED
        value: "1"
      # ── Scheduling without a worker ─────────────────────────────────────────
      # In-process periodic scheduler ("Celery beat without a worker"): light,
      # idempotent jobs (e.g. the weekly benchmark-cohort recompute) are run off
      # the constantly-pinged /health/ probe in a non-blocking background thread,
      # cross-worker-locked via the Valkey cache. Mode "auto" (default) =
      # ENABLED only while CELERY_BROKER_URL is unset, so it stands down
      # automatically the moment a real worker+beat are provisioned (no double
      # runs, no code change). Force with "on"/"off" if ever needed.
      - key: RMC_INPROCESS_SCHEDULER
        value: "auto"
      # Secured cron trigger (Option 2): shared secret for /api/internal/cron/run/
      # so a FREE external scheduler (GitHub Actions cron / cron-job.org) or the
      # Render cron service below can drive the registry — including heavier jobs.
      # generateValue makes Render mint a strong random token; copy it into the
      # external scheduler's secret (e.g. GitHub Actions secret INTERNAL_CRON_TOKEN).
      - key: INTERNAL_CRON_TOKEN
        generateValue: true

  # ══════════════════════════════════════════════════════════════════════════
  # WORKER + BEAT — enabled (paired with CELERY_BROKER_URL on web above).
  # ~$7/mo each on Render starter; RMC_INPROCESS_SCHEDULER=auto stands down
  # when the broker is present so periodic jobs are not double-run.
  # ══════════════════════════════════════════════════════════════════════════
  - type: worker
    name: school-management-system-worker
    env: python
    plan: starter
    buildCommand: "./build.sh"
    startCommand: ".venv/bin/celery -A config worker -l info --concurrency=${CELERY_WORKER_CONCURRENCY:-2}"
    envVars:
      - key: DEBUG
        value: "0"
      - key: PYTHON_VERSION
        value: "3.12.3"
      - key: DJANGO_SETTINGS_MODULE
        value: "config.settings"
      - key: MULTI_TENANT_BASE_DOMAIN
        value: "runmycampus.com"
      - key: MULTI_TENANT_LEGACY_BASE_DOMAINS
        value: ""
      - key: SECRET_KEY
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: school-management-db
          property: connectionString
      - key: DB_CONN_MAX_AGE
        value: "120"
      - key: DB_CONNECT_TIMEOUT
        value: "10"
      - key: REDIS_URL
        fromService:
          type: redis
          name: school-management-redis
          property: connectionString
      - key: CELERY_BROKER_URL
        fromService:
          type: redis
          name: school-management-redis
          property: connectionString
      - key: CELERY_BROKER_CONNECT_TIMEOUT
        value: "2"
      - key: CELERY_BROKER_SOCKET_TIMEOUT
        value: "4"
      - key: EMAIL_BACKEND
        value: "django.core.mail.backends.smtp.EmailBackend"
      - key: EMAIL_HOST
        value: "smtp-relay.brevo.com"
      - key: EMAIL_PORT
        value: "587"
      - key: EMAIL_USE_TLS
        value: "True"
      - key: DEFAULT_FROM_EMAIL
        value: "noreply@runmycampus.com"
      - key: EMAIL_HOST_USER
        sync: false
      - key: EMAIL_HOST_PASSWORD
        sync: false
      - key: RMC_OPERATOR_ALERT_EMAIL
        sync: false
      - key: RMC_REBAC_ENFORCE_SENSITIVE
        value: "1"
      - key: RMC_REBAC_ENABLED
        value: "1"
      - key: RMC_COMPANY_LEGAL_NAME
        value: "RunMyCampus"
      - key: RMC_COMPANY_POSTAL_ADDRESS
        sync: false
      - key: RMC_PUBLIC_SITE_URL
        value: "https://runmycampus.com"
      - key: SCHOOLOPS_EMAIL_ASYNC_USE_CELERY
        value: "1"
      - key: TENANT_SELF_SERVICE_OFFBOARDING_ENABLED
        value: "1"
      - key: TENANT_AUTO_PURGE_ENABLED
        value: "0"
      - key: TENANT_AUTO_PURGE_GRACE_DAYS
        value: "30"
      - key: TENANT_OFFBOARDING_EMAIL_ENABLED
        value: "1"
      - key: TENANT_OFFBOARDING_NOTIFY_TENANT_ADMINS
        value: "1"
      - key: TENANT_OFFBOARDING_S3_CLEANUP_ENABLED
        value: "1"
  - type: worker
    name: school-management-system-beat
    env: python
    plan: starter
    buildCommand: "./build.sh"
    startCommand: ".venv/bin/celery -A config beat -l info --scheduler django_celery_beat.schedulers:DatabaseScheduler"
    envVars:
      - key: DEBUG
        value: "0"
      - key: PYTHON_VERSION
        value: "3.12.3"
      - key: DJANGO_SETTINGS_MODULE
        value: "config.settings"
      - key: MULTI_TENANT_BASE_DOMAIN
        value: "runmycampus.com"
      - key: MULTI_TENANT_LEGACY_BASE_DOMAINS
        value: ""
      - key: SECRET_KEY
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: school-management-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: school-management-redis
          property: connectionString
      - key: CELERY_BROKER_URL
        fromService:
          type: redis
          name: school-management-redis
          property: connectionString
      - key: TENANT_AUTO_PURGE_ENABLED
        value: "0"
      - key: TENANT_AUTO_PURGE_GRACE_DAYS
        value: "30"

  # ══════════════════════════════════════════════════════════════════════════
  # CRON (Option 3) — DISABLED BY DEFAULT. Runs the periodic-job registry in its
  # OWN short-lived process (NOT the web dyno's threads), so it suits HEAVIER
  # jobs than the in-process /health/ tick should carry. Billed per-run (cheap),
  # not always-on — but it IS a paid line, so it's commented out by default.
  #
  # The truly-FREE alternative is a third-party pinger (cron-job.org / UptimeRobot)
  # that POSTs the secured /api/internal/cron/run/ endpoint with INTERNAL_CRON_TOKEN
  # on a schedule for $0. (A GitHub Actions cron previously did this but was removed
  # — it overran the free Actions-minute tier; the in-process scheduler covers light
  # jobs.) Both converge on the same locked registry.
  #
  # TO ENABLE: uncomment this block. The schedule below ticks every 15 min and
  # runs whatever is DUE; the registry's per-job interval still controls cadence.
  # ══════════════════════════════════════════════════════════════════════════
  # - type: cron
  #   name: school-management-system-cron
  #   env: python
  #   plan: starter
  #   schedule: "*/15 * * * *"
  #   buildCommand: "./build.sh"
  #   startCommand: ".venv/bin/python manage.py run_periodic_jobs"
  #   envVars:
  #     - key: DEBUG
  #       value: "0"
  #     - key: PYTHON_VERSION
  #       value: "3.12.3"
  #     - key: DJANGO_SETTINGS_MODULE
  #       value: "config.settings"
  #     - key: MULTI_TENANT_BASE_DOMAIN
  #       value: "runmycampus.com"
  #     - key: SECRET_KEY
  #       sync: false
  #     - key: DATABASE_URL
  #       fromDatabase:
  #         name: school-management-db
  #         property: connectionString
  #     - key: REDIS_URL
  #       fromService:
  #         type: redis
  #         name: school-management-redis
  #         property: connectionString
  #     # Force the registry on in this dedicated process even if a broker exists.
  #     - key: RMC_INPROCESS_SCHEDULER
  #       value: "on"

  - type: redis
    name: school-management-redis
    plan: free

databases:
  - name: school-management-db
    # LIVE PLAN IS PAID (basic_1gb / 0.5 CPU) — upgraded 2026-06-17 to fix the
    # 0.1-CPU bottleneck that caused the 502 crash-loop. This value MUST match
    # the live plan: a blueprint sync that finds "free" here could try to
    # DOWNGRADE the production database (storage shrink / data risk). Keep this
    # in sync with the dashboard plan; never let it regress to free.
    plan: basic_1gb
