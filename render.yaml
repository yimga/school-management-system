services:
  - type: web
    name: school-management-system
    env: python
    plan: free
    buildCommand: "./build.sh"
    startCommand: "gunicorn config.wsgi:application"
    envVars:
      - key: DEBUG
        value: "0"
      - key: PYTHON_VERSION
        value: "3.12.3"
      - key: DATABASE_URL
        fromDatabase:
          name: school-management-db
          property: connectionString
      - key: ALLOWED_HOSTS
        value: "school-management-system.onrender.com"
      - key: SECRET_KEY
        generateValue: true
      - key: SEED_DEMO
        value: "1"

databases:
  - name: school-management-db
    plan: free
