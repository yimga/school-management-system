# Render Blueprint: Web Service + PostgreSQL
# Set DATABASE_URL in Dashboard → Environment (Internal DB URL from your Postgres).
services:
  - type: web
    name: school-management-system
    env: python
    plan: free
    buildCommand: "./build.sh"
    preDeployCommand: ".venv/bin/python manage.py migrate --noinput && .venv/bin/python manage.py seed_admin_dashboard_palettes && .venv/bin/python manage.py normalize_ui_config"
    startCommand: ".venv/bin/gunicorn config.wsgi:application --bind 0.0.0.0:$PORT"
    envVars:
      - key: DEBUG
        value: "0"
      - key: PYTHON_VERSION
        value: "3.12.3"
      - key: ALLOWED_HOSTS
        value: "school-management-system-2kzk.onrender.com"
      - key: SECRET_KEY
        generateValue: true

databases:
  - name: school-management-db
    plan: free
