# Render Blueprint: Web Service + PostgreSQL
# Set in Dashboard → Environment: DATABASE_URL (Internal DB URL), ADMIN_PASSWORD (for admin/teacher1/Parent1).
# Do NOT define DATABASE_URL here so your Dashboard value is not overwritten by Blueprint sync.
services:
  - type: web
    name: school-management-system
    env: python
    plan: free
    buildCommand: "./build.sh"
    preDeployCommand: ".venv/bin/python manage.py migrate --noinput && .venv/bin/python manage.py seed_render_users"
    startCommand: ".venv/bin/gunicorn config.wsgi:application"
    envVars:
      - key: DEBUG
        value: "0"
      - key: PYTHON_VERSION
        value: "3.12.3"
      - key: ALLOWED_HOSTS
        value: "school-management-system-2kzk.onrender.com"
      - key: SECRET_KEY
        generateValue: true

databases:
  - name: school-management-db
    plan: free
