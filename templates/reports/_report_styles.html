<style>
  {% with style=report_style|default_if_none:None %}
  {% with primary=style.primary_color|default:SITE.primary_color|default:'#0d6efd' accent=style.accent_color|default:SITE.accent_color|default:'#198754' %}
  :root {
    --report-primary: {{ primary }};
    --report-accent: {{ accent }};
  }
  {% endwith %}
  {% endwith %}

  @page { size: A4; margin: 14mm 12mm; }
  body { font-family: -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; font-size: 10.5pt; color: #111; }
  .letterhead { display:flex; gap:14px; align-items:center; border-bottom: 3px solid var(--report-primary); padding-bottom:10px; margin-bottom: 12px; }
  .letterhead img { height: 58px; }
  .title { font-size: 18pt; font-weight: 800; margin:0; }
  .sub { margin:2px 0 0; color:#444; }
  .pill { display:inline-block; padding:4px 10px; border-radius:999px; background: rgba(13,110,253,.10); color: var(--report-primary); font-weight:700; font-size:10pt; }
  .location-line { margin:2px 0 0; font-size: 10pt; color:#2d2d2d; }
  {% with style=report_style|default_if_none:None %}
  {% with watermark_text=style.watermark_text|default:SITE.school_code|default:SITE.site_name|default:"Gilead" %}
  body::after {
    content: "{{ watermark_text }}";
    position: fixed;
    inset: 40% auto auto 20%;
    font-size: 5rem;
    color: rgba(15, 23, 42, 0.08);
    z-index: -1;
    pointer-events: none;
    font-weight: 900;
    letter-spacing: 0.5rem;
  }
  {% endwith %}
  {% endwith %}
  .grid { display:grid; grid-template-columns: 1fr 1fr; gap:10px; }
  .box { border:1px solid #e6e6e6; border-radius: 12px; padding:10px; }
  table { width:100%; border-collapse: collapse; }
  th, td { border-bottom: 1px solid #eee; padding: 6px 6px; vertical-align: top; }
  th { text-align:left; font-size: 10pt; color:#333; background: #fafafa; position: sticky; top: 0; z-index: 2; }
  h3 { margin: 0 0 6px; font-size: 12pt; }
  .text-end { text-align: right; }
  .ms-auto { margin-left: auto; }
  .badge-good { background: rgba(25,135,84,.12); color: #198754; padding:3px 8px; border-radius: 999px; font-weight:700; font-size: 10pt; }
  .badge-warn { background: rgba(255,193,7,.18); color: #b58100; padding:3px 8px; border-radius: 999px; font-weight:700; font-size: 10pt; }
  .footer { margin-top: 14px; font-size: 9.5pt; color:#555; display:flex; justify-content: space-between; }

  /* Phase 18.4: Print-friendly — professional when handed to parents */
  @media print {
    @page { size: A4; margin: 14mm 12mm; }
    body { font-size: 10.5pt; color: #111; background: #fff; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    .letterhead { page-break-after: avoid; }
    .grid { page-break-inside: avoid; }
    .box { page-break-inside: avoid; }
    table { page-break-inside: avoid; }
    thead { display: table-header-group; }
    .footer { page-break-inside: avoid; margin-top: 14px; }
  }
</style>
