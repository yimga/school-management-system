{% extends "base.html" %}
{% load i18n %}

{% block title %}{% trans "Password reset" %}{% endblock %}

{% block content %}
<section class="auth-shell" aria-labelledby="reset-complete-title">
  <div class="auth-card" style="text-align:center">
    <div style="width:56px;height:56px;border-radius:16px;background:color-mix(in oklab, var(--ds-success) 14%, transparent);color:var(--ds-success);display:inline-flex;align-items:center;justify-content:center;margin-bottom:18px;" aria-hidden="true">
      <i class="bi bi-check2-circle" style="font-size:1.6rem"></i>
    </div>
    <h1 id="reset-complete-title">{% trans "All set." %}</h1>
    <p class="auth-sub">{% trans "Your password has been reset. You can now sign in with your new password." %}</p>
    <a href="{% url 'accounts:login' %}" class="btn btn-primary" style="width:100%"><i class="bi bi-box-arrow-in-right me-1"></i>{% trans "Sign in" %}</a>
  </div>
</section>
{% endblock %}
