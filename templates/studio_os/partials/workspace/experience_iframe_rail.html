{% load i18n %}
<div class="studio-os__card py-2">
  <div class="h6 mb-2">{% trans "Experience" %}</div>
  <ul class="list-unstyled small mb-0" id="experience-rail-list" data-studio-rail="experience">
    {% for item in experience_left_rail %}
    <li class="mb-1">
      <a href="{{ item.url }}" class="experience-rail-link {% if forloop.first %}active{% endif %}"
         {% if item.embed %}data-embed="1"{% endif %}
         {% if item.external %}data-external="1" target="_blank" rel="noopener noreferrer"{% endif %}>{{ item.label }}</a>
    </li>
    {% endfor %}
  </ul>
  <p class="small text-muted mt-2 mb-0">{% trans "Theme, customizer, and school theme." %}</p>
</div>
