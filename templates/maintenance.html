{% extends "base.html" %}
{% load i18n %}
{% block title %}{% trans "Scheduled maintenance" %}{% endblock %}

{% block content %}
<section class="error-page" aria-labelledby="maint-title">
  <div>
    <div class="kpi-icon" style="width:64px;height:64px;border-radius:18px;font-size:1.6rem;margin-bottom:18px;display:inline-flex" aria-hidden="true">
      <i class="bi bi-tools"></i>
    </div>
    <h1 id="maint-title" class="error-title">{% trans "We'll be right back." %}</h1>
    <p class="error-message">{% trans "The system is undergoing scheduled maintenance. Your data is safe — please check back in a few minutes." %}</p>
    <div class="error-actions">
      <button class="btn btn-primary" type="button" onclick="window.location.reload()"><i class="bi bi-arrow-clockwise me-1"></i>{% trans "Try again" %}</button>
    </div>
  </div>
</section>
{% endblock %}
