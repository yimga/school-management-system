{% extends "portal_base.html" %}
{% block title %}Open {{ document.title }}{% endblock %}
{% block content %}
{% include "components/next_action_strip.html" %}

<div class="visually-hidden rmc-empty-state-sentinel" aria-describedby="rmc_smart_action_hub" data-rmc-scroll-policy="paginate" data-page-critical-read="1" aria-hidden="true"></div>
<div class="container-fluid py-3" data-page-archetype="operational-workbench" data-rmc-operational-workbench="1" data-rmc-scroll-policy="paginate" data-page-critical-read="1">
  <div class="d-flex justify-content-between align-items-center mb-2">
    <h1 class="h5 mb-0">{{ document.title }}</h1>
    <a href="{% url 'kb:office_document_list' %}" class="btn btn-sm btn-outline-secondary">Back</a>
  </div>
  {% if error %}
    <div class="rmc-banner rmc-banner--warning">{{ error }}</div>
  {% elif collabora_url %}
    <iframe title="Office editor" src="{{ collabora_url }}" style="width:100%;min-height:80vh;border:var(--border-width-subtle) solid var(--color-base-200);border-radius:8px;"></iframe>
  {% endif %}
</div>
{% endblock %}
