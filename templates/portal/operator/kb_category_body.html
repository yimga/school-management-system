{% load i18n static %}
<link rel="stylesheet" href="{% static 'css/rmc-kb-operator.css' %}">
<div class="visually-hidden rmc-empty-state-sentinel" aria-describedby="rmc_smart_action_hub" data-rmc-scroll-policy="paginate" data-page-critical-read="1" aria-hidden="true"></div>
<div class="rmc-kb-operator">
  <nav aria-label="breadcrumb" class="mb-3">
    <ol class="breadcrumb mb-0">
      <li class="breadcrumb-item"><a href="{% url 'manager_help_center' %}">{% trans "Help center" %}</a></li>
      <li class="breadcrumb-item"><a href="{% url 'kb:kb_home' %}">{% trans "Knowledge base" %}</a></li>
      <li class="breadcrumb-item active" aria-current="page">{{ category.name }}</li>
    </ol>
  </nav>
  <h2 class="h5 mb-3">{{ category.name }}</h2>
  <div class="row g-3">
    {% for article in page_obj %}
    <div class="col-md-6">
      <a class="card text-decoration-none h-100" href="{% url 'kb:kb_article' article.slug %}">
        <div class="card-body"><h3 class="h6">{{ article.title }}</h3></div>
      </a>
    </div>
    {% empty %}
    <p class="text-tertiary">{% trans "No articles in this category." %}</p>
    {% endfor %}
  </div>
</div>
