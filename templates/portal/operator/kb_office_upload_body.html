{% load i18n %}
<div class="visually-hidden rmc-empty-state-sentinel" aria-describedby="rmc_smart_action_hub" data-rmc-scroll-policy="paginate" data-page-critical-read="1" aria-hidden="true"></div>
<div class="rmc-kb-operator">
  <p class="text-secondary">{% trans "Upload platform office templates or import Writer files into the operator knowledge base." %}</p>
  <form method="post" enctype="multipart/form-data" class="card card-body mb-3">
    {% csrf_token %}
    <input type="hidden" name="action" value="office">
    <div class="mb-2">
      <label class="form-label" for="op-office-title">{% trans "Title" %}</label>
      <input class="form-control form-control-sm" id="op-office-title" name="title">
    </div>
    <div class="mb-2">
      <label class="form-label" for="op-office-file">{% trans "File" %}</label>
      <input class="form-control form-control-sm" type="file" id="op-office-file" name="file" required>
    </div>
    <input type="hidden" name="help_audience" value="OPERATOR">
    <button class="btn btn-primary btn-sm" type="submit">{% trans "Upload" %}</button>
  </form>
  <form method="post" enctype="multipart/form-data" class="card card-body">
    {% csrf_token %}
    <input type="hidden" name="action" value="import_kb">
    <h2 class="h6">{% trans "Import ODT to KB" %}</h2>
    <div class="mb-2">
      <label class="form-label" for="op-import-title">{% trans "Title" %}</label>
      <input class="form-control form-control-sm" id="op-import-title" name="title">
    </div>
    <div class="mb-2">
      <label class="form-label" for="op-import-category">{% trans "Category" %}</label>
      <select class="form-select form-select-sm" id="op-import-category" name="category" required>
        <option value="">{% trans "Select" %}</option>
        {% for cat in categories %}<option value="{{ cat.id }}">{{ cat.name }}</option>{% endfor %}
      </select>
    </div>
    <div class="mb-2">
      <input class="form-control form-control-sm" type="file" name="file" required accept=".odt,.docx,.doc,.rtf,.txt">
    </div>
    <input type="hidden" name="help_audience" value="OPERATOR">
    <button class="btn btn-outline-primary btn-sm" type="submit">{% trans "Import pending article" %}</button>
  </form>
  <p class="mt-2 mb-0"><a href="{% url 'kb:kb_docs_hub' %}">{% trans "Documentation hub" %}</a></p>
</div>
