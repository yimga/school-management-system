{% load i18n %}
<dialog class="rmc-sheet" id="rmcTpPulseDrillSheet" role="dialog" aria-modal="true" aria-label="{% trans 'Snapshot metric detail' %}">
  <div class="visually-hidden rmc-empty-state-sentinel" aria-describedby="rmc_smart_action_hub" data-rmc-scroll-policy="paginate" data-page-critical-read="1" aria-hidden="true"></div>
<div class="rmc-sheet__handle" aria-hidden="true"></div>
  <header class="rmc-sheet__header">
    <h3 class="rmc-sheet__title" id="rmcTpPulseDrillTitle">{% trans "Metric detail" %}</h3>
    <button class="rmc-sheet__close" type="button" aria-label="{% trans 'Close' %}" data-rmc-sheet-close>&times;</button>
  </header>
  <div class="rmc-sheet__body">
    <p class="small text-muted mb-2" id="rmcTpPulseDrillHead"></p>
    <p class="fs-4 fw-semibold mb-1" id="rmcTpPulseDrillValue"></p>
    <p class="mb-2" id="rmcTpPulseDrillLabel"></p>
    <p class="small text-secondary mb-0" id="rmcTpPulseDrillDelta"></p>
  </div>
</dialog>
