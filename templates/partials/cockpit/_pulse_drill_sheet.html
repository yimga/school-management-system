{% load i18n static %}
<dialog class="rmc-sheet" id="rmcCpPulseDrillSheet" role="dialog" aria-modal="true" aria-label="{% trans 'Pulse metric detail' %}">
  <div class="rmc-sheet__handle" aria-hidden="true"></div>
  <header class="rmc-sheet__header">
    <h3 class="rmc-sheet__title" id="rmcCpPulseDrillTitle">{% trans "Metric detail" %}</h3>
    <button class="rmc-sheet__close" type="button" aria-label="{% trans 'Close' %}" data-rmc-sheet-close>&times;</button>
  </header>
  <div class="rmc-sheet__body">
    <p class="small text-muted mb-2" id="rmcCpPulseDrillHead"></p>
    <p class="fs-4 fw-semibold mb-1" id="rmcCpPulseDrillValue"></p>
    <p class="mb-2" id="rmcCpPulseDrillLabel"></p>
    <p class="small text-secondary mb-0" id="rmcCpPulseDrillDelta"></p>
  </div>
</dialog>
