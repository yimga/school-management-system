{% load i18n %}
<dialog class="rmc-bulk-confirm-dialog" data-rmc-bulk-confirm-dialog aria-labelledby="rmc-bulk-confirm-title">
  <form method="dialog" class="confirm-dialog" data-rmc-confirm-dialog>
    <h3 id="rmc-bulk-confirm-title" class="confirm-title" data-rmc-bulk-confirm-title>{% trans "Confirm bulk action" %}</h3>
    <p class="confirm-message" data-rmc-bulk-confirm-message></p>
    <div class="mb-3" data-rmc-bulk-confirm-phrase-wrap hidden>
      <label class="form-label small" for="rmc-bulk-confirm-phrase-input" data-rmc-bulk-confirm-phrase-label></label>
      <input type="text" class="form-control form-control-sm font-monospace" id="rmc-bulk-confirm-phrase-input" data-rmc-bulk-confirm-phrase-input autocomplete="off" spellcheck="false">
    </div>
    <p class="small text-danger mb-2 d-none" data-rmc-bulk-confirm-error role="alert"></p>
    <div class="confirm-actions d-flex flex-wrap gap-2 justify-content-end">
      <button type="button" class="btn btn-sm btn-outline-secondary" data-rmc-bulk-confirm-cancel>{% trans "Cancel" %}</button>
      <button type="submit" class="btn btn-sm btn-danger" data-rmc-bulk-confirm-submit disabled>{% trans "Confirm" %}</button>
    </div>
  </form>
</dialog>
