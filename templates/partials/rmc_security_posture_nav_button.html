{% load i18n static %}
{% if request.user.is_authenticated and account_security_score is not None %}
<button type="button"
        class="rmc-security-posture-nav cp-primary-nav__pill cp-nav-pill rmc-security-posture-nav--{{ security_posture_zone|default:'ok' }}"
        data-rmc-security-posture-nav="1"
        data-rmc-security-zone="{{ security_posture_zone|default:'ok' }}"
        data-bs-toggle="modal"
        data-bs-target="#rmcSecurityPostureSessionModal"
        aria-label="{% trans 'Account security' %} — {{ account_security_score }}/100"
        title="{% trans 'Account security' %}">
  <i class="bi bi-shield-lock{% if security_posture_zone == 'ok' %}-fill{% endif %}" aria-hidden="true"></i>
  <span>{% trans "Security" %}</span>
  <span class="rmc-security-posture-nav__score" aria-hidden="true">{{ account_security_score }}</span>
</button>
{% endif %}
