{% load i18n %}
{% if BREADCRUMBS and BREADCRUMBS|length > 1 %}
<nav class="tp-breadcrumb rmc-reveal" data-rmc-reveal aria-label="{% trans 'Breadcrumb' %}">
  {% for crumb in BREADCRUMBS %}
    {% if not forloop.first %}
      <span class="tp-breadcrumb__separator" aria-hidden="true">›</span>
    {% endif %}
    {% if crumb.active %}
      <span class="tp-breadcrumb__current">{{ crumb.label }}</span>
    {% else %}
      <a href="{{ crumb.url }}">{{ crumb.label }}</a>
    {% endif %}
  {% endfor %}
</nav>
{% endif %}
<div class="visually-hidden rmc-empty-state-sentinel" aria-describedby="rmc_smart_action_hub" data-rmc-scroll-policy="paginate" data-page-critical-read="1" aria-hidden="true"></div>
