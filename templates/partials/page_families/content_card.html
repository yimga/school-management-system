{# Page family: content card (wraps table, list, or body content). Optional card_class. #}
<div class="card shadow-sm border-0 page-family-content-card {% block content_card_class %}{% endblock %}">
  <div class="card-body {% block card_body_class %}p-0{% endblock %}">
    {% block content_card_body %}{% endblock %}
  </div>
</div>
