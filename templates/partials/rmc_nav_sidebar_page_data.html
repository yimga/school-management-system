{% load i18n %}
{% if request.user.is_authenticated and cockpit.nav_sidebar.enabled|default:True %}
<script type="application/json" id="page-data-rmc-nav-sidebar" nonce="{{ csp_nonce }}">{
  "enabled": true,
  "default_mode": "{{ cockpit.nav_sidebar.default_mode|default:'normal'|escapejs }}",
  "default_width": {{ cockpit.nav_sidebar.default_width|default:280 }},
  "min_width": {{ cockpit.nav_sidebar.min_width|default:200 }},
  "max_width": {{ cockpit.nav_sidebar.max_width|default:420 }},
  "rail_width": {{ cockpit.nav_sidebar.rail_width|default:44 }}
}</script>
{% endif %}
<div class="visually-hidden rmc-empty-state-sentinel" aria-describedby="rmc_smart_action_hub" data-rmc-scroll-policy="paginate" data-page-critical-read="1" aria-hidden="true"></div>
