{% load i18n %}
<div class="visually-hidden rmc-empty-state-sentinel" aria-describedby="rmc_smart_action_hub" data-rmc-scroll-policy="paginate" data-page-critical-read="1" aria-hidden="true"></div>
<div class="rmc-nav-sidebar__toolbar">
  <button type="button"
          class="rmc-nav-sidebar__toggle portal-sidebar-collapse-toggle js-sidebar-toggle"
          aria-label="{% trans 'Collapse navigation to icon rail' %}"
          aria-expanded="true"
          title="{% trans 'Collapse navigation to icon rail' %}">
    <i class="bi bi-layout-sidebar-inset" aria-hidden="true"></i>
  </button>
  <div class="rmc-nav-sidebar__filter" data-rmc-sidebar-filter>
    <input type="search"
           class="rmc-nav-sidebar__filter-input"
           data-rmc-sidebar-filter-input
           autocomplete="off"
           spellcheck="false"
           placeholder="{% trans 'Filter...' %}"
           aria-label="{% trans 'Filter navigation' %}">
    <span class="rmc-nav-sidebar__filter-key" aria-hidden="true">/</span>
  </div>
  <span class="rmc-nav-sidebar__toggle-label">{% trans "Navigation" %}</span>
</div>
