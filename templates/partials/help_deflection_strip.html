{% load i18n static %}
{% if support_deflection_url %}
<div class="visually-hidden rmc-empty-state-sentinel" aria-describedby="rmc_smart_action_hub" data-rmc-scroll-policy="paginate" data-page-critical-read="1" aria-hidden="true"></div>
<div
  data-support-deflection-url="{{ support_deflection_url }}"
  data-support-deflection-ack-url="{{ support_deflection_ack_url }}"
  data-deflection-surface="{{ deflection_surface|default:'help_center' }}"
>
  <div class="rmc-support-deflection-panel alert alert-info d-none mb-3" role="status" aria-live="polite"></div>
</div>
<script src="{% static 'js/rmc-support-deflection.js' %}" defer></script>
{% endif %}
