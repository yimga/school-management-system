{% load i18n %}
{# 1025: Shared tenant/control-plane impersonation notice (session-backed). #}
{% if request.session.impersonation %}
<div
  class="alert alert-warning d-flex align-items-center justify-content-between flex-wrap gap-2 mb-0 rounded-0 border-0 border-bottom"
  role="alert"
  data-shell-chrome="impersonation-session-strip"
>
  <span><strong>{% trans "Viewing as school" %}</strong> — {% trans "You are impersonating this school. Actions are audited." %}</span>
  <a href="{% url 'accounts:end_impersonation' %}" class="btn btn-sm btn-outline-dark">{% trans "Exit impersonation" %}</a>
</div>
{% endif %}
