{% load i18n static %}
{% comment %} v4.00.37 — Universal "Report issue" chip booted from every tenant shell.
The stylesheet is head-owned by portal_base.html; this body partial owns runtime data/scripts only. {% endcomment %}
{% if request.user.is_authenticated %}
<script nonce="{{ csp_nonce }}" id="rmc-support-quick-create-config" type="application/json">
{
  "endpoint": "{% url 'portal:support_quick_create' %}",
  "kbSearchEndpoint": "{% url 'portal:kb_search_inline' %}",
  "shortcutHint": "Shift+?",
  "roleLabel": "{{ rmc_shell.role_label|default:request.user.get_role_display|default:'' }}",
  "voiceLocale": "{{ LANGUAGE_CODE|default:'en' }}",
  "staticPrefix": "{% get_static_prefix %}"
}
</script>
<script nonce="{{ csp_nonce }}">
  (function () {
    var node = document.getElementById("rmc-support-quick-create-config");
    if (!node) return;
    try {
      window.rmcSupportQuickCreate = JSON.parse(node.textContent || "{}");
    } catch (e) {
      window.rmcSupportQuickCreate = {};
    }
  })();
</script>
<script src="{% static 'js/rmc-support-quick-create.js' %}" defer></script>
{% endif %}
<div class="visually-hidden rmc-empty-state-sentinel" aria-describedby="rmc_smart_action_hub" data-rmc-scroll-policy="paginate" data-page-critical-read="1" aria-hidden="true"></div>
