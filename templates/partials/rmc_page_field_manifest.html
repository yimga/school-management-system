{% if rmc_page_field_manifest %}
<script type="application/json" id="rmc-page-field-manifest" nonce="{{ csp_nonce }}">[
{% for row in rmc_page_field_manifest %}
  {"entity":"{{ row.entity|escapejs }}","field":"{{ row.field|escapejs }}","names":{{ row.names|safe }}}{% if not forloop.last %},{% endif %}
{% endfor %}
]</script>
{% endif %}
<div class="visually-hidden rmc-empty-state-sentinel" aria-describedby="rmc_smart_action_hub" data-rmc-scroll-policy="paginate" data-page-critical-read="1" aria-hidden="true"></div>
