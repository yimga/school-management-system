{% load i18n %}
{% comment %}
  Exceptional page-aware information tag.
  Flat title/body stays compatible; optional what/why/watch_outs/chips/surface
  drive the fixed tip layer in rmc-info-tag.js (never clipped by overflow parents).
{% endcomment %}
<span class="rmc-info-tag{% if extra_class %} {{ extra_class }}{% endif %}"
      data-rmc-info-tag="1"
      {% if surface %}data-rmc-info-surface="{{ surface }}"{% endif %}>
  <button
    type="button"
    class="rmc-info-tag__btn btn p-0 align-baseline"
    data-rmc-info-tip="1"
    data-bs-toggle="popover"
    data-bs-trigger="focus"
    data-bs-placement="{{ placement|default:'top' }}"
    data-bs-title="{{ title }}"
    data-bs-content="{{ body }}"
    data-rmc-info-what="{% firstof what body %}"
    {% if why %}data-rmc-info-why="{{ why }}"{% endif %}
    {% if watch_outs %}data-rmc-info-watch="{{ watch_outs }}"{% endif %}
    {% if chips %}data-rmc-info-chips="{{ chips }}"{% endif %}
    {% if surface %}data-rmc-info-surface="{{ surface }}"{% endif %}
    {% if entity %}data-rmc-info-entity="{{ entity }}"{% endif %}
    {% if field %}data-rmc-info-field="{{ field }}"{% endif %}
    {% if feature %}data-rmc-info-feature="{{ feature }}"{% endif %}
    aria-label="{% trans 'More information' %}: {% firstof title label %}"
    aria-expanded="false"
  >
    <svg width="14" height="14" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true" focusable="false">
      <path d="M8 15A7 7 0 1 1 8 1a7 7 0 0 1 0 14zm0 1A8 8 0 1 0 8 0a8 8 0 0 0 0 16z"/>
      <path d="m8.93 6.588-2.29.287-.082.38.45.083c.294.07.352.176.288.469l-.738 3.468c-.194.897.105 1.319.808 1.319.545 0 1.178-.252 1.465-.598l.088-.416c-.2.176-.492.246-.686.246-.275 0-.375-.193-.304-.533L8.93 6.588zM9 4.5a1 1 0 1 1-2 0 1 1 0 0 1 2 0z"/>
    </svg>
    <span class="visually-hidden">{% firstof title label %}</span>
  </button>
</span>
