{% load static %}
{% load i18n %}
<!-- Language Switcher Widget -->
<div class="visually-hidden rmc-empty-state-sentinel" aria-describedby="rmc_smart_action_hub" data-rmc-scroll-policy="paginate" data-page-critical-read="1" aria-hidden="true"></div>
<div class="language-switcher">
    <div class="dropdown">
        <button class="btn btn-sm btn-outline-light dropdown-toggle topbar-lang-btn" type="button" id="languageDropdown" data-bs-toggle="dropdown" data-bs-auto-close="outside" data-bs-boundary="viewport" data-bs-display="dynamic" data-bs-offset="0,8" aria-expanded="false" aria-haspopup="true" aria-label="{% trans 'Language' %}">
            <i class="bi bi-globe" aria-hidden="true"></i>
            <span>{{ current_language_name }}</span>
        </button>
        <ul class="dropdown-menu" aria-labelledby="languageDropdown">
            {% for code, name in available_languages %}
                <li>
                    <a class="dropdown-item {% if code == current_language %}active{% endif %}" 
                       href="?language={{ code }}"
                       onclick="setLanguage('{{ code }}'); return false;">
                        {{ name }}
                    </a>
                </li>
            {% endfor %}
        </ul>
    </div>
</div>

<script type="application/json" id="page-data-partials__language_switcher-1">{
  "var_current_language": "{{ current_language|escapejs }}"
}</script><script src="{% static 'js/_pages/partials__language_switcher-1.js' %}"></script>
