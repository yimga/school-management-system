{% extends "base.html" %}
{% load static %}

{% block title %}Password changed - {{ SITE.site_name|default:"Portal" }}{% endblock %}

{% block content %}
  <h1 class="visually-hidden" data-rmc-injected-h1="1">Password changed - {{ SITE.site_name|default:"Portal" }}</h1>
  <div class="container py-4">
    <div class="row justify-content-center">
      <div class="col-md-6">
        <div class="card shadow-sm border-success">
          <div class="card-body text-center py-4">
            <p class="text-success mb-2">Your password has been changed successfully.</p>
            <a class="btn btn-primary btn-back-primary" href="{% url 'accounts:user_profile' %}"><i class="bi bi-arrow-left me-1"></i>Back to My Profile</a>
          </div>
        </div>
      </div>
    </div>
  </div>
{% endblock %}
