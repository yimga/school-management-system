{% extends "base.html" %}
{% load i18n %}

{% block title %}{% trans "Accept staff invite" %}{% endblock %}

{% block content %}
<div class="container py-5" style="max-width: 28rem;">
  <h1 class="h4 mb-2">{% trans "Join" %} {{ school.name }}</h1>
  <p class="text-muted small mb-4">{% blocktrans with email=invite.email %}Create your account for <strong>{{ email }}</strong>.{% endblocktrans %}</p>
  <div class="card shadow-sm">
    <div class="card-body">
      <form method="post" class="vstack gap-3">
        {% csrf_token %}
        <div>
          <label class="form-label" for="id_username">{% trans "Username" %}</label>
          <input type="text" class="form-control" id="id_username" name="username" required autocomplete="username">
        </div>
        <div>
          <label class="form-label" for="id_password">{% trans "Password" %}</label>
          <input type="password" class="form-control" id="id_password" name="password" required autocomplete="new-password" minlength="8">
        </div>
        <div>
          <label class="form-label" for="id_password2">{% trans "Confirm password" %}</label>
          <input type="password" class="form-control" id="id_password2" name="password2" required autocomplete="new-password" minlength="8">
        </div>
        <button type="submit" class="btn btn-primary">{% trans "Create account" %}</button>
      </form>
    </div>
  </div>
</div>
{% endblock %}
