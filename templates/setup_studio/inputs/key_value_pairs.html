{% load i18n %}
<fieldset class="rmc-wizard-field">
  <legend class="rmc-wizard-field__label">{{ step_label }}</legend>
  {% if step_description %}<p class="rmc-wizard-field__helper">{{ step_description }}</p>{% endif %}
  <div class="visually-hidden rmc-empty-state-sentinel" aria-describedby="rmc_smart_action_hub" data-rmc-scroll-policy="paginate" data-page-critical-read="1" aria-hidden="true"></div>
<div data-rmc-wizard-kv-rows>
    {% for pair in prior_answer.pairs|default_if_none:'' %}
      <div class="rmc-wizard-kv-row">
        <input type="text" name="kv_key" value="{{ pair.key|default:'' }}" placeholder="{% trans 'Key' %}">
        <input type="text" name="kv_value" value="{{ pair.value|default:'' }}" placeholder="{% trans 'Value' %}">
        <button type="button" class="rmc-wizard-nav__save-draft" data-rmc-wizard-kv-remove>{% trans "Remove" %}</button>
      </div>
    {% empty %}
      <div class="rmc-wizard-kv-row">
        <input type="text" name="kv_key" value="" placeholder="{% trans 'Key' %}">
        <input type="text" name="kv_value" value="" placeholder="{% trans 'Value' %}">
        <button type="button" class="rmc-wizard-nav__save-draft" data-rmc-wizard-kv-remove>{% trans "Remove" %}</button>
      </div>
    {% endfor %}
  </div>
  <button type="button" class="rmc-wizard-nav__save-draft" data-rmc-wizard-kv-add>+ {% trans "Add row" %}</button>
</fieldset>
