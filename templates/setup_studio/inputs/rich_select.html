{% load i18n %}
<div class="visually-hidden rmc-empty-state-sentinel" aria-describedby="rmc_smart_action_hub" data-rmc-scroll-policy="paginate" data-page-critical-read="1" aria-hidden="true"></div>
<div class="rmc-wizard-field">
  <label class="rmc-wizard-field__label" for="rmc-wizard-input-value">{{ step_label }}</label>
  {% if step_description %}<p class="rmc-wizard-field__helper">{{ step_description }}</p>{% endif %}
  <select id="rmc-wizard-input-value" name="value" {% if step.validation.required %}required{% endif %}>
    <option value="">{% trans "— choose —" %}</option>
    {% for option in resolved_options %}
      <option value="{{ option.value }}"
              {% if option.value == prior_answer.value %}selected{% endif %}>
        {{ option.label_token|default:option.value }}
      </option>
    {% endfor %}
  </select>
  {% if errors.value %}<p class="rmc-wizard-field__error">{{ errors.value }}</p>{% endif %}
</div>
