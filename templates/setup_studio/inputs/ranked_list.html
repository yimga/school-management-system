{% load i18n %}
<fieldset class="rmc-wizard-field">
  <legend class="rmc-wizard-field__label">{{ step_label }}</legend>
  {% if step_description %}<p class="rmc-wizard-field__helper">{{ step_description }}</p>{% endif %}
  <ol style="list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: var(--space-1);" data-rmc-wizard-rank-list>
    {% for option in resolved_options %}
      <li class="rmc-wizard-rank-row" tabindex="0" draggable="true">
        <span aria-hidden="true">≡</span>
        <span style="flex:1;">{{ option.label_token|default:option.value }}</span>
        <input type="hidden" name="value" value="{{ option.value }}">
      </li>
    {% endfor %}
  </ol>
</fieldset>
<div class="visually-hidden rmc-empty-state-sentinel" aria-describedby="rmc_smart_action_hub" data-rmc-scroll-policy="paginate" data-page-critical-read="1" aria-hidden="true"></div>
