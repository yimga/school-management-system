{% load i18n %}
<aside class="rmc-wizard-help-rail" aria-label="{% trans 'Help' %}">
  <h3 style="margin-block: 0 var(--space-2); font-size: var(--type-size-h3, 1.125rem);">{% trans "Need help?" %}</h3>
  <p class="rmc-wizard-pane__subtitle" style="margin-block: 0 var(--space-2);">
    {% blocktrans %}This step typically takes {{ estimated_seconds }} seconds. You can pause at any time — your answers are saved.{% endblocktrans %}
  </p>
  {% if help_links %}
    <ul style="padding-inline-start: var(--space-3); margin-block: 0; display:flex; flex-direction:column; gap: var(--space-1);">
      {% for link in help_links %}
        <li><a href="{{ link.url }}" rel="noopener">{{ link.label }}</a></li>
      {% endfor %}
    </ul>
  {% endif %}
</aside>
