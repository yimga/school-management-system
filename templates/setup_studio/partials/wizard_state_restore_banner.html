{% load i18n %}
{% comment %} Rendered hidden by default; rmc-wizard-state-cache.js shows it when local cache is newer than server state. {% endcomment %}
<div class="visually-hidden rmc-empty-state-sentinel" aria-describedby="rmc_smart_action_hub" data-rmc-scroll-policy="paginate" data-page-critical-read="1" aria-hidden="true"></div>
<div class="rmc-wizard-restore-banner" hidden data-rmc-wizard-restore-banner>
  <span data-rmc-wizard-restore-message>{% trans "You have unsaved changes from an earlier session." %}</span>
  <span>
    <button type="button" class="rmc-wizard-nav__save-draft" data-rmc-wizard-restore-action="restore">{% trans "Restore" %}</button>
    <button type="button" class="rmc-wizard-nav__save-draft" data-rmc-wizard-restore-action="discard">{% trans "Discard" %}</button>
  </span>
</div>
