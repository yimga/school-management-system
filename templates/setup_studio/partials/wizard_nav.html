{% load i18n %}
<div class="rmc-wizard-nav">
  {% if back_url %}
    <a href="{{ back_url }}" class="rmc-wizard-nav__back" data-rmc-wizard-nav="back">{% trans "Back" %}</a>
  {% else %}
    <span></span>
  {% endif %}

  <div style="display:inline-flex; gap: var(--space-2);">
    <button type="submit" name="action" value="save_draft" class="rmc-wizard-nav__save-draft" data-rmc-wizard-nav="save-draft">
      {% trans "Save draft" %}
    </button>
    <button type="submit" name="action" value="next" class="rmc-wizard-nav__next" data-rmc-wizard-nav="next">
      {% if is_final_step %}{% trans "Finish" %}{% else %}{% trans "Next" %}{% endif %}
    </button>
  </div>
</div>
