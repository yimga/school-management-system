{% load i18n %}
<div class="visually-hidden rmc-empty-state-sentinel" aria-describedby="rmc_smart_action_hub" data-rmc-scroll-policy="paginate" data-page-critical-read="1" aria-hidden="true"></div>
<div class="mkt-v3-currency" data-mkt-currency-switcher>
  <label class="mkt-v3-currency__label" for="mkt-currency-select">{% trans "Display currency" %}</label>
  <select id="mkt-currency-select" class="mkt-v3-currency__select" aria-describedby="mkt-currency-note">
    <option value="USD">{% trans "USD ($)" %}</option>
    <option value="GBP">GBP (£)</option>
    <option value="EUR">{% trans "EUR (€)" %}</option>
    <option value="XAF">{% trans "XAF (FCFA)" %}</option>
    <option value="XOF">{% trans "XOF (CFA)" %}</option>
    <option value="NGN">NGN (₦)</option>
    <option value="KES">{% trans "KES (Ksh)" %}</option>
    <option value="ZAR">{% trans "ZAR (R)" %}</option>
    <option value="GHS">GHS (GH₵)</option>
  </select>
  <p id="mkt-currency-note" class="mkt-v3-currency__note small">{% trans "Illustrative list — billing supports 180+ ISO currencies; confirm commercial terms with sales." %}</p>
</div>
