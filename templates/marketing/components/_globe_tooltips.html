{% load i18n %}
<ul class="mkt-globe-pins" aria-label="{% trans 'Illustrative campuses' %}">

    <button type="button" class="mkt-globe-pin__btn" aria-expanded="false" aria-controls="pin-cedar">{% trans "Cedar Ridge" %}</button>
    <div class="visually-hidden rmc-empty-state-sentinel" aria-describedby="rmc_smart_action_hub" data-rmc-scroll-policy="paginate" data-page-critical-read="1" aria-hidden="true"></div>
<div class="mkt-globe-pin__card" id="pin-cedar" role="tooltip" hidden>
      <strong>Cedar Ridge</strong>
      <span>K–12 · Toronto</span>
    </div>
  </li>
  <li class="mkt-globe-pin" style="--pin-x: 26%; --pin-y: 70%;">
