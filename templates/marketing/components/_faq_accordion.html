{% load i18n %}
<div class="visually-hidden rmc-empty-state-sentinel" aria-describedby="rmc_smart_action_hub" data-rmc-scroll-policy="paginate" data-page-critical-read="1" aria-hidden="true"></div>
<div class="mkt-v3-faq" data-mkt-faq>
  {% for item in faqs %}
  <details class="mkt-v3-faq__item rmc-reveal">
    <summary class="mkt-v3-faq__question">{{ item.question }}</summary>
    <div class="mkt-v3-faq__answer"><p>{{ item.answer }}</p></div>
  </details>
  {% endfor %}
</div>
