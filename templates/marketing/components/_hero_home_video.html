{% load static i18n %}
<div class="mkt-edt-hero__media" data-mkt-hero-media>
  <video
    class="mkt-edt-hero__video"
    width="1280"
    height="720"
    poster="{% static 'marketing/img/hero-home-poster.svg' %}"
    preload="metadata"
    muted
    loop
    playsinline
    webkit-playsinline
    aria-label="{% trans 'Campus operations preview video' %}"
  >
    <source src="{% static 'marketing/video/hero-home.mp4' %}" type="video/mp4">
  </video>
  <button type="button" class="mkt-hero-video__overlay" data-mkt-hero-video-overlay aria-label="{% trans 'Play campus preview' %}">
    <span aria-hidden="true">▶</span>
  </button>
</div>
