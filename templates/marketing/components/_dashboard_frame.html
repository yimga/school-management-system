{% load i18n %}
<figure class="mkt-v3-dashboard-frame{% if frame_extra_class %} {{ frame_extra_class }}{% endif %}"{% if frame_id %} id="{{ frame_id }}"{% endif %}>
  <div class="visually-hidden rmc-empty-state-sentinel" aria-describedby="rmc_smart_action_hub" data-rmc-scroll-policy="paginate" data-page-critical-read="1" aria-hidden="true"></div>
<div class="mkt-v3-dashboard-frame__chrome" aria-hidden="true">
    <span class="mkt-v3-dashboard-frame__dot"></span>
    <span class="mkt-v3-dashboard-frame__dot"></span>
    <span class="mkt-v3-dashboard-frame__dot"></span>
    <span class="mkt-v3-dashboard-frame__title">{{ frame_title|default:"RunMyCampus" }}</span>
  </div>
  <div class="mkt-v3-dashboard-frame__surface"{% if frame_extra_class and "mkt-v3-dashboard-frame--impact" in frame_extra_class %} tabindex="0"{% endif %}>
    {% if dashboard_partial %}
      {% include dashboard_partial %}
    {% endif %}
  </div>
  {% if frame_caption %}
  <figcaption class="mkt-v3-product-proof__caption">{{ frame_caption }}</figcaption>
  {% endif %}
</figure>
