{% load i18n static %}
{% comment %}Hero right column — product composite + live analytics showcase (no empty video src).{% endcomment %}
<div class="visually-hidden rmc-empty-state-sentinel" aria-describedby="rmc_smart_action_hub" data-rmc-scroll-policy="paginate" data-page-critical-read="1" aria-hidden="true"></div>
<div class="mkt-hero-showcase" data-mkt-hero-showcase>
  <figure class="mkt-hero-showcase__visual">
    <img
      src="{% static 'images/marketing/hero-global-os-composite.svg' %}"
      alt="{% trans 'Composite view of leadership analytics, administration, teacher workspace, parent mobile portal, finance, and student portal in RunMyCampus' %}"
      width="960"
      height="520"
      decoding="async"
      loading="eager"
      class="mkt-hero-composite-img mkt-hero-showcase__composite"
    >
    <figcaption class="mkt-hero-showcase__caption mkt-edt-illustrative-pill">
      {% trans "Illustrative product surfaces — demo data" %}
    </figcaption>
  </figure>
  {% include "marketing/components/_hero_live_campus_pulse.html" %}
</div>
