{% load i18n marketing_media %}
<section
  id="mkt-fluid-classroom"
  class="mkt-ve-section mkt-ve-section--fluid"
  data-mkt-personality="fluid"
  aria-labelledby="mkt-fluid-headline"
>
  <div class="mkt-ve-section__inner mkt-edt-container mkt-edt-container--wide">
    <header class="mkt-ve-section__header">
      <p class="mkt-edt-eyebrow">{% trans "Fluid classroom" %}</p>
      <h2 id="mkt-fluid-headline" class="mkt-ve-section__title">
        {% trans "Gradebooks that morph to your framework." %}
      </h2>
      <p class="mkt-ve-section__lead">
        {% trans "Switch illustrative frameworks — IB, Cambridge, or local scales — without re-entering history." %}
      </p>
    </header>
    <div class="mkt-ve-gradebook" data-mkt-gradebook-morph>
      <div class="mkt-ve-gradebook__viz" data-mkt-gradebook-viz>
        {% marketing_viz "gradebook_viz" %}
      </div>
      <div class="mkt-ve-gradebook__tabs" role="tablist">
        <button type="button" role="tab" class="is-active" data-mkt-framework="ib" aria-selected="true">IB</button>
        <button type="button" role="tab" data-mkt-framework="caie">CAIE</button>
        <button type="button" role="tab" data-mkt-framework="local">{% trans "Local" %}</button>
      </div>
    </div>
  </div>
</section>
