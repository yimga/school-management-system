{% load i18n marketing_media %}
<div class="mkt-ve-gradebook mkt-ve-gradebook--platform" data-mkt-gradebook-morph>
  <div class="mkt-ve-gradebook__viz" data-mkt-gradebook-viz>
    {% marketing_viz "gradebook_viz" %}
  </div>
  <div class="mkt-ve-gradebook__tabs" role="tablist" aria-label="{% trans 'Gradebook framework' %}">
    <button type="button" role="tab" class="is-active" data-mkt-framework="ib" aria-selected="true">IB</button>
    <button type="button" role="tab" data-mkt-framework="caie" aria-selected="false">CAIE</button>
    <button type="button" role="tab" data-mkt-framework="local" aria-selected="false">{% trans "Local" %}</button>
  </div>
</div>
