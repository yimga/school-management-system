{% extends "migration_cloud/connector/_wizard_base.html" %}
{% load i18n %}
{% block connector_body %}
<ul class="list-group">
  {% for item in quarantine_items %}
  <li class="list-group-item"><strong>{{ item.issue_code }}</strong> — {{ item.issue_message }}</li>
  {% empty %}
  <li class="list-group-item text-muted">{% trans "No quarantine items." %}</li>
  {% endfor %}
</ul>
{% endblock %}
