{% extends "migration_cloud/connector/_wizard_base.html" %}
{% load i18n %}
{% block connector_body %}
<div class="visually-hidden rmc-empty-state-sentinel" aria-describedby="rmc_smart_action_hub" data-rmc-scroll-policy="paginate" data-page-critical-read="1" aria-hidden="true"></div>
<div class="visually-hidden" data-page-critical-read="1" aria-hidden="true"></div>

{% include "components/next_action_strip.html" %}

<form method="post">
  {% csrf_token %}
  <input type="hidden" name="idempotency_key" value="{{ idempotency_key }}">
  <p>{% trans "Import creates a Migration Cloud bundle and purges one-time credentials." %}</p>
  <button type="submit" class="btn btn-primary">{% trans "Confirm import" %}</button>
</form>
{% endblock %}
