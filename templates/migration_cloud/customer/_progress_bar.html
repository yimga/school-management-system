{% load i18n %}
<!-- v3.40.0 Agent 7 — customer-facing 7-stage progress bar. Renders ``intake`` (MigrationIntakeRequest) + ``stages`` (list of (state_value, label) tuples) into a flat ARIA-friendly horizontal bar. No inline styles — relies on .rmc-* class grammar. -->
<div class="rmc-progress-stages" data-intake-id="{{ intake.id }}" data-intake-state="{{ intake.state }}" data-pct-complete="{{ intake.pct_complete }}" role="group" aria-label="{% trans 'Migration progress' %}">
  <ol class="rmc-progress-stages__list">
    {% for stage_value, stage_label in stages %}
      <li class="rmc-progress-stages__item{% if intake.state == stage_value %} is-current{% endif %}{% if forloop.counter0 < intake.pct_complete|divisibleby:14 %} is-passed{% endif %}" data-stage="{{ stage_value }}">
        <span class="rmc-progress-stages__step">{{ forloop.counter }}</span>
        <span class="rmc-progress-stages__label">{{ stage_label }}</span>
      </li>
    {% endfor %}
  </ol>
  <div class="rmc-progress-stages__bar" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="{{ intake.pct_complete }}">
    <span class="rmc-progress-stages__bar-fill" data-pct="{{ intake.pct_complete }}"></span>
    <span class="rmc-progress-stages__bar-text">{{ intake.pct_complete }}%</span>
  </div>
</div>
