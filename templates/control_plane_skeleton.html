{% load static i18n %}
<!doctype html>
<html lang="en" data-theme="dark" data-bs-theme="dark" data-surface="control-plane">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}RunMyCampus Manager{% endblock %}</title>
    <link rel="icon" href="{% if PUBLIC_BRAND_FAVICON_URL %}{{ PUBLIC_BRAND_FAVICON_URL }}{% else %}{% static 'images/runmycampus-icon.png' %}{% endif %}" type="image/png">
    {% block extrahead %}{% endblock %}

    <link rel="stylesheet" href="{% static 'vendor/bootstrap/css/bootstrap.min.css' %}">
    <link rel="stylesheet" href="{% static 'vendor/bootstrap-icons/css/bootstrap-icons.min.css' %}">
    <link rel="stylesheet" href="{% static 'css/design-tokens.css' %}">
    <link rel="stylesheet" href="{% static 'css/design-tokens-luxury.css' %}">
    <link rel="stylesheet" href="{% static 'css/statement-header.css' %}">
    <link rel="stylesheet" href="{% static 'css/design-system-unified.css' %}">
    <link rel="stylesheet" href="{% static 'css/theme-visibility-guard.css' %}">
    <link rel="stylesheet" href="{% static 'css/manager-control-plane.css' %}">
    <link rel="stylesheet" href="{% static 'css/platform-high-end.css' %}">
    <link rel="stylesheet" href="{% static 'css/control-plane-ultra.css' %}">
    <link rel="stylesheet" href="{% static 'css/surface-themes.css' %}">
    <link rel="stylesheet" href="{% static 'css/table-system.css' %}">
    <link rel="stylesheet" href="{% static 'css/form-system.css' %}">
    <link rel="stylesheet" href="{% static 'css/card-grammar.css' %}">
    <link rel="stylesheet" href="{% static 'css/chart-rules.css' %}">
    <link rel="stylesheet" href="{% static 'css/platform-responsive-touch.css' %}">
    <link rel="stylesheet" href="{% static 'css/dashboard-responsive.css' %}">
    <link rel="stylesheet" href="{% static 'css/accessibility.css' %}">
    <style>
      :root {
        --school-primary: #0B0E14;
        --school-accent: #d4af37;
        --platform-navy: #0B0E14;
        --platform-gold: #d4af37;
      }
    </style>
    <style>
      /* Keep all content in frame: no horizontal spill (same contract as base.html). */
      html, body { overflow-x: clip; }
      body .container, body main, body [role="main"] { max-width: 100%; min-width: 0; }
    </style>
    {% block extrastyle %}{% endblock %}
  </head>
  <body class="control-plane-shell cp-surface">
    <a href="#cp-main-content" class="skip-link visually-hidden-focusable" aria-label="{% trans 'Skip to main content' %}">{% trans "Skip to main content" %}</a>
    {% block content %}{% endblock %}
    <script src="{% static 'vendor/bootstrap/js/bootstrap.bundle.min.js' %}"></script>
    <script src="{% static 'js/return-to-origin.js' %}" defer></script>
    {% block extrajs %}{% endblock %}
  </body>
</html>
