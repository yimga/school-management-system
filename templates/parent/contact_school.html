{% extends "portal_base.html" %}

{% block title %}Contact School{% endblock %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-3">
  <div>
    <h2 class="mb-0">Contact School</h2>
    <p class="text-muted small mb-0">
      Submit a request and the school team will call or message you.
    </p>
  </div>
  <a class="btn btn-outline-secondary btn-sm" href="{% url 'portal:parent_dashboard' %}">Back</a>
</div>

<div class="card">
  <div class="card-body">
    <form method="post" enctype="multipart/form-data">
      {% csrf_token %}
      {{ form.as_p }}
      <button class="btn btn-primary" type="submit">Submit request</button>
    </form>
  </div>
</div>
{% endblock %}
