<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Report – {{ report_name }}</title>
  <style>
    body { font-family: system-ui, sans-serif; font-size: 11px; padding: 1rem; color: #1e293b; }
    h1 { font-size: 1.25rem; margin-bottom: 1rem; }
    table { width: 100%; border-collapse: collapse; }
    th, td { border: 1px solid #cbd5e1; padding: 0.35rem 0.5rem; text-align: left; }
    th { background: #f1f5f9; font-weight: 600; }
    tr:nth-child(even) { background: #f8fafc; }
  </style>
</head>
<body>
  <h1>{{ report_name }}</h1>
  <table>
    <caption class="visually-hidden">{{ report_name }}</caption>
    <thead>
      <tr>
        {% for h in headers %}
        <th>{{ h }}</th>
        {% endfor %}
      </tr>
    </thead>
    <tbody>
      {% for row in rows %}
      <tr>
        {% for cell in row %}
        <td>{{ cell }}</td>
        {% endfor %}
      </tr>
      {% endfor %}
    </tbody>
  </table>
</body>
</html>
