{% load i18n %}
<section class="error-page rmc-maintenance-preview" data-shell-surface="maintenance-preview" aria-labelledby="maint-preview-title">
  <div>
    <div class="kpi-icon mb-3 d-inline-flex" aria-hidden="true">
      <i class="bi bi-tools"></i>
    </div>
    <h1 id="maint-preview-title" class="error-title">{% trans "We'll be right back." %}</h1>
    <p class="error-message">{% trans "RunMyCampus is undergoing scheduled maintenance. Your data is safe — please check back in a few minutes." %}</p>
    <p class="small text-muted mb-3">{% trans "Staff preview — end users see this page when maintenance mode is enabled site-wide." %}</p>
    <div class="error-actions">
      <button class="btn btn-primary" type="button" onclick="window.location.reload()">
        <i class="bi bi-arrow-clockwise me-1" aria-hidden="true"></i>{% trans "Try again" %}
      </button>
    </div>
  </div>
</section>
