{% load i18n static %}
<section
  class="card border-0 shadow-sm mb-4 rmc-reveal"
  data-rmc-theme-hub-hero="1"
  {% if hub_glance.primary_color %}style="--hub-preview-primary: {{ hub_glance.primary_color }};{% if hub_glance.accent_color %} --hub-preview-accent: {{ hub_glance.accent_color }};{% endif %}"{% endif %}
>
  <div class="visually-hidden rmc-empty-state-sentinel" aria-describedby="rmc_smart_action_hub" data-rmc-scroll-policy="paginate" data-page-critical-read="1" aria-hidden="true"></div>
<div class="card-body">
    <div class="row g-3 align-items-center">
      <div class="col-12 col-lg-6">
        <h2 class="h5 mb-2">{% trans "Visual theme builder" %}</h2>
        <p class="text-muted mb-3">
          {% trans "Shopify-grade canvas: drag sections, compare light and dark contrast live, publish brand tokens without leaving the hub." %}
        </p>
        <div class="d-flex flex-wrap gap-2">
          <a class="btn btn-primary" href="{% url 'siteconfig:theme_builder' %}">{% trans "Open theme builder" %}</a>
          <a class="btn btn-outline-secondary btn-sm" href="{% url 'siteconfig:theme_colors' %}?standalone=1">{% trans "Advanced palette" %}</a>
        </div>
      </div>
      <div class="col-12 col-lg-6">
        <div class="theme-hub-mini-preview" data-preview-surface="light" aria-hidden="true">
          <div class="theme-hub-mini-sidebar"></div>
          <div class="theme-hub-mini-main">
            <div class="theme-hub-mini-bar"></div>
            <div class="theme-hub-mini-cards">
              <span></span><span></span><span></span>
            </div>
          </div>
        </div>
        <div class="preview-surface-switch mt-2" role="group" aria-label="{% trans 'Hub contrast preview' %}">
          <button type="button" class="preview-surface-btn active" data-preview-surface="light">{% trans "Light" %}</button>
          <button type="button" class="preview-surface-btn" data-preview-surface="dark">{% trans "Dark" %}</button>
        </div>
      </div>
    </div>
  </div>
</section>
