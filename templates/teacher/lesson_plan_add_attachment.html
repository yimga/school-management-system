{% extends "portal_base.html" %}
{% load i18n %}

{% block title %}{% trans "Add resource" %}{% endblock %}

{% block content %}
  <div class="d-flex justify-content-between align-items-center mb-3">
    <a class="btn btn-outline-secondary btn-sm" href="{% url 'portal:teacher_lesson_notes' %}"><i class="bi bi-arrow-left me-1"></i>{% trans "Back to Lesson Notes" %}</a>
  </div>
  {% include "widgets/dashboard_hero.html" with hero=hero %}

  <div class="card">
    <div class="card-body">
      <form method="post" enctype="multipart/form-data">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn btn-primary">{% trans "Attach" %}</button>
        <a href="{% url 'portal:teacher_lesson_notes' %}" class="btn btn-outline-secondary">{% trans "Cancel" %}</a>
      </form>
    </div>
  </div>
{% endblock %}
