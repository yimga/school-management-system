{% load i18n %}
{# Mobile sidebar — same nav as /super/ (control_plane_sidebar). #}
<div class="offcanvas offcanvas-start d-lg-none cp-sidebar-offcanvas cp-sidebar-offcanvas--surface" tabindex="-1" id="cpSidebarOffcanvas" aria-labelledby="cpSidebarOffcanvasLabel">
  <div class="offcanvas-header border-secondary">
    <h5 class="offcanvas-title text-white" id="cpSidebarOffcanvasLabel">{% trans "Menu" %}</h5>
    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="offcanvas" data-bs-target="#cpSidebarOffcanvas" aria-label="{% trans 'Close' %}"></button>
  </div>
  <div class="offcanvas-body p-0">
    {% include "partials/control_plane_sidebar.html" with sidebar_nav_id="cpSidebarNavOffcanvas" %}
  </div>
</div>
