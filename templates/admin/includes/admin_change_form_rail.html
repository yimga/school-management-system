{% load i18n admin_urls admin_page_aware %}
{% comment %}
  Change-form context rail: page-aware record facts + form pulse + on-this-page.
{% endcomment %}
<aside class="rmc-admin-context-rail rmc-django-side-panel" data-rmc-rail="1" data-rmc-admin-context-scope="{% if is_manager_host %}operator{% else %}tenant{% endif %}" data-rmc-django-side-panel="1" data-rmc-django-rail-context-only="1" data-rmc-django-rail-page-aware="1">
  <div class="visually-hidden rmc-empty-state-sentinel" aria-describedby="rmc_smart_action_hub" data-rmc-scroll-policy="paginate" data-page-critical-read="1" aria-hidden="true"></div>
  {% admin_page_aware_rail "change-form" %}
  <div class="rmc-rail-card">
    <div class="rmc-rail-h">{% trans "On this page" %}</div>
    <div class="rmc-rail-b">
      <nav class="rmc-onthispage" data-rmc-onthispage="1" aria-label="{% trans 'Form sections' %}"></nav>
    </div>
  </div>
</aside>
