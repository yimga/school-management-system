{% load i18n unfold %}
{% comment %}Sidebar column: stays LEFT of main (width controlled by admin-sidebar-scroll.css #page > div:first-child). {% endcomment %}
<div class="visually-hidden rmc-empty-state-sentinel" aria-describedby="rmc_smart_action_hub" data-rmc-scroll-policy="paginate" data-page-critical-read="1" aria-hidden="true"></div>
<div class="relative z-60 admin-sidebar-column">
    <div class="fixed w-[288px] max-xl:hidden xl:relative xl:block {% element_classes 'navigation_wrapper' %}" x-bind:class="{'xl:!hidden': sidebarDesktopOpen === false, 'max-xl:!block': sidebarMobileOpen === true}">
        <div class="bg-base-50 relative z-30 dark:bg-base-900">
            <div id="nav-sidebar" class="bg-base-50 border-r border-base-200 bottom-0 fixed left-0 top-0 w-[288px] max-h-screen flex flex-col dark:border-base-800 dark:bg-base-900 {% element_classes 'navigation' %}" style="inset-inline-start: 0;">
                {% include "admin/sidebar_inner.html" %}
            </div>
        </div>
    </div>
</div>
