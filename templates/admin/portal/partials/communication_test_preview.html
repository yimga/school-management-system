<div class="visually-hidden rmc-empty-state-sentinel" aria-describedby="rmc_smart_action_hub" data-rmc-scroll-policy="paginate" data-page-critical-read="1" aria-hidden="true"></div>
<div class="card shadow-sm mt-4">
  <div class="card-body">
    <div class="d-flex align-items-start justify-content-between gap-2 mb-3">
      <div>
        <h5 class="mb-1">Send test to yourself</h5>
        <p class="text-muted small mb-0">
          Render dynamic tags (e.g., <code>[Student Name]</code>, <code>[Classroom]</code>) against synthetic data and deliver the message only to you.
        </p>
      </div>
      <span class="rmc-badge rmc-badge--success">Preview only</span>
    </div>

    <div class="mb-3">
      <label class="form-label small fw-semibold" for="previewCommSubject">Subject</label>
      <input id="previewCommSubject" class="form-control form-control-sm" value="Preview: [Student Name]'s progress">
    </div>
    <div class="mb-3">
      <label class="form-label small fw-semibold" for="previewCommBody">Body</label>
      <textarea id="previewCommBody" class="form-control form-control-sm" rows="3">
Dear [Student Name],
Your current average for [Specialty] is [Average]. Keep up the momentum!
      </textarea>
    </div>

    <div class="d-flex gap-2 flex-wrap">
      <button type="button" class="btn btn-sm btn-outline-primary" id="previewCommBtn">
        Send test preview
      </button>
      <span id="previewCommStatus" class="small text-muted align-self-center d-none">Preview sent.</span>
    </div>
  </div>
</div>

<script>
  document.addEventListener("DOMContentLoaded", () => {
    const statusEl = document.getElementById("previewCommStatus");
    document.getElementById("previewCommBtn").addEventListener("click", async () => {
      const csrf = document.querySelector("input[name='csrfmiddlewaretoken']");
      const response = await fetch("{% url 'portal:preview_communication_test' %}", {
        method: "POST",
        headers: {
          "X-CSRFToken": csrf ? csrf.value : "",
          "X-Requested-With": "XMLHttpRequest",
        },
        body: new URLSearchParams({
          subject: document.getElementById("previewCommSubject").value,
          body: document.getElementById("previewCommBody").value,
        }),
        credentials: "same-origin",
      });
      if (response.ok) {
        statusEl.textContent = "Preview message queued to your inbox (synthetic data).";
        statusEl.classList.remove("d-none", "text-danger");
        statusEl.classList.add("text-success");
      } else {
        statusEl.textContent = "Unable to send preview. Check logs.";
        statusEl.classList.remove("d-none", "text-success");
        statusEl.classList.add("text-danger");
      }
    });
  });
</script>
