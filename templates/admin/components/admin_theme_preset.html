{% load i18n static %}
<div class="admin-theme-preset module">
  <details>
    <summary class="mb-2"><strong>{% trans "Quick apply from ThemePack" %}</strong></summary>
    <p class="help">{% trans "Use this compact selector to apply a full ThemePack token set. It reuses the same catalog values as the card grid." %}</p>
    <div class="admin-theme-preset__actions d-flex flex-wrap align-items-center gap-2">
      <label for="admin-theme-preset-select" class="mb-0 small text-muted">{% trans "Preset" %}</label>
      <select id="admin-theme-preset-select" class="form-select form-select-sm" style="max-width: 360px;">
        <option value="">{% trans "Choose a ThemePack..." %}</option>
        {% for pack in admin_theme_packs %}
          <option
            value="{{ pack.pk }}"
            data-pack-id="{{ pack.pk }}"
            data-pack-slug="{{ pack.slug }}"
            data-primary="{% if pack.palette and pack.palette.admin_dashboard and pack.palette.admin_dashboard.primary %}{{ pack.palette.admin_dashboard.primary }}{% else %}{{ pack.primary_color|default:'#0d6efd' }}{% endif %}"
            data-accent="{% if pack.palette and pack.palette.admin_dashboard and pack.palette.admin_dashboard.accent %}{{ pack.palette.admin_dashboard.accent }}{% else %}{{ pack.accent_color|default:'#198754' }}{% endif %}"
            data-background="{{ pack.background_color|default:'#f8fafc' }}"
            data-dashboard-bg="{% if pack.palette and pack.palette.admin_dashboard and pack.palette.admin_dashboard.dashboard_bg %}{{ pack.palette.admin_dashboard.dashboard_bg }}{% else %}{{ pack.background_color|default:'#f8fafc' }}{% endif %}"
            data-surface="{% if pack.palette and pack.palette.admin_dashboard and pack.palette.admin_dashboard.surface %}{{ pack.palette.admin_dashboard.surface }}{% else %}#ffffff{% endif %}"
            data-success="{% if pack.palette and pack.palette.admin_dashboard and pack.palette.admin_dashboard.success %}{{ pack.palette.admin_dashboard.success }}{% else %}#22c55e{% endif %}"
            data-warning="{% if pack.palette and pack.palette.admin_dashboard and pack.palette.admin_dashboard.warning %}{{ pack.palette.admin_dashboard.warning }}{% else %}#f59e0b{% endif %}"
            data-danger="{% if pack.palette and pack.palette.admin_dashboard and pack.palette.admin_dashboard.danger %}{{ pack.palette.admin_dashboard.danger }}{% else %}#ef4444{% endif %}">
            {{ pack.name }}
          </option>
        {% endfor %}
      </select>
      <button type="button" id="admin-theme-preset-apply" class="btn btn-outline-primary btn-sm">{% trans "Apply selected pack" %}</button>
    </div>
  </details>
</div>

<script src="{% static 'js/theme-studio-apply.js' %}"></script>
<script>
(function() {
  var select = document.getElementById('admin-theme-preset-select');
  var btn = document.getElementById('admin-theme-preset-apply');
  if (!select || !btn) return;

  function selectedOption() {
    return select.options[select.selectedIndex] || null;
  }

  function syncCardHighlight(packId) {
    var container = document.getElementById('admin-dashboard-palette-selector');
    if (!container) return;
    var cards = container.querySelectorAll('.admin-dashboard-palette-card');
    cards.forEach(function(card) {
      card.classList.toggle('selected', String(card.dataset.packId) === String(packId || ''));
    });
  }

  btn.addEventListener('click', function() {
    var option = selectedOption();
    if (!option || !option.value) return;

    if (window.ThemeStudio && typeof window.ThemeStudio.applyFromDataset === 'function') {
      window.ThemeStudio.applyFromDataset(option.dataset, { setPack: true });
    }
    syncCardHighlight(option.value);

    document.dispatchEvent(new CustomEvent('theme-pack-selected', {
      detail: {
        packId: option.value,
        packSlug: option.dataset.packSlug || '',
        dataset: option.dataset,
      }
    }));
  });

  document.addEventListener('theme-pack-selected', function(event) {
    if (!event || !event.detail || !event.detail.packId) return;
    select.value = String(event.detail.packId);
  });
})();
</script>
