{% extends "base.html" %}
{% load static %}

{% block title %}Server error{% endblock %}

{% block content %}
<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-md-8 col-lg-6">
      <div class="card shadow-sm border-0">
        <div class="card-body text-center py-5">
          <div class="mb-4">
            <i class="bi bi-exclamation-triangle text-warning" style="font-size: 4rem;"></i>
          </div>
          <h1 class="h4 mb-2">Something went wrong</h1>
          <p class="text-muted mb-4">Something went wrong on our side. Please try again in a moment. If it keeps happening, contact your school's support or IT.</p>
          <a class="btn btn-primary" href="{% url 'accounts:redirect' %}">
            <i class="bi bi-house me-2"></i>Go to Dashboard
          </a>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
