{% load static %}
<!-- Logo Watermark - Configurable Background Logo -->
<style>
  .logo-watermark {
    position: fixed;
    bottom: 20px;
    right: 20px;
    z-index: 5;
    pointer-events: none;
    opacity: var(--logo-opacity, 0.08);
    transition: opacity 0.3s ease;
  }

  .logo-watermark img {
    width: 120px;
    height: auto;
    filter: grayscale(100%);
  }

  .logo-watermark:hover {
    opacity: var(--logo-opacity-hover, 0.15);
  }

  /* Dark mode support */
  :root[data-theme="dark"] .logo-watermark {
    opacity: var(--logo-opacity-dark, 0.12);
  }

  :root[data-theme="dark"] .logo-watermark:hover {
    opacity: var(--logo-opacity-dark-hover, 0.20);
  }

  /* Responsive */
  @media (max-width: 768px) {
    .logo-watermark {
      bottom: 10px;
      right: 10px;
    }

    .logo-watermark img {
      width: 80px;
    }
  }
</style>

<!-- Logo Watermark Element -->
<div class="logo-watermark" title="Gilead Tech High">
  {% if SITE.logo %}
    <img src="{{ SITE.logo.url }}" alt="School Logo" loading="lazy">
  {% else %}
    <div style="width: 120px; height: 120px; background: rgba(13, 110, 253, 0.1); border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 48px;">🎓</div>
  {% endif %}
</div>
