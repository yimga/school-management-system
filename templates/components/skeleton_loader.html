{% load static i18n %}
{# Skeleton loader — announces busy state to assistive tech.
   Replace with the loaded content + set aria-busy="false" when ready. #}

<div class="skeleton-loader" role="status" aria-busy="true" aria-live="polite" aria-label="{% trans 'Loading…' %}">
  <span class="visually-hidden">{% trans "Loading…" %}</span>
  <div class="skeleton skeleton-text" aria-hidden="true"></div>
  <div class="skeleton skeleton-text short" aria-hidden="true"></div>
  <div class="skeleton skeleton-text" aria-hidden="true"></div>
</div>
