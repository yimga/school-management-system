{% comment %}
  Global connection status for offline-first UX.
  Shows: Connected (green) | Offline – data will sync later (orange) | Syncing… (spinner).
  Only rendered when SITE.enable_offline_mode is True; hidden when offline mode disabled.
{% endcomment %}
<div id="sms-offline-status-bar" class="d-none d-inline-flex align-items-center gap-2 px-2 py-1 rounded-pill small text-white" role="status" aria-live="polite" style="min-width: 140px; background: rgba(0,0,0,0.2);">
  <span id="sms-offline-status-dot" class="rounded-circle" style="width: 8px; height: 8px; flex-shrink: 0;"></span>
  <span id="sms-offline-status-text">Connected</span>
  <span id="sms-offline-status-spinner" class="spinner-border spinner-border-sm d-none text-white" role="img" aria-label="Syncing"></span>
</div>
