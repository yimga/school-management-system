{% load i18n %}
<div class="visually-hidden rmc-empty-state-sentinel" aria-describedby="rmc_smart_action_hub" data-rmc-scroll-policy="paginate" data-page-critical-read="1" aria-hidden="true"></div>
<div class="phase8-declaration-strip card border-0 shadow-sm mb-3" data-phase8-declaration="1" role="region" aria-label="{% trans 'Dashboard intent' %}">
  <div class="card-body py-2 px-3">
    <div class="d-flex flex-wrap align-items-baseline gap-2 mb-1">
      <span class="badge text-bg-secondary text-uppercase small">{{ dec.dashboard_type }}</span>
      {% if dec.is_default %}
      <span class="text-warning small">{% trans "Default declaration" %}</span>
      {% endif %}
    </div>
    <p class="mb-1 small text-muted"><strong>{% trans "Job to be done" %}:</strong> {{ dec.jtbd }}</p>
    <p class="mb-1 small"><strong>{% trans "Main question" %}:</strong> {{ dec.main_question }}</p>
    <p class="mb-0 small"><strong>{% trans "Primary action" %}:</strong> {{ dec.main_action }}</p>
  </div>
</div>
