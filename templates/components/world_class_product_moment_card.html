{% load i18n %}
<article class="rmc-wcx-product-card rmc-reveal" data-world-class-product-moment="1">
  <span class="rmc-wcx-icon" aria-hidden="true">{{ icon|default:"*" }}</span>
  <h3 class="h5 mt-2">{{ title }}</h3>
  <p class="small text-muted">{{ outcome }}</p>
  <span class="rmc-badge rmc-badge--muted border">{{ status|default:_("Ready for review") }}</span>
  {% if action_url and action_label %}<p class="mb-0 mt-3"><a class="btn btn-sm btn-outline-primary" href="{{ action_url }}">{{ action_label }}</a></p>{% endif %}
</article>
<div class="visually-hidden rmc-empty-state-sentinel" aria-describedby="rmc_smart_action_hub" data-rmc-scroll-policy="paginate" data-page-critical-read="1" aria-hidden="true"></div>
