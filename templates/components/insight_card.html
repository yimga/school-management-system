{% load i18n %}
<article class="card ds-card h-100 insight-card" data-rmc-insight-card="1" data-rmc-insight-tone="{{ tone|default:'neutral' }}">
  <div class="card-body py-3">
    <div class="d-flex align-items-center justify-content-between gap-2 mb-2">
      <h3 class="h6 mb-0">{{ title }}</h3>
      {% if tone == "warning" %}
      <span class="badge text-bg-warning text-dark">{% trans "Warning" %}</span>
      {% elif tone == "success" %}
      <span class="badge text-bg-success">{% trans "Healthy" %}</span>
      {% elif tone == "danger" %}
      <span class="badge text-bg-danger">{% trans "Urgent" %}</span>
      {% else %}
      <span class="badge text-bg-secondary">{% trans "Insight" %}</span>
      {% endif %}
    </div>
    <p class="small text-muted mb-3">{{ explanation }}</p>
    <a href="{{ action_url }}" class="btn btn-sm btn-primary ds-btn">{{ action_label }}</a>
  </div>
</article>
