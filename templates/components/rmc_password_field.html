{% load i18n %}
<div class="{% if wrap_class %}{{ wrap_class }}{% else %}mb-3{% endif %} rmc-password-field{% if size_sm %} rmc-password-field--sm{% endif %}" data-rmc-password-field>
  {% if label %}
  <label for="{{ field_id }}" class="form-label{% if label_class %} {{ label_class }}{% endif %}">{{ label }}</label>
  {% endif %}
  <div class="input-group{% if size_sm %} input-group-sm{% endif %}">
    <input type="password" name="{{ field_name }}" id="{{ field_id }}" class="form-control{% if size_sm %} form-control-sm{% endif %}{% if monospace %} font-monospace{% endif %}{% if is_invalid %} is-invalid{% endif %}"{% if required != False %} required{% endif %}{% if autocomplete %} autocomplete="{{ autocomplete }}"{% endif %}{% if minlength %} minlength="{{ minlength }}"{% endif %}{% if autofocus %} autofocus{% endif %}{% if placeholder %} placeholder="{{ placeholder }}"{% endif %}{% if input_extra_attrs %} {{ input_extra_attrs|safe }}{% endif %}{% if is_invalid %} aria-invalid="true"{% endif %}>
    <button type="button" class="btn btn-outline-secondary rmc-password-field__toggle" data-rmc-password-toggle
            data-label-show="{% if toggle_label_show %}{{ toggle_label_show }}{% else %}{% trans 'Show password' %}{% endif %}" data-label-hide="{% if toggle_label_hide %}{{ toggle_label_hide }}{% else %}{% trans 'Hide password' %}{% endif %}"
            aria-label="{% if toggle_label_show %}{{ toggle_label_show }}{% else %}{% trans 'Show password' %}{% endif %}" aria-pressed="false" aria-controls="{{ field_id }}">
      <i class="bi bi-eye" aria-hidden="true"></i>
    </button>
  </div>
  {% if help_text %}
    {% if help_style == "portal-muted" %}
      <div class="form-text rmc-password-field__help--portal-muted">{{ help_text|safe }}</div>
    {% else %}
      <div class="form-help-muted">{{ help_text|safe }}</div>
    {% endif %}
  {% endif %}
  {% if error %}<div class="invalid-feedback d-block">{{ error }}</div>{% endif %}
</div>
