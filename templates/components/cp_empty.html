{% load i18n %}
<div class="cp-empty" role="status"{% if cp_empty_id %} id="{{ cp_empty_id }}"{% endif %}>
  <div class="cp-empty__icon" aria-hidden="true">{{ cp_empty_icon|default:"∅" }}</div>
  <div class="cp-empty__title">{{ cp_empty_title|default:_("Nothing here yet") }}</div>
  {% if cp_empty_hint %}
  <div class="cp-empty__hint">{{ cp_empty_hint }}</div>
  {% endif %}
</div>
