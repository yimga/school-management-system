{% load static %}
{# Theme toggle component for light/dark mode #}
<div class="theme-toggle-wrapper">
  <button class="theme-toggle-btn" id="themeToggle" title="Toggle theme">
    <div class="theme-icon">
      <i class="bi bi-sun-fill sun-icon"></i>
      <i class="bi bi-moon-stars-fill moon-icon"></i>
    </div>
    <span class="theme-label">
      <span class="light-label">Light</span>
      <span class="dark-label">Dark</span>
    </span>
  </button>
</div>

<style>
:root {
  /* Light theme colors */
  --bg-primary: #ffffff;
  --bg-secondary: #f8f9fa;
  --bg-tertiary: #f1f5f9;
  --text-primary: #1e293b;
  --text-secondary: #64748b;
  --text-tertiary: #94a3b8;
  --border-color: #e9ecef;
  --shadow: rgba(0, 0, 0, 0.1);
  --link-color: #0d6efd;
  --card-bg: #ffffff;
  --header-bg: #ffffff;
  --sidebar-bg: #f8f9fa;
}

[data-theme="dark"] {
  /* Dark theme colors */
  --bg-primary: #0f172a;
  --bg-secondary: #1e293b;
  --bg-tertiary: #334155;
  --text-primary: #f1f5f9;
  --text-secondary: #cbd5e1;
  --text-tertiary: #94a3b8;
  --border-color: #334155;
  --shadow: rgba(0, 0, 0, 0.3);
  --link-color: #3b82f6;
  --card-bg: #1e293b;
  --header-bg: #1e293b;
  --sidebar-bg: #0f172a;
}

.theme-toggle-wrapper {
  position: relative;
}

.theme-toggle-btn {
  display: flex;
  align-items: center;
  gap: 0.5rem;
  padding: 0.5rem 1rem;
  background: var(--bg-secondary);
  border: 1px solid var(--border-color);
  border-radius: 999px;
  cursor: pointer;
  transition: all 0.3s ease;
  color: var(--text-primary);
}

.theme-toggle-btn:hover {
  background: var(--bg-tertiary);
  transform: scale(1.05);
}

.theme-icon {
  position: relative;
  width: 20px;
  height: 20px;
}

.theme-icon i {
  position: absolute;
  top: 0;
  left: 0;
  font-size: 1.2rem;
  transition: all 0.3s ease;
}

.sun-icon {
  color: #fbbf24;
  opacity: 1;
  transform: rotate(0deg) scale(1);
}

.moon-icon {
  color: #60a5fa;
  opacity: 0;
  transform: rotate(180deg) scale(0);
}

[data-theme="dark"] .sun-icon {
  opacity: 0;
  transform: rotate(-180deg) scale(0);
}

[data-theme="dark"] .moon-icon {
  opacity: 1;
  transform: rotate(0deg) scale(1);
}

.theme-label {
  font-size: 0.85rem;
  font-weight: 500;
  position: relative;
  width: 40px;
}

.light-label,
.dark-label {
  position: absolute;
  left: 0;
  transition: all 0.3s ease;
}

.light-label {
  opacity: 1;
  transform: translateY(0);
}

.dark-label {
  opacity: 0;
  transform: translateY(-10px);
}

[data-theme="dark"] .light-label {
  opacity: 0;
  transform: translateY(10px);
}

[data-theme="dark"] .dark-label {
  opacity: 1;
  transform: translateY(0);
}

/* Apply theme colors to body and main elements */
body {
  background-color: var(--bg-primary);
  color: var(--text-primary);
  transition: background-color 0.3s ease, color 0.3s ease;
}

.card,
.dashboard-card {
  background-color: var(--card-bg);
  border-color: var(--border-color);
  color: var(--text-primary);
}

.dashboard-header {
  background-color: var(--header-bg);
  border-bottom-color: var(--border-color);
}

.sidebar {
  background-color: var(--sidebar-bg);
  border-right-color: var(--border-color);
}

a {
  color: var(--link-color);
}

.text-muted {
  color: var(--text-secondary) !important;
}

.border {
  border-color: var(--border-color) !important;
}

.bg-light {
  background-color: var(--bg-secondary) !important;
}

/* Dark theme specific adjustments */
[data-theme="dark"] .table {
  color: var(--text-primary);
}

[data-theme="dark"] .table thead th {
  background-color: var(--bg-tertiary);
  border-color: var(--border-color);
}

[data-theme="dark"] .table td,
[data-theme="dark"] .table th {
  border-color: var(--border-color);
}

[data-theme="dark"] .form-control,
[data-theme="dark"] .form-select {
  background-color: var(--bg-secondary);
  border-color: var(--border-color);
  color: var(--text-primary);
}

[data-theme="dark"] .modal-content {
  background-color: var(--bg-secondary);
  color: var(--text-primary);
}

[data-theme="dark"] .dropdown-menu {
  background-color: var(--bg-secondary);
  border-color: var(--border-color);
}

[data-theme="dark"] .dropdown-item {
  color: var(--text-primary);
}

[data-theme="dark"] .dropdown-item:hover {
  background-color: var(--bg-tertiary);
}

@media (max-width: 768px) {
  .theme-label {
    display: none;
  }
  
  .theme-toggle-btn {
    padding: 0.5rem;
  }
}
</style>

<script>
document.addEventListener('DOMContentLoaded', function() {
  const themeToggle = document.getElementById('themeToggle');
  const htmlElement = document.documentElement;

  // Load saved theme preference or default to light
  const savedTheme = localStorage.getItem('theme') || 'light';
  setTheme(savedTheme);

  // Toggle theme on button click
  themeToggle.addEventListener('click', function() {
    const currentTheme = htmlElement.getAttribute('data-theme');
    const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
    setTheme(newTheme);
  });

  function setTheme(theme) {
    htmlElement.setAttribute('data-theme', theme);
    localStorage.setItem('theme', theme);

    // Update meta theme-color for mobile browsers
    const metaThemeColor = document.querySelector('meta[name="theme-color"]');
    if (metaThemeColor) {
      metaThemeColor.setAttribute('content', theme === 'dark' ? '#0f172a' : '#ffffff');
    }

    // Dispatch custom event for other components
    window.dispatchEvent(new CustomEvent('theme-changed', { detail: { theme } }));
  }

  // Respect system preference if no saved preference
  if (!localStorage.getItem('theme')) {
    const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
    if (prefersDark) {
      setTheme('dark');
    }
  }

  // Listen for system theme changes
  window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', (e) => {
    if (!localStorage.getItem('theme')) {
      setTheme(e.matches ? 'dark' : 'light');
    }
  });
});
</script>
