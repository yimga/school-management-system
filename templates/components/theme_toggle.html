{% load static %}
{# Theme toggle with admin-configurable brightness defaults #}
<link rel="stylesheet" href="{% static 'css/theme-toggle-component.css' %}">
<div class="theme-toggle-wrapper">
  <div class="theme-toggle-btn" id="themeToggle" title="Toggle light/dark">
    <div class="theme-icon">
      <i class="bi bi-sun-fill sun-icon"></i>
      <i class="bi bi-moon-stars-fill moon-icon"></i>
    </div>
    <span class="theme-label" id="themeLabel">Light</span>
  </div>
  <select id="themeSelector" class="theme-select" aria-label="Theme brightness">
    <option value="system">System</option>
    <option value="light">Light</option>
    <option value="dark">Dark</option>
    <option value="classic">Classic</option>
    <option value="high_contrast">High contrast</option>
  </select>
</div>

<script src="{% static '_pages/components__theme_toggle.js' %}"></script>
