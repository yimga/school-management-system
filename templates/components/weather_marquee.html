{% load static %}
<!-- Weather Marquee - Scrolling weather and quote strip for admin dashboard -->

<div class="weather-marquee-container" data-weather-endpoint="{% url 'api_admin_weather' %}">
  <div class="weather-marquee-content" id="weatherMarqueeContent">
    <div class="weather-item">
      <span class="material-symbols-outlined weather-icon" id="marqueeWeatherIcon" aria-hidden="true">partly_cloudy_day</span>
      <div class="weather-info">
        <div class="weather-temp" id="marqueeWeatherTemp">--&deg;</div>
        <div class="weather-desc" id="marqueeWeatherDesc">Loading weather...</div>
      </div>
    </div>

    <div class="weather-divider"></div>

    <div class="daily-quote-item">
      <span aria-hidden="true">Quote:</span>
      <span id="marqueeQuote">"Great things are done by a series of small things brought together."</span>
    </div>

    <div class="weather-divider"></div>

    <div class="weather-item">
      <span class="material-symbols-outlined weather-icon" id="marqueeWeatherIcon2" aria-hidden="true">partly_cloudy_day</span>
      <div class="weather-info">
        <div class="weather-temp" id="marqueeWeatherTemp2">--&deg;</div>
        <div class="weather-desc" id="marqueeWeatherDesc2">Loading weather...</div>
      </div>
    </div>

    <div class="weather-divider"></div>

    <div class="daily-quote-item">
      <span aria-hidden="true">Quote:</span>
      <span id="marqueeQuote2">"Great things are done by a series of small things brought together."</span>
    </div>
  </div>
</div>

<script src="{% static '_pages/components__weather_marquee.js' %}"></script>
