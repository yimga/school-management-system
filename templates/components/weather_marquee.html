<!-- Weather Marquee - Scrolling Weather Widget for Dashboard Headers -->
<style>
  .weather-marquee-container {
    background: linear-gradient(90deg, rgba(255, 149, 0, 0.05), rgba(59, 130, 246, 0.05), rgba(255, 149, 0, 0.05));
    border: 1px solid rgba(255, 149, 0, 0.15);
    border-radius: 8px;
    padding: 12px 16px;
    margin-bottom: 16px;
    overflow: hidden;
    position: relative;
  }

  .weather-marquee-content {
    display: flex;
    align-items: center;
    gap: 24px;
    animation: scroll-marquee 30s linear infinite;
    white-space: nowrap;
  }

  .weather-marquee-content:hover {
    animation-play-state: paused;
  }

  @keyframes scroll-marquee {
    0% {
      transform: translateX(100%);
    }
    100% {
      transform: translateX(-100%);
    }
  }

  .weather-item {
    display: flex;
    align-items: center;
    gap: 12px;
    font-size: 14px;
    color: var(--admin-text, #0f172a);
  }

  .weather-icon {
    font-size: 24px;
    flex-shrink: 0;
  }

  .weather-info {
    display: flex;
    flex-direction: column;
    gap: 2px;
  }

  .weather-temp {
    font-weight: 700;
    font-size: 16px;
  }

  .weather-desc {
    font-size: 12px;
    opacity: 0.7;
  }

  .weather-divider {
    width: 1px;
    height: 24px;
    background: rgba(15, 23, 42, 0.2);
    flex-shrink: 0;
  }

  .daily-quote-item {
    display: flex;
    align-items: center;
    gap: 8px;
    font-style: italic;
    color: var(--admin-subtle, #475569);
    font-size: 13px;
  }

  :root[data-theme="dark"] .weather-item,
  :root[data-theme="dark"] .daily-quote-item {
    color: var(--admin-text-dark, #e2e8f0);
  }

  :root[data-theme="dark"] .weather-divider {
    background: rgba(255, 255, 255, 0.15);
  }
</style>

<div class="weather-marquee-container">
  <div class="weather-marquee-content" id="weatherMarqueeContent">
    <div class="weather-item">
      <span class="weather-icon" id="marqueeWeatherIcon">🌤️</span>
      <div class="weather-info">
        <div class="weather-temp" id="marqueeWeatherTemp">--°F</div>
        <div class="weather-desc" id="marqueeWeatherDesc">Loading...</div>
      </div>
    </div>
    
    <div class="weather-divider"></div>
    
    <div class="daily-quote-item">
      📌 <span id="marqueeQuote">"Great things are done by a series of small things brought together."</span>
    </div>

    <!-- Repeat for continuous loop -->
    <div class="weather-divider"></div>
    
    <div class="weather-item">
      <span class="weather-icon" id="marqueeWeatherIcon2">🌤️</span>
      <div class="weather-info">
        <div class="weather-temp" id="marqueeWeatherTemp2">--°F</div>
        <div class="weather-desc" id="marqueeWeatherDesc2">Loading...</div>
      </div>
    </div>
    
    <div class="weather-divider"></div>
    
    <div class="daily-quote-item">
      📌 <span id="marqueeQuote2">"Great things are done by a series of small things brought together."</span>
    </div>
  </div>
</div>

<script>
  // Load weather data for marquee
  async function loadWeatherForMarquee() {
    try {
      const response = await fetch('https://api.open-meteo.com/v1/forecast?latitude=9.0820&longitude=8.6753&current=temperature_2m,weather_code&temperature_unit=fahrenheit&timezone=Africa%2FLagos');
      const data = await response.json();
      
      if (data.current) {
        const temp = Math.round(data.current.temperature_2m);
        const weatherCode = data.current.weather_code;
        
        const weatherIcons = {
          0: '☀️', 1: '🌤️', 2: '⛅', 3: '☁️', 45: '🌫️', 48: '🌫️',
          51: '🌦️', 53: '🌦️', 55: '🌦️', 61: '🌧️', 63: '🌧️', 65: '🌧️',
          71: '🌨️', 73: '🌨️', 75: '🌨️', 80: '🌦️', 81: '🌦️', 82: '🌦️',
          95: '⛈️', 96: '⛈️', 99: '⛈️'
        };
        
        const weatherDescriptions = {
          0: 'Clear', 1: 'Mainly clear', 2: 'Partly cloudy', 3: 'Overcast',
          45: 'Foggy', 48: 'Foggy', 51: 'Light drizzle', 53: 'Drizzle', 55: 'Heavy drizzle',
          61: 'Light rain', 63: 'Rain', 65: 'Heavy rain', 71: 'Light snow', 73: 'Snow', 75: 'Heavy snow',
          80: 'Light showers', 81: 'Showers', 82: 'Heavy showers', 95: 'Thunderstorm', 96: 'Thunderstorm', 99: 'Thunderstorm'
        };
        
        const icon = weatherIcons[weatherCode] || '🌤️';
        const desc = weatherDescriptions[weatherCode] || 'Unknown';
        const tempStr = `${temp}°F`;
        
        // Update both instances for looping
        document.getElementById('marqueeWeatherIcon').textContent = icon;
        document.getElementById('marqueeWeatherTemp').textContent = tempStr;
        document.getElementById('marqueeWeatherDesc').textContent = desc;
        
        document.getElementById('marqueeWeatherIcon2').textContent = icon;
        document.getElementById('marqueeWeatherTemp2').textContent = tempStr;
        document.getElementById('marqueeWeatherDesc2').textContent = desc;
      }
    } catch (error) {
      console.log('Weather marquee loading failed:', error);
    }
  }

  // Load daily quote
  function loadDailyQuoteForMarquee() {
    const messages = [
      '"Great things are done by a series of small things brought together." — Vincent Van Gogh',
      '"Education is the most powerful weapon which you can use to change the world." — Nelson Mandela',
      '"The beautiful thing about learning is that no one can take it away from you." — B.B. King',
      '"Success is not final, failure is not fatal: it is the courage to continue that counts." — Winston Churchill',
      '"The only way to do great work is to love what you do." — Steve Jobs',
      '"Believe you can and you\'re halfway there." — Theodore Roosevelt',
      '"In the middle of difficulty lies opportunity." — Albert Einstein',
      '"Quality is not an act, it is a habit." — Aristotle',
      '"Excellence is not a skill, it\'s an attitude." — Ralph Marston',
      '"The expert in anything was once a beginner." — Helen Hayes',
      '"Teaching is the greatest act of optimism." — Colleen Wilcox',
      '"The mind is not a vessel to be filled, but a fire to be kindled." — Plutarch',
      '"Learning is a treasure that will follow its owner everywhere." — Chinese Proverb',
      '"The roots of education are bitter, but the fruit is sweet." — Aristotle',
      '"An investment in knowledge pays the best interest." — Benjamin Franklin'
    ];
    
    const now = new Date();
    const start = new Date(now.getFullYear(), 0, 0);
    const diff = now - start;
    const oneDay = 1000 * 60 * 60 * 24;
    const dayOfYear = Math.floor(diff / oneDay);
    
    const quote = messages[dayOfYear % messages.length];
    document.getElementById('marqueeQuote').textContent = quote;
    document.getElementById('marqueeQuote2').textContent = quote;
  }

  // Initialize on load
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', function() {
      loadWeatherForMarquee();
      loadDailyQuoteForMarquee();
    });
  } else {
    loadWeatherForMarquee();
    loadDailyQuoteForMarquee();
  }
</script>
