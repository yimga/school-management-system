{% comment %}
  Backend sidebar: local calendar + clock (uses browser timezone / location).
  Uses Intl API for locale-aware date/time.
{% endcomment %}
<style>
  .backend-calendar-dow, .backend-calendar-grid {
    display: grid;
    grid-template-columns: repeat(7, 1.4rem);
    gap: 2px;
    justify-content: center;
  }
  .backend-cal-dow-cell {
    text-align: center;
    font-size: 0.65rem;
    color: var(--bs-secondary, #6c757d);
    font-weight: 600;
  }
  .backend-cal-cell {
    text-align: center;
    font-size: 0.7rem;
    min-width: 1.4rem;
  }
  .backend-cal-empty { opacity: 0.3; }
  .backend-cal-today { border-radius: 4px; background: var(--bs-primary); color: #fff; }
</style>
<div class="card shadow-sm mb-3 backend-sidebar-calendar-clock">
  <div class="card-body py-2 px-3">
    <div class="text-center mb-2">
      <div class="d-flex align-items-center justify-content-center gap-1 mb-1">
        <i class="bi bi-calendar3 small"></i>
        <span class="small text-muted fw-semibold text-uppercase">Local time</span>
      </div>
      <div class="backend-clock-time fs-4 fw-bold lh-1" id="backendClockTime">--:--:--</div>
      <div class="backend-clock-date small text-muted" id="backendClockDate">Loading...</div>
    </div>
    <div class="backend-calendar-mini small" id="backendCalendarMini">
      <div class="backend-calendar-dow" id="backendCalendarDOW"></div>
      <div class="backend-calendar-grid" id="backendCalendarGrid"></div>
    </div>
  </div>
</div>
<script>
(function() {
  function pad(n) { return (n < 10 ? '0' : '') + n; }
  function updateClock() {
    var now = new Date();
    var timeEl = document.getElementById('backendClockTime');
    var dateEl = document.getElementById('backendClockDate');
    if (timeEl) timeEl.textContent = pad(now.getHours()) + ':' + pad(now.getMinutes()) + ':' + pad(now.getSeconds());
    if (dateEl) dateEl.textContent = now.toLocaleDateString(undefined, { weekday: 'short', month: 'short', day: 'numeric', year: 'numeric' });
  }
  function renderMiniCalendar() {
    var dowEl = document.getElementById('backendCalendarDOW');
    var grid = document.getElementById('backendCalendarGrid');
    if (!dowEl || !grid) return;
    var now = new Date();
    var year = now.getFullYear();
    var month = now.getMonth();
    var first = new Date(year, month, 1);
    var last = new Date(year, month + 1, 0);
    var startPad = first.getDay();
    var days = last.getDate();
    var labels = ['S','M','T','W','T','F','S'];
    var dowHtml = '';
    labels.forEach(function(l) { dowHtml += '<span class="backend-cal-dow-cell">' + l + '</span>'; });
    dowEl.innerHTML = dowHtml;
    var gridHtml = '';
    for (var i = 0; i < startPad; i++) gridHtml += '<span class="backend-cal-cell backend-cal-empty">—</span>';
    for (var d = 1; d <= days; d++) {
      var cls = 'backend-cal-cell' + (d === now.getDate() ? ' backend-cal-today' : '');
      gridHtml += '<span class="' + cls + '">' + d + '</span>';
    }
    grid.innerHTML = gridHtml;
  }
  function init() {
    updateClock();
    renderMiniCalendar();
    setInterval(updateClock, 1000);
  }
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
  } else {
    init();
  }
})();
</script>
