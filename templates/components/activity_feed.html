<!-- Activity Feed Component
Real-time audit logging showing admin actions, student changes, and system events -->

<div class="activity-feed-container">
  <div class="activity-feed-header">
    <h3><i class="fas fa-history"></i> Recent Activity</h3>
    <div class="activity-feed-controls">
      <select id="activityFilterType" class="activity-filter-select">
        <option value="">All Events</option>
        <option value="admin">Admin Actions</option>
        <option value="student">Student Changes</option>
        <option value="system">System Events</option>
        <option value="enrollment">Enrollments</option>
      </select>
      <button id="activityRefreshBtn" class="activity-refresh-btn" title="Refresh activity">
        <i class="fas fa-sync-alt"></i>
      </button>
    </div>
  </div>

  <div class="activity-feed">
    <div id="activityList" class="activity-list">
      <!-- Activities will be loaded here -->
      <div class="activity-loading">
        <i class="fas fa-spinner fa-spin"></i> Loading activities...
      </div>
    </div>
  </div>

  <div class="activity-feed-footer">
    <button id="activityLoadMoreBtn" class="activity-load-more">
      Load More Activities
    </button>
  </div>
</div>

<style>
/* Activity Feed Styles */
.activity-feed-container {
  background: var(--color-bg-primary);
  border: 1px solid var(--color-border);
  border-radius: var(--radius-xl);
  box-shadow: var(--shadow-md);
  overflow: hidden;
  display: flex;
  flex-direction: column;
  height: 600px;
}

.activity-feed-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: var(--spacing-lg);
  border-bottom: 1px solid var(--color-border);
  background: linear-gradient(135deg, var(--color-bg-light), var(--color-bg-primary));
}

.activity-feed-header h3 {
  margin: 0;
  font-size: var(--font-size-lg);
  color: var(--color-text-primary);
  display: flex;
  align-items: center;
  gap: var(--spacing-sm);
}

.activity-feed-controls {
  display: flex;
  gap: var(--spacing-md);
  align-items: center;
}

.activity-filter-select {
  padding: var(--spacing-xs) var(--spacing-sm);
  border: 1px solid var(--color-border);
  border-radius: var(--radius-md);
  background: var(--color-bg-primary);
  color: var(--color-text-primary);
  font-size: var(--font-size-sm);
  cursor: pointer;
}

.activity-refresh-btn {
  padding: var(--spacing-xs) var(--spacing-sm);
  background: var(--color-primary);
  color: white;
  border: none;
  border-radius: var(--radius-md);
  cursor: pointer;
  transition: all var(--transition-fast);
}

.activity-refresh-btn:hover {
  background: var(--color-secondary);
  transform: rotate(180deg);
}

.activity-feed {
  flex: 1;
  overflow-y: auto;
}

.activity-list {
  padding: 0;
}

.activity-item {
  padding: var(--spacing-lg);
  border-bottom: 1px solid var(--color-border);
  display: flex;
  gap: var(--spacing-md);
  transition: background-color var(--transition-fast);
  cursor: pointer;
}

.activity-item:hover {
  background: var(--color-bg-light);
}

.activity-item:last-child {
  border-bottom: none;
}

.activity-icon {
  flex-shrink: 0;
  width: 40px;
  height: 40px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: var(--font-size-md);
  color: white;
}

.activity-icon.admin {
  background: var(--color-primary);
}

.activity-icon.student {
  background: var(--color-secondary);
}

.activity-icon.system {
  background: var(--color-accent);
}

.activity-icon.enrollment {
  background: #3b82f6;
}

.activity-content {
  flex: 1;
  min-width: 0;
}

.activity-title {
  font-weight: var(--font-weight-semibold);
  color: var(--color-text-primary);
  margin: 0 0 var(--spacing-xs) 0;
  word-break: break-word;
}

.activity-description {
  font-size: var(--font-size-sm);
  color: var(--color-text-muted);
  margin: 0;
}

.activity-meta {
  display: flex;
  gap: var(--spacing-md);
  margin-top: var(--spacing-xs);
  font-size: var(--font-size-xs);
}

.activity-timestamp {
  color: var(--color-text-muted);
  display: flex;
  align-items: center;
  gap: var(--spacing-xs);
}

.activity-user {
  color: var(--color-primary);
  display: flex;
  align-items: center;
  gap: var(--spacing-xs);
}

.activity-badge {
  display: inline-block;
  padding: var(--spacing-xs) var(--spacing-sm);
  background: var(--color-bg-light);
  color: var(--color-text-muted);
  border-radius: var(--radius-md);
  font-size: var(--font-size-xs);
}

.activity-loading {
  padding: var(--spacing-xl);
  text-align: center;
  color: var(--color-text-muted);
  display: flex;
  align-items: center;
  justify-content: center;
  gap: var(--spacing-md);
  height: 100%;
}

.activity-empty {
  padding: var(--spacing-xl);
  text-align: center;
  color: var(--color-text-muted);
}

.activity-feed-footer {
  padding: var(--spacing-md);
  border-top: 1px solid var(--color-border);
  background: var(--color-bg-light);
  text-align: center;
}

.activity-load-more {
  padding: var(--spacing-sm) var(--spacing-lg);
  background: var(--color-primary);
  color: white;
  border: none;
  border-radius: var(--radius-md);
  cursor: pointer;
  font-size: var(--font-size-sm);
  transition: all var(--transition-fast);
}

.activity-load-more:hover {
  background: var(--color-secondary);
  transform: translateY(-2px);
}

/* Scrollbar styling */
.activity-feed::-webkit-scrollbar {
  width: 6px;
}

.activity-feed::-webkit-scrollbar-track {
  background: transparent;
}

.activity-feed::-webkit-scrollbar-thumb {
  background: var(--color-secondary);
  border-radius: 3px;
}

.activity-feed::-webkit-scrollbar-thumb:hover {
  background: var(--color-primary);
}

/* Responsive */
@media (max-width: 768px) {
  .activity-feed-container {
    height: auto;
    max-height: 400px;
  }

  .activity-feed-header {
    flex-direction: column;
    gap: var(--spacing-md);
    align-items: flex-start;
  }

  .activity-item {
    padding: var(--spacing-md);
  }
}
</style>

<script>
// Activity Feed JavaScript
class ActivityFeed {
  constructor() {
    this.page = 1;
    this.filter = '';
    this.init();
  }

  init() {
    this.setupEventListeners();
    this.loadActivities();
  }

  setupEventListeners() {
    const filterSelect = document.getElementById('activityFilterType');
    const refreshBtn = document.getElementById('activityRefreshBtn');
    const loadMoreBtn = document.getElementById('activityLoadMoreBtn');

    if (filterSelect) {
      filterSelect.addEventListener('change', (e) => {
        this.filter = e.target.value;
        this.page = 1;
        this.loadActivities();
      });
    }

    if (refreshBtn) {
      refreshBtn.addEventListener('click', () => {
        this.page = 1;
        this.loadActivities();
      });
    }

    if (loadMoreBtn) {
      loadMoreBtn.addEventListener('click', () => {
        this.page++;
        this.loadActivities(true);
      });
    }
  }

  async loadActivities(append = false) {
    const list = document.getElementById('activityList');
    if (!list) return;

    if (!append) {
      list.innerHTML = '<div class="activity-loading"><i class="fas fa-spinner fa-spin"></i> Loading activities...</div>';
    }

    try {
      const url = `/api/activities/?page=${this.page}${this.filter ? '&filter=' + this.filter : ''}`;
      const response = await fetch(url);
      
      if (!response.ok) {
        throw new Error('Failed to load activities');
      }

      const data = await response.json();
      this.renderActivities(data.activities, append);
    } catch (error) {
      console.error('Error loading activities:', error);
      if (!append) {
        list.innerHTML = '<div class="activity-empty">No activities available</div>';
      }
    }
  }

  renderActivities(activities, append = false) {
    const list = document.getElementById('activityList');
    if (!list) return;

    if (!append) {
      list.innerHTML = '';
    }

    if (!activities || activities.length === 0) {
      if (!append) {
        list.innerHTML = '<div class="activity-empty">No activities to display</div>';
      }
      return;
    }

    activities.forEach(activity => {
      const item = document.createElement('div');
      item.className = 'activity-item';
      item.innerHTML = `
        <div class="activity-icon ${activity.type}">
          <i class="${this.getIconClass(activity.type)}"></i>
        </div>
        <div class="activity-content">
          <p class="activity-title">${this.escapeHtml(activity.title)}</p>
          <p class="activity-description">${this.escapeHtml(activity.description)}</p>
          <div class="activity-meta">
            <span class="activity-timestamp">
              <i class="fas fa-clock"></i> ${this.formatTime(activity.timestamp)}
            </span>
            ${activity.user ? `<span class="activity-user"><i class="fas fa-user"></i> ${this.escapeHtml(activity.user)}</span>` : ''}
            ${activity.type ? `<span class="activity-badge">${this.formatType(activity.type)}</span>` : ''}
          </div>
        </div>
      `;
      list.appendChild(item);
    });
  }

  getIconClass(type) {
    const icons = {
      admin: 'fas fa-shield-alt',
      student: 'fas fa-user-graduate',
      system: 'fas fa-cog',
      enrollment: 'fas fa-door-open'
    };
    return icons[type] || 'fas fa-circle';
  }

  formatType(type) {
    const types = {
      admin: 'Admin Action',
      student: 'Student Change',
      system: 'System Event',
      enrollment: 'Enrollment'
    };
    return types[type] || type;
  }

  formatTime(timestamp) {
    const date = new Date(timestamp);
    const now = new Date();
    const diff = Math.floor((now - date) / 1000);

    if (diff < 60) return 'just now';
    if (diff < 3600) return `${Math.floor(diff / 60)}m ago`;
    if (diff < 86400) return `${Math.floor(diff / 3600)}h ago`;
    return date.toLocaleDateString();
  }

  escapeHtml(text) {
    const div = document.createElement('div');
    div.textContent = text;
    return div.innerHTML;
  }
}

// Initialize when ready
document.addEventListener('DOMContentLoaded', () => {
  window.activityFeed = new ActivityFeed();
  console.log('✅ Activity Feed initialized');
});
</script>
