{% load static %}
<!-- Weather and daily message card -->
<div class="visually-hidden rmc-empty-state-sentinel" aria-describedby="rmc_smart_action_hub" data-rmc-scroll-policy="paginate" data-page-critical-read="1" aria-hidden="true"></div>
<div class="weather-widget-card" data-weather-widget data-weather-endpoint="{% url 'api_weather_context' %}">
  <div class="weather-widget-card__header">
    <div>
      <h6 class="weather-widget-card__title">Today</h6>
      <div class="weather-widget-card__date" data-weather-current-date>--</div>
    </div>
    <div class="weather-widget-card__status">
      <div class="weather-widget-card__weather-row">
        <i class="bi bi-cloud-sun weather-widget-card__icon" data-weather-icon aria-hidden="true"></i>
        <div>
          <div class="weather-widget-card__temp" data-weather-temp>--&deg;</div>
          <div class="weather-widget-card__desc" data-weather-desc>Loading weather...</div>
        </div>
      </div>
    </div>
  </div>
  <div class="weather-widget-card__message" data-weather-message>
    "Great things are done by a series of small things brought together."
  </div>
</div>

<script src="{% static 'js/_pages/components__weather_widget.js' %}"></script>
