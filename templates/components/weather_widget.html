{% load static %}
<!-- Weather & Daily Message Widget -->
<div class="weather-widget-card" style="background: linear-gradient(135deg, rgba(255, 149, 0, 0.08), rgba(59, 130, 246, 0.05)); border-radius: 14px; padding: 1.25rem; margin-bottom: 1.5rem; border: 1px solid rgba(255, 149, 0, 0.15);">
  <div class="d-flex justify-content-between align-items-start mb-3">
    <div>
      <h6 class="mb-1" style="font-weight: 700; color: #1e293b; font-size: 0.85rem; text-transform: uppercase; letter-spacing: 0.05em;">📅 Today</h6>
      <div id="currentDate" style="font-size: 0.9rem; color: #64748b;"></div>
    </div>
    <div id="weatherWidget" class="text-end">
      <div style="display: flex; align-items: center; gap: 8px; justify-content: flex-end;">
        <span id="weatherIcon" style="font-size: 32px;">🌤️</span>
        <div>
          <div id="weatherTemp" style="font-size: 1.1rem; font-weight: 700; color: #1e293b;">--°</div>
          <div id="weatherDesc" style="font-size: 0.75rem; color: #64748b;">Loading...</div>
        </div>
      </div>
    </div>
  </div>
  
  <div id="dailyMessage" style="font-style: italic; color: #475569; font-size: 0.85rem; line-height: 1.5; padding: 0.75rem; background: rgba(255, 255, 255, 0.6); border-radius: 8px; border-left: 3px solid #ff9500;">
    "Great things are done by a series of small things brought together."
  </div>
</div>

<script>
  // Weather functionality
  async function loadWeather() {
    try {
      // Using Open-Meteo free weather API (no key required) - Abuja, Nigeria coordinates
      const response = await fetch('https://api.open-meteo.com/v1/forecast?latitude=9.0820&longitude=8.6753&current=temperature_2m,weather_code&temperature_unit=fahrenheit&timezone=Africa%2FLagos');
      const data = await response.json();
      
      if (data.current) {
        const temp = Math.round(data.current.temperature_2m);
        const weatherCode = data.current.weather_code;
        
        // Weather icon mapping based on WMO Weather interpretation codes
        const weatherIcons = {
          0: '☀️',   // Clear sky
          1: '🌤️', 2: '⛅', 3: '☁️',  // Partly cloudy to overcast
          45: '🌫️', 48: '🌫️',  // Fog
          51: '🌦️', 53: '🌦️', 55: '🌦️',  // Drizzle
          61: '🌧️', 63: '🌧️', 65: '🌧️',  // Rain
          71: '🌨️', 73: '🌨️', 75: '🌨️',  // Snow
          80: '🌦️', 81: '🌦️', 82: '🌦️',  // Showers
          95: '⛈️', 96: '⛈️', 99: '⛈️'   // Thunderstorm
        };
        
        const weatherDescriptions = {
          0: 'Clear sky',
          1: 'Mainly clear', 2: 'Partly cloudy', 3: 'Overcast',
          45: 'Foggy', 48: 'Foggy',
          51: 'Light drizzle', 53: 'Drizzle', 55: 'Heavy drizzle',
          61: 'Light rain', 63: 'Rain', 65: 'Heavy rain',
          71: 'Light snow', 73: 'Snow', 75: 'Heavy snow',
          80: 'Light showers', 81: 'Showers', 82: 'Heavy showers',
          95: 'Thunderstorm', 96: 'Thunderstorm', 99: 'Heavy thunderstorm'
        };
        
        document.getElementById('weatherIcon').textContent = weatherIcons[weatherCode] || '🌤️';
        document.getElementById('weatherTemp').textContent = `${temp}°F`;
        document.getElementById('weatherDesc').textContent = weatherDescriptions[weatherCode] || 'Unknown';
      }
    } catch (error) {
      console.log('Weather loading failed:', error);
      document.getElementById('weatherTemp').textContent = '72°F';
      document.getElementById('weatherDesc').textContent = 'Abuja, Nigeria';
    }
  }

  // Daily inspirational messages rotation
  function loadDailyMessage() {
    const messages = [
      '"Great things are done by a series of small things brought together." — Vincent Van Gogh',
      '"Education is the most powerful weapon which you can use to change the world." — Nelson Mandela',
      '"The beautiful thing about learning is that no one can take it away from you." — B.B. King',
      '"Success is not final, failure is not fatal: it is the courage to continue that counts." — Winston Churchill',
      '"The only way to do great work is to love what you do." — Steve Jobs',
      '"Believe you can and you\'re halfway there." — Theodore Roosevelt',
      '"In the middle of difficulty lies opportunity." — Albert Einstein',
      '"Quality is not an act, it is a habit." — Aristotle',
      '"Excellence is not a skill, it\'s an attitude." — Ralph Marston',
      '"The expert in anything was once a beginner." — Helen Hayes',
      '"Teaching is the greatest act of optimism." — Colleen Wilcox',
      '"The mind is not a vessel to be filled, but a fire to be kindled." — Plutarch',
      '"Learning is a treasure that will follow its owner everywhere." — Chinese Proverb',
      '"The roots of education are bitter, but the fruit is sweet." — Aristotle',
      '"An investment in knowledge pays the best interest." — Benjamin Franklin'
    ];
    
    // Use day of year to get consistent message for the day
    const now = new Date();
    const start = new Date(now.getFullYear(), 0, 0);
    const diff = now - start;
    const oneDay = 1000 * 60 * 60 * 24;
    const dayOfYear = Math.floor(diff / oneDay);
    
    const messageIndex = dayOfYear % messages.length;
    document.getElementById('dailyMessage').textContent = messages[messageIndex];
  }

  // Update current date
  function updateDate() {
    const now = new Date();
    const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
    document.getElementById('currentDate').textContent = now.toLocaleDateString('en-US', options);
  }

  // Initialize on page load
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', function() {
      updateDate();
      loadWeather();
      loadDailyMessage();
    });
  } else {
    updateDate();
    loadWeather();
    loadDailyMessage();
  }
</script>
