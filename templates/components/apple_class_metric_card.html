<article class="rmc-acx-metric-card" data-apple-class-metric-card="1">
  <span class="rmc-acx-metric-card__label">{{ label|default:"Metric" }}</span>
  <strong class="rmc-acx-metric-card__value">{{ value|default:"0" }}</strong>
  <span class="rmc-acx-metric-card__meta">{{ meta|default:"No trend available" }}</span>
</article>
