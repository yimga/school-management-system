<!-- Global Announcement Banner -->
{% load static %}

<!-- Display Active Announcements -->
{% if announcements %}
  {% for announcement in announcements %}
    {% if announcement.is_active %}
      <div class="visually-hidden rmc-empty-state-sentinel" aria-describedby="rmc_smart_action_hub" data-rmc-scroll-policy="paginate" data-page-critical-read="1" aria-hidden="true"></div>
<div class="announcement-banner {{ announcement.banner_type|default:'info' }}" id="announcement-{{ announcement.id }}">
        <div class="announcement-content">
          <div class="announcement-title">
            <i class="bi bi-megaphone-fill me-2"></i>{{ announcement.title }}
          </div>
          <p class="announcement-message mb-0">{{ announcement.message }}</p>
        </div>
        <button class="announcement-close" onclick="closeAnnouncement({{ announcement.id }});" type="button">
          &times;
        </button>
      </div>
    {% endif %}
  {% endfor %}
{% endif %}

<script src="{% static 'js/_pages/components__announcement_banner.js' %}"></script>
