{% load i18n %}
<header class="rmc-wcx-section-header" data-world-class-section-header="1">
  <div>
    <div class="rmc-wcx-section__eyebrow">{{ eyebrow|default:_("Guided workspace") }}</div>
    <h2 class="h4 mb-1">{{ title }}</h2>
    <p class="small text-muted mb-0">{{ purpose }}</p>
  </div>
  {% if action_url and action_label %}<a class="btn btn-outline-primary btn-sm" href="{{ action_url }}">{{ action_label }}</a>{% endif %}
</header>
