{% comment %}
  Light customization UI: Restore widgets only (no drag, no full customize).
  Used for parent dashboard.
{% endcomment %}
<button type="button" class="btn btn-outline-secondary btn-sm" id="btnAddWidget" aria-label="Restore hidden widget" title="Restore a hidden widget">
  <i class="bi bi-plus-square me-1"></i>Restore widget
</button>
<div class="modal fade" id="addWidgetModal" tabindex="-1" aria-labelledby="addWidgetModalLabel" aria-hidden="true">
  <div class="modal-dialog modal-dialog-scrollable">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="addWidgetModalLabel"><i class="bi bi-plus-square me-2"></i>Restore widget</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body" id="addWidgetModalBody">
        <p class="text-muted small mb-0">Restore a widget you previously hid.</p>
        <div id="addWidgetList" class="mt-3"></div>
      </div>
    </div>
  </div>
</div>
<div id="dashboard-layout-toast" class="position-fixed bottom-0 end-0 p-3" style="z-index: 1100;" aria-live="polite"></div>
