<section class="rmc-acx-glass-panel" data-apple-class-glass-panel="1" aria-labelledby="{{ panel_id|default:'apple-glass-panel-title' }}">
  <div class="visually-hidden rmc-empty-state-sentinel" aria-describedby="rmc_smart_action_hub" data-rmc-scroll-policy="paginate" data-page-critical-read="1" aria-hidden="true"></div>
<div class="rmc-acx-glass-panel__header">
    <span class="rmc-acx-layer-label">{{ label|default:"Layer" }}</span>
    <h2 id="{{ panel_id|default:'apple-glass-panel-title' }}" class="h5 mb-0">{{ title|default:"Context panel" }}</h2>
  </div>
  <p class="small text-muted mb-0">{{ body|default:"Layered context stays readable and secondary to the task." }}</p>
</section>
