{% load i18n %}
{% if RMC_OPERATOR_SURFACE_IA and RMC_OPERATOR_SURFACE_SPINE %}
<div class="dropdown rmc-operator-workspace-dropdown" data-rmc-operator-workspace-dropdown>
  <button type="button"
          class="btn btn-sm btn-outline-light dropdown-toggle rmc-platform-header__chip d-inline-flex align-items-center gap-1"
          id="rmcWorkspaceDropdown"
          data-bs-toggle="dropdown"
          aria-expanded="false"
          aria-label="{% trans 'Switch workspace' %}">
    <i class="bi bi-layers" aria-hidden="true"></i>
    <span class="d-none d-md-inline">{% trans "Workspace" %}</span>
  </button>
  <ul class="dropdown-menu dropdown-menu-dark dropdown-menu-end shadow" aria-labelledby="rmcWorkspaceDropdown">
    {% for link in RMC_OPERATOR_SURFACE_SPINE %}
    <li>
      <a class="dropdown-item d-flex align-items-center gap-2{% if link.active %} active{% endif %}"
         href="{{ link.url }}"
         data-rmc-surface="{{ link.surface }}"
         {% if link.active %}aria-current="true"{% endif %}>
        {% if link.icon %}<i class="bi {{ link.icon }}" aria-hidden="true"></i>{% endif %}
        <span>{{ link.label }}</span>
      </a>
    </li>
    {% endfor %}
  </ul>
</div>
{% endif %}
