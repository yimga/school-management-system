{% load i18n %}
{% comment %}Interactive Mission role tabs — ?mission_role= URL state (operator + tenant twins).{% endcomment %}
{% if mission_role_tabs %}
<div class="rmc-page-masthead__role-tabs cp-chip-row mt-2" role="tablist" aria-label="{% trans 'Role-shaped priorities' %}" data-rmc-mission-role-tabs="1">
  {% for tab in mission_role_tabs %}
  <a class="cp-chip{% if tab.active %} is-active{% endif %}"
     role="tab"
     href="{{ tab.href }}"
     aria-selected="{% if tab.active %}true{% else %}false{% endif %}"
     title="{{ tab.hint }}"
     data-rmc-mission-role="{{ tab.key }}">{{ tab.label }}{% if tab.count is not None %}<span class="rmc-mission-role-tab__count" title="{{ tab.count }} {% trans 'item(s) need attention' %}">{{ tab.count }}</span>{% endif %}</a>
  {% endfor %}
</div>
{% endif %}
