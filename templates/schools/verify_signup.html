{% extends "base.html" %}
{% load i18n %}
{% block title %}Verification{% endblock %}
{% block content %}
<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-md-6">
      <h1 class="h3 mb-4">{% trans "Verification" %}</h1>
      {% if error %}
      <div class="alert alert-danger">{{ error }}</div>
      <p><a href="{% url 'signup_school' %}">Try signing up again</a>.</p>
      {% else %}
      <p class="text-muted">Your school has been activated. Redirecting to login…</p>
      {% endif %}
    </div>
  </div>
</div>
{% endblock %}
