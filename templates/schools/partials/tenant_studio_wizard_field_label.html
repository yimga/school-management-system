{% load i18n %}
<label class="form-label tenant-studio-label" for="{{ field_id }}">
  <span class="tenant-studio-label__text">{{ label }}{% if required %}<span class="text-danger ms-1" aria-hidden="true">*</span>{% endif %}</span>
  {% if tag_title %}
  {% include "partials/rmc_info_tag.html" with title=tag_title body=tag_body placement="top" label=label %}
  {% endif %}
</label>
<div class="visually-hidden rmc-empty-state-sentinel" aria-describedby="rmc_smart_action_hub" data-rmc-scroll-policy="paginate" data-page-critical-read="1" aria-hidden="true"></div>
