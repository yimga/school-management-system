{% load i18n %}
{% if results %}
<div class="list-group list-group-flush">
  {% for school in results %}
  <a href="{{ school.portal_url }}" class="list-group-item list-group-item-action d-flex align-items-center justify-content-between rounded-3 mb-2 border">
    <span>
      <span class="fw-semibold d-block">{{ school.name }}</span>
      <span class="text-muted small">{{ school.slug }}</span>
    </span>
    <span class="text-primary fw-semibold">{% trans "Open" %} &rarr;</span>
  </a>
  {% endfor %}
</div>
{% elif query %}
<div class="alert alert-warning mb-0">{% trans "No matching school found. Check spelling and try again." %}</div>
{% else %}
<p class="text-muted mb-0 small">{% trans "Start typing your school name or URL slug." %}</p>
{% endif %}
