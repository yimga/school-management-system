{% load i18n %}
{# IT &amp; ops health artifact — service status. #}
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360" role="img" aria-labelledby="it-health-title">
  <title id="it-health-title">{% trans "IT operations health view showing tenant uptime, single sign-on, payments, and recent admin activity" %}</title>

  <defs>
    <linearGradient id="it-window-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#FDFCF9"/>
    </linearGradient>
    <linearGradient id="it-header-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F5F1E8"/>
      <stop offset="100%" stop-color="#F2EDE4"/>
    </linearGradient>
    <linearGradient id="it-good" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#34D399"/>
      <stop offset="100%" stop-color="#22C55E"/>
    </linearGradient>
    <filter id="it-shadow" x="-2%" y="-2%" width="104%" height="106%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3"/>
      <feOffset dx="0" dy="2"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.04"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect x="0" y="0" width="560" height="360" rx="16" fill="url(#it-window-grad)" stroke="#E5E1D8"/>
  <rect x="0" y="0" width="560" height="44" rx="16" fill="url(#it-header-grad)"/>
  <rect x="0" y="34" width="560" height="10" fill="url(#it-header-grad)"/>
  <line x1="0" y1="44" x2="560" y2="44" stroke="#E5E1D8"/>
  <g transform="translate(20 22)">
    <circle cx="0"  cy="0" r="5" fill="#F87171"/>
    <circle cx="14" cy="0" r="5" fill="#FBBF24"/>
    <circle cx="28" cy="0" r="5" fill="#34D399"/>
  </g>
  <text x="280" y="28" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="500" fill="#4B5563" text-anchor="middle">System · Health</text>

  {# Title row with live indicator #}
  <g font-family="Inter, system-ui, sans-serif" fill="#1F2937">
    <text x="28" y="84" font-family="Source Serif 4, Iowan Old Style, serif" font-size="24" font-weight="500" letter-spacing="-0.015em">{% trans "All systems quiet" %}</text>
    <text x="28" y="104" font-size="11" fill="#6B7280">{% trans "Last 30 days · zero incidents · zero pages" %}</text>
    {# Live pulse #}
    <g transform="translate(516 80)">
      <circle cx="0" cy="0" r="5" fill="url(#it-good)"/>
      <circle cx="0" cy="0" r="9" fill="none" stroke="#22C55E" stroke-opacity="0.25" stroke-width="2"/>
      <text x="-12" y="4" font-size="10" font-weight="600" fill="#166534" text-anchor="end">LIVE</text>
    </g>
  </g>

  {# Service rows with mini sparklines #}
  <g font-family="Inter, system-ui, sans-serif" fill="#1F2937">

    <g transform="translate(28 132)" filter="url(#it-shadow)">
      <rect width="504" height="48" rx="12" fill="#FFFFFF" stroke="#E5E1D8"/>
      <circle cx="24" cy="24" r="6" fill="url(#it-good)"/>
      <text x="46" y="22" font-size="13" font-weight="500">{% trans "Tenant uptime" %}</text>
      <text x="46" y="38" font-size="10" fill="#9CA3AF">{% trans "rolling 90 days · across 47 schools" %}</text>
      {# Sparkline #}
      <g transform="translate(320 18)">
        <path d="M 0 12 L 16 10 L 32 14 L 48 8 L 64 12 L 80 6 L 96 10 L 112 4" stroke="#166534" stroke-width="1.2" fill="none" stroke-linecap="round"/>
      </g>
      <text x="490" y="28" font-size="13" font-weight="600" fill="#166534" text-anchor="end">99.97%</text>
    </g>

    <g transform="translate(28 188)" filter="url(#it-shadow)">
      <rect width="504" height="48" rx="12" fill="#FFFFFF" stroke="#E5E1D8"/>
      <circle cx="24" cy="24" r="6" fill="url(#it-good)"/>
      <text x="46" y="22" font-size="13" font-weight="500">{% trans "Single sign-on" %}</text>
      <text x="46" y="38" font-size="10" fill="#9CA3AF">{% trans "Google · Microsoft · SAML · Magic link" %}</text>
      <text x="490" y="28" font-size="12" fill="#166534" text-anchor="end">{% trans "4 providers · green" %}</text>
    </g>

    <g transform="translate(28 244)" filter="url(#it-shadow)">
      <rect width="504" height="48" rx="12" fill="#FFFFFF" stroke="#E5E1D8"/>
      <circle cx="24" cy="24" r="6" fill="url(#it-good)"/>
      <text x="46" y="22" font-size="13" font-weight="500">{% trans "Payments &amp; reconciliation" %}</text>
      <text x="46" y="38" font-size="10" fill="#9CA3AF">{% trans "Stripe · GoCardless · last sync 3 min ago" %}</text>
      <text x="490" y="28" font-size="12" fill="#166534" text-anchor="end">{% trans "Ledger matched" %}</text>
    </g>

    <g transform="translate(28 300)" filter="url(#it-shadow)">
      <rect width="504" height="48" rx="12" fill="#FFFFFF" stroke="#E5E1D8"/>
      <circle cx="24" cy="24" r="6" fill="url(#it-good)"/>
      <text x="46" y="22" font-size="13" font-weight="500">{% trans "Email &amp; SMS delivery" %}</text>
      <text x="46" y="38" font-size="10" fill="#9CA3AF">{% trans "1,204 sent today · 99.8% delivered" %}</text>
      <text x="490" y="28" font-size="12" fill="#166534" text-anchor="end">{% trans "Within SLA" %}</text>
    </g>
  </g>
</svg>
