{% load i18n %}
{# IT &amp; ops health artifact — service status. #}
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 340" role="img" aria-labelledby="it-health-title">
  <title id="it-health-title">{% trans "IT operations health view showing tenant uptime, single sign-on, payments, and recent admin activity" %}</title>

  <rect x="0" y="0" width="520" height="340" rx="14" fill="#FFFFFF" stroke="#E5E1D8"/>

  {# Header #}
  <g>
    <rect x="0" y="0" width="520" height="44" rx="14" fill="#F2EDE4"/>
    <rect x="0" y="34" width="520" height="10" fill="#F2EDE4"/>
    <g transform="translate(20 22)" fill="#9CA3AF">
      <circle cx="0" cy="0" r="4"/>
      <circle cx="14" cy="0" r="4"/>
      <circle cx="28" cy="0" r="4"/>
    </g>
    <text x="260" y="27" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="500" fill="#4B5563" text-anchor="middle">{% trans "System · Health" %}</text>
  </g>

  {# Title #}
  <g font-family="Inter, system-ui, sans-serif" fill="#1F2937">
    <text x="28" y="80" font-family="Source Serif 4, Iowan Old Style, serif" font-size="20">{% trans "Everything's running" %}</text>
    <text x="28" y="100" font-size="12" fill="#6B7280">{% trans "Last 30 days · no incidents" %}</text>
  </g>

  {# Service rows #}
  <g font-family="Inter, system-ui, sans-serif" fill="#1F2937">

    <g transform="translate(28 124)">
      <rect width="464" height="40" rx="8" fill="#FAF7F2" stroke="#E5E1D8"/>
      <circle cx="20" cy="20" r="5" fill="#166534"/>
      <text x="40" y="25" font-size="13" font-weight="500">{% trans "Tenant uptime" %}</text>
      <text x="448" y="25" font-size="13" fill="#1F2937" text-anchor="end">99.97%</text>
    </g>

    <g transform="translate(28 172)">
      <rect width="464" height="40" rx="8" fill="#FAF7F2" stroke="#E5E1D8"/>
      <circle cx="20" cy="20" r="5" fill="#166534"/>
      <text x="40" y="25" font-size="13" font-weight="500">{% trans "Single sign-on" %}</text>
      <text x="448" y="25" font-size="11" fill="#6B7280" text-anchor="end">{% trans "All providers green" %}</text>
    </g>

    <g transform="translate(28 220)">
      <rect width="464" height="40" rx="8" fill="#FAF7F2" stroke="#E5E1D8"/>
      <circle cx="20" cy="20" r="5" fill="#166534"/>
      <text x="40" y="25" font-size="13" font-weight="500">{% trans "Payments" %}</text>
      <text x="448" y="25" font-size="11" fill="#6B7280" text-anchor="end">{% trans "Reconciled to ledger" %}</text>
    </g>

    <g transform="translate(28 268)">
      <rect width="464" height="40" rx="8" fill="#FAF7F2" stroke="#E5E1D8"/>
      <circle cx="20" cy="20" r="5" fill="#166534"/>
      <text x="40" y="25" font-size="13" font-weight="500">{% trans "Email &amp; SMS" %}</text>
      <text x="448" y="25" font-size="11" fill="#6B7280" text-anchor="end">{% trans "1,204 sent today" %}</text>
    </g>
  </g>

  <text x="28" y="324" font-family="Inter, system-ui, sans-serif" font-size="10" fill="#9CA3AF">{% trans "Term 2 blueprint applied · 12 minutes ago" %}</text>
</svg>
