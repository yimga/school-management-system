{% load i18n %}
{# Hero artifact — parent's phone showing today's school summary. Decorative; the parent <div> sets aria-hidden. #}
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 680" role="img" aria-labelledby="parent-phone-title">
  <title id="parent-phone-title">{% trans "A parent's phone showing today's permission slip, attendance, and fee reminder for Cedar Ridge Academy" %}</title>

  <defs>
    <clipPath id="phone-screen-clip">
      <rect x="20" y="20" width="300" height="640" rx="34"/>
    </clipPath>
  </defs>

  {# Phone bezel #}
  <rect x="8" y="8" width="324" height="664" rx="42" fill="#1F2937"/>
  {# Screen #}
  <rect x="20" y="20" width="300" height="640" rx="34" fill="#FAF7F2"/>

  <g clip-path="url(#phone-screen-clip)" font-family="Inter, system-ui, sans-serif" fill="#1F2937">

    {# Status bar #}
    <text x="42" y="48" font-size="13" font-weight="600" fill="#1F2937">8:14</text>
    <g transform="translate(258 38)" fill="#1F2937">
      <rect x="0" y="0" width="4" height="10" rx="1"/>
      <rect x="6" y="-2" width="4" height="12" rx="1"/>
      <rect x="12" y="-4" width="4" height="14" rx="1"/>
      <rect x="22" y="-2" width="20" height="10" rx="2" fill="none" stroke="#1F2937" stroke-width="1.2"/>
      <rect x="24" y="0" width="14" height="6" rx="1"/>
    </g>

    {# App header — school name + greeting #}
    <g transform="translate(42 86)">
      <circle cx="0" cy="0" r="14" fill="#C2410C"/>
      <text x="-5" y="5" font-size="13" font-weight="600" fill="#FAF7F2" font-family="Source Serif 4, Iowan Old Style, serif">C</text>
      <text x="22" y="-2" font-size="11" font-weight="500" fill="#6B7280" letter-spacing="0.04em">CEDAR RIDGE ACADEMY</text>
      <text x="22" y="14" font-size="14" font-weight="500" fill="#1F2937">{% trans "Good morning, Imani" %}</text>
    </g>

    {# Section label #}
    <text x="42" y="138" font-size="11" font-weight="500" fill="#6B7280" letter-spacing="0.06em">{% trans "TODAY" %}</text>

    {# Card 1 — Today's message #}
    <g transform="translate(34 152)">
      <rect width="272" height="108" rx="14" fill="#FFFFFF" stroke="#E5E1D8"/>
      <text x="20" y="32" font-size="11" font-weight="500" fill="#6B7280" letter-spacing="0.04em">{% trans "MESSAGE" %}</text>
      <text x="20" y="56" font-size="16" font-weight="500" fill="#1F2937" font-family="Source Serif 4, Iowan Old Style, serif">{% trans "Year 5 field trip" %}</text>
      <text x="20" y="76" font-size="12" fill="#4B5563">{% trans "Permission slip — by Friday." %}</text>
      <rect x="20" y="86" width="64" height="14" rx="7" fill="#1F2937"/>
      <text x="52" y="96" font-size="10" font-weight="500" fill="#FAF7F2" text-anchor="middle">{% trans "Sign" %}</text>
    </g>

    {# Card 2 — Maya's attendance #}
    <g transform="translate(34 280)">
      <rect width="272" height="80" rx="14" fill="#FFFFFF" stroke="#E5E1D8"/>
      <text x="20" y="30" font-size="11" font-weight="500" fill="#6B7280" letter-spacing="0.04em">{% trans "MAYA · YEAR 5B" %}</text>
      <circle cx="26" cy="52" r="4" fill="#166534"/>
      <text x="38" y="56" font-size="13" fill="#1F2937">{% trans "Present at 8:42" %}</text>
      <text x="252" y="56" font-size="11" fill="#6B7280" text-anchor="end">{% trans "Tap to view" %} ›</text>
    </g>

    {# Card 3 — Pay reminder #}
    <g transform="translate(34 380)">
      <rect width="272" height="108" rx="14" fill="#FFFFFF" stroke="#E5E1D8"/>
      <text x="20" y="32" font-size="11" font-weight="500" fill="#6B7280" letter-spacing="0.04em">{% trans "FEES" %}</text>
      <text x="20" y="56" font-size="16" font-weight="500" fill="#1F2937" font-family="Source Serif 4, Iowan Old Style, serif">{% trans "Term 2" %}</text>
      <text x="20" y="76" font-size="12" fill="#4B5563">£445 · {% trans "due Mon 24 Mar" %}</text>
      <rect x="20" y="86" width="56" height="14" rx="7" fill="#C2410C"/>
      <text x="48" y="96" font-size="10" font-weight="500" fill="#FAF7F2" text-anchor="middle">{% trans "Pay" %}</text>
    </g>

    {# Card 4 — Quiet update #}
    <g transform="translate(34 508)">
      <rect width="272" height="68" rx="14" fill="#F2EDE4"/>
      <text x="20" y="30" font-size="11" font-weight="500" fill="#6B7280" letter-spacing="0.04em">{% trans "FROM SCHOOL" %}</text>
      <text x="20" y="50" font-size="12" fill="#1F2937">{% trans "Parents' evening: 26 March, 5–8 p.m." %}</text>
    </g>

    {# Bottom tab bar #}
    <g transform="translate(0 600)">
      <line x1="20" y1="0" x2="320" y2="0" stroke="#E5E1D8"/>
      <g font-size="9" font-weight="500" fill="#1F2937" text-anchor="middle">
        <g transform="translate(80 28)">
          <circle cx="0" cy="-8" r="3" fill="#1F2937"/>
          <text>{% trans "Home" %}</text>
        </g>
        <g transform="translate(140 28)" fill="#9CA3AF">
          <circle cx="0" cy="-8" r="3" fill="#9CA3AF"/>
          <text>{% trans "Messages" %}</text>
        </g>
        <g transform="translate(200 28)" fill="#9CA3AF">
          <circle cx="0" cy="-8" r="3" fill="#9CA3AF"/>
          <text>{% trans "Pay" %}</text>
        </g>
        <g transform="translate(260 28)" fill="#9CA3AF">
          <circle cx="0" cy="-8" r="3" fill="#9CA3AF"/>
          <text>{% trans "Profile" %}</text>
        </g>
      </g>
    </g>
  </g>
</svg>
