{% load i18n %}
{% comment %}
Auto-cycling walkthrough preview. CSS keyframes fade between five labeled
"moments" — works as a visual stand-in until a real 60s video drops in.
Decorative; parent <video> poster picks this up as a still frame.
{% endcomment %}
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="reel-title">
  <title id="reel-title">{% trans "Auto-cycling preview of a school day on RunMyCampus — bell-by-bell" %}</title>

  <defs>
    <linearGradient id="reel-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#FAF7F2"/>
      <stop offset="100%" stop-color="#F2EDE4"/>
    </linearGradient>
    <linearGradient id="reel-card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#FDFBF6"/>
    </linearGradient>

    
  </defs>

  <rect x="0" y="0" width="960" height="540" rx="12" fill="url(#reel-bg)"/>

  <!-- Scene 1 — Morning bell, attendance -->
  <g class="reel-scene reel-scene--1">
    <text x="60" y="80" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="600" fill="#C2410C" letter-spacing="0.1em">08:15 · MORNING BELL</text>
    <text x="60" y="138" font-family="Source Serif 4, Iowan Old Style, serif" font-size="44" font-weight="500" fill="#1F2937" letter-spacing="-0.02em">Year 5B's roll marks itself.</text>
    <text x="60" y="172" font-family="Inter, system-ui, sans-serif" font-size="16" fill="#6B7280">Nine seconds, auto-saved, shared with the office.</text>

    <g transform="translate(540 240)">
      <rect width="360" height="220" rx="14" fill="url(#reel-card)" stroke="#E5E1D8"/>
      <text x="24" y="38" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="600" fill="#6B7280" letter-spacing="0.08em">YEAR 5B · 8:42 A.M.</text>
      <g font-family="Inter, system-ui, sans-serif" font-size="13" fill="#1F2937">
        <g transform="translate(24 70)">
          <circle cx="14" cy="-4" r="8" fill="#FED7AA"/><text x="11" y="0" font-size="9" font-weight="600" fill="#9A3412">MC</text>
          <text x="36">Maya Chen</text>
          <circle cx="270" cy="-4" r="4" fill="#22C55E"/><text x="284" y="0" font-size="11">Present</text>
        </g>
        <g transform="translate(24 96)">
          <circle cx="14" cy="-4" r="8" fill="#BBF7D0"/><text x="11" y="0" font-size="9" font-weight="600" fill="#166534">DO</text>
          <text x="36">Daniel Okeke</text>
          <circle cx="270" cy="-4" r="4" fill="#22C55E"/><text x="284" y="0" font-size="11">Present</text>
        </g>
        <g transform="translate(24 122)">
          <circle cx="14" cy="-4" r="8" fill="#FDE68A"/><text x="11" y="0" font-size="9" font-weight="600" fill="#92400E">PS</text>
          <text x="36">Priya Shah</text>
          <circle cx="270" cy="-4" r="4" fill="#FBBF24"/><text x="284" y="0" font-size="11">Late</text>
        </g>
        <rect x="14" y="138" width="332" height="24" rx="6" fill="#FEF3E7"/>
        <g transform="translate(24 156)">
          <circle cx="14" cy="-4" r="8" fill="#FED7AA"/><text x="11" y="0" font-size="9" font-weight="600" fill="#9A3412">AK</text>
          <text x="36" font-weight="500">Aisha Khan</text>
          <text x="220" y="0" font-size="11" font-weight="600" fill="#C2410C">Notify parent →</text>
        </g>
      </g>
    </g>
  </g>

  <!-- Scene 2 — Leadership stand-up, permission slips -->
  <g class="reel-scene reel-scene--2">
    <text x="60" y="80" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="600" fill="#65755C" letter-spacing="0.1em">10:30 · STAND-UP</text>
    <text x="60" y="138" font-family="Source Serif 4, Iowan Old Style, serif" font-size="44" font-weight="500" fill="#1F2937" letter-spacing="-0.02em">Y9 trip slips clear in five minutes.</text>
    <text x="60" y="172" font-family="Inter, system-ui, sans-serif" font-size="16" fill="#6B7280">27 of 28 back. Last family nudged automatically.</text>

    <g transform="translate(540 220)">
      <rect width="360" height="260" rx="14" fill="url(#reel-card)" stroke="#E5E1D8"/>
      <text x="24" y="38" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="600" fill="#9A3412" letter-spacing="0.06em">PERMISSION SLIPS · YEAR 9 HISTORY</text>
      <text x="24" y="78" font-family="Source Serif 4, Iowan Old Style, serif" font-size="48" font-weight="500" fill="#1F2937" letter-spacing="-0.03em">27 / 28</text>
      <text x="160" y="78" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#6B7280">returned</text>
      <rect x="24" y="100" width="312" height="6" rx="3" fill="#E5E1D8"/>
      <rect x="24" y="100" width="301" height="6" rx="3" fill="#166534"/>
      <text x="24" y="140" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="600" fill="#6B7280" letter-spacing="0.06em">LAST FAMILY</text>
      <text x="24" y="164" font-family="Source Serif 4, Iowan Old Style, serif" font-size="16" font-weight="500" fill="#1F2937">Khan family · Aisha</text>
      <text x="24" y="184" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#6B7280">Reminder auto-sent · 10:31 a.m.</text>
      <g transform="translate(24 208)">
        <rect width="120" height="32" rx="16" fill="#1F2937"/>
        <text x="60" y="20" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="500" fill="#FAF7F2" text-anchor="middle">Approve trip</text>
      </g>
    </g>
  </g>

  <!-- Scene 3 — Lunch count, kitchen ledger -->
  <g class="reel-scene reel-scene--3">
    <text x="60" y="80" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="600" fill="#A16207" letter-spacing="0.1em">12:00 · LUNCH</text>
    <text x="60" y="138" font-family="Source Serif 4, Iowan Old Style, serif" font-size="44" font-weight="500" fill="#1F2937" letter-spacing="-0.02em">412 hot meals counted.</text>
    <text x="60" y="172" font-family="Inter, system-ui, sans-serif" font-size="16" fill="#6B7280">Kitchen ledger reconciles before the bell.</text>

    <g transform="translate(540 220)">
      <rect width="360" height="260" rx="14" fill="url(#reel-card)" stroke="#E5E1D8"/>
      <text x="24" y="38" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="600" fill="#6B7280" letter-spacing="0.08em">CANTEEN · TUESDAY</text>
      <g font-family="Inter, system-ui, sans-serif" fill="#1F2937">
        <g transform="translate(24 70)">
          <text font-size="11" font-weight="600" fill="#9CA3AF" letter-spacing="0.06em">HOT MEALS</text>
          <text x="0" y="32" font-family="Source Serif 4, Iowan Old Style, serif" font-size="38" font-weight="500" letter-spacing="-0.03em">412</text>
        </g>
        <g transform="translate(170 70)">
          <text font-size="11" font-weight="600" fill="#9CA3AF" letter-spacing="0.06em">LEDGER</text>
          <text x="0" y="32" font-family="Source Serif 4, Iowan Old Style, serif" font-size="38" font-weight="500" fill="#166534" letter-spacing="-0.03em">£1,237</text>
        </g>
        <text x="24" y="148" font-size="11" font-weight="600" fill="#C2410C" letter-spacing="0.06em">DIETARY FLAGS · 3</text>
        <g transform="translate(24 168)" font-size="12">
          <text>· No nuts · Halal · Coeliac</text>
          <text y="20" fill="#6B7280">All notified to chef. Plates pre-labelled.</text>
        </g>
      </g>
    </g>
  </g>

  <!-- Scene 4 — Dismissal, parent notifications -->
  <g class="reel-scene reel-scene--4">
    <text x="60" y="80" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="600" fill="#475569" letter-spacing="0.1em">15:15 · LAST BELL</text>
    <text x="60" y="138" font-family="Source Serif 4, Iowan Old Style, serif" font-size="44" font-weight="500" fill="#1F2937" letter-spacing="-0.02em">47 buses leave, parents notified.</text>
    <text x="60" y="172" font-family="Inter, system-ui, sans-serif" font-size="16" fill="#6B7280">Imani's phone hums: "Maya is on the 47."</text>

    <g transform="translate(630 200)">
      <rect width="180" height="300" rx="20" fill="#1F2937"/>
      <rect x="6" y="6" width="168" height="288" rx="16" fill="#FAF7F2"/>
      <g font-family="Inter, system-ui, sans-serif" fill="#1F2937">
        <circle cx="24" cy="44" r="10" fill="#C2410C"/>
        <text x="20" y="48" font-size="11" font-weight="600" fill="#FAF7F2">C</text>
        <text x="40" y="42" font-size="9" fill="#9CA3AF" letter-spacing="0.1em">CEDAR RIDGE</text>
        <text x="40" y="56" font-size="13" font-weight="600">Hi, Imani</text>
        <rect x="14" y="80" width="152" height="64" rx="10" fill="#FFFFFF" stroke="#E5E1D8"/>
        <text x="26" y="100" font-size="9" font-weight="600" fill="#166534" letter-spacing="0.06em">ON THE BUS</text>
        <text x="26" y="120" font-family="Source Serif 4, Iowan Old Style, serif" font-size="14" font-weight="500">Maya · 47</text>
        <text x="26" y="136" font-size="10" fill="#6B7280">Home in 22 min</text>
      </g>
    </g>
  </g>

  <!-- Scene 5 — Day closed, briefing emailed -->
  <g class="reel-scene reel-scene--5">
    <text x="60" y="80" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="600" fill="#3B3024" letter-spacing="0.1em">17:30 · CLOSED</text>
    <text x="60" y="138" font-family="Source Serif 4, Iowan Old Style, serif" font-size="44" font-weight="500" fill="#1F2937" letter-spacing="-0.02em">Tomorrow is already staged.</text>
    <text x="60" y="172" font-family="Inter, system-ui, sans-serif" font-size="16" fill="#6B7280">Olu closes her laptop. Zero items waiting.</text>

    <g transform="translate(540 220)">
      <rect width="360" height="260" rx="14" fill="url(#reel-card)" stroke="#E5E1D8"/>
      <text x="24" y="38" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="600" fill="#6B7280" letter-spacing="0.08em">DAILY BRIEFING · NO. 142</text>
      <text x="24" y="76" font-family="Source Serif 4, Iowan Old Style, serif" font-size="22" font-weight="500" fill="#1F2937" letter-spacing="-0.015em">Tuesday closed. Quiet day.</text>
      <g font-family="Inter, system-ui, sans-serif" font-size="12" fill="#6B7280">
        <text x="24" y="110">· Attendance: 94% · cover sorted</text>
        <text x="24" y="132">· Fees collected today: £1,240</text>
        <text x="24" y="154">· Incidents: 3 · 1 followed up</text>
        <text x="24" y="176">· Tomorrow: Parents' evening rota staged</text>
      </g>
      <text x="24" y="220" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="600" fill="#166534" letter-spacing="0.06em">EMAILED TO OLU · 17:30:42</text>
    </g>
  </g>

  <!-- Progress bar at bottom, paced to the scene cycle -->
  <rect x="60" y="500" width="840" height="3" rx="1.5" fill="#E5E1D8"/>
  <rect x="60" y="500" width="840" height="3" rx="1.5" fill="#C2410C" class="reel-progress"/>
</svg>
