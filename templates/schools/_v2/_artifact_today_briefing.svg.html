{% load i18n %}
{% comment %}
Hero artifact — "Today's briefing" school daily sheet. Editorial poster style
evoking a school's daily bulletin. Tells a story: how the platform sees a day
at Cedar Ridge Academy from morning roll to dismissal. Decorative; parent div
sets aria-hidden.
{% endcomment %}
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 740" role="img" aria-labelledby="today-briefing-title">
  <title id="today-briefing-title">{% trans "Today's briefing for Cedar Ridge Academy — a school day from morning roll to dismissal" %}</title>

  <defs>
    <linearGradient id="tb-paper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#FBF7F0"/>
    </linearGradient>
    <linearGradient id="tb-crest" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#EA580C"/>
      <stop offset="100%" stop-color="#9A3412"/>
    </linearGradient>
    <linearGradient id="tb-card-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#FDFBF6"/>
    </linearGradient>
    <linearGradient id="tb-banner-grad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#1F2937"/>
      <stop offset="100%" stop-color="#374151"/>
    </linearGradient>
    <filter id="tb-paper-shadow" x="-2%" y="-1%" width="104%" height="104%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="6"/>
      <feOffset dx="0" dy="6"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.08"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="tb-card-shadow" x="-4%" y="-4%" width="108%" height="110%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="2"/>
      <feOffset dx="0" dy="2"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.05"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="tb-rule" patternUnits="userSpaceOnUse" width="6" height="6">
      <path d="M 0 6 L 6 0" stroke="rgba(31,41,55,0.06)" stroke-width="0.5"/>
    </pattern>
  </defs>

  {# Outer paper sheet with soft drop shadow — feels like a printed bulletin #}
  <g filter="url(#tb-paper-shadow)">
    <rect x="10" y="10" width="380" height="720" rx="14" fill="url(#tb-paper)" stroke="#E8E2D5" stroke-width="1"/>
  </g>

  {# Decorative top rule with school colors #}
  <rect x="10" y="10" width="380" height="6" rx="14" fill="url(#tb-crest)"/>
  <rect x="10" y="14" width="380" height="3" fill="#FBF7F0"/>

  {# Masthead — like a school newspaper #}
  <g font-family="Inter, system-ui, sans-serif">
    {# Tiny crest #}
    <g transform="translate(34 44)">
      <path d="M 0 0 L 22 0 L 22 18 L 11 26 L 0 18 Z" fill="url(#tb-crest)"/>
      <text x="11" y="16" font-size="11" font-weight="600" font-family="Source Serif 4, Iowan Old Style, serif" fill="#FAF7F2" text-anchor="middle">C</text>
    </g>
    {# Wordmark #}
    <text x="64" y="44" font-family="Source Serif 4, Iowan Old Style, serif" font-size="14" font-weight="600" fill="#1F2937" letter-spacing="-0.005em">Cedar Ridge Academy</text>
    <text x="64" y="58" font-size="9" font-weight="500" fill="#9CA3AF" letter-spacing="0.12em">DAILY BRIEFING · TUE 18 MAR</text>

    {# Live pulse + edition stamp #}
    <g transform="translate(366 44)" text-anchor="end">
      <circle cx="-8" cy="-4" r="3" fill="#22C55E"/>
      <circle cx="-8" cy="-4" r="6" fill="none" stroke="#22C55E" stroke-opacity="0.25" stroke-width="2"/>
      <text x="-16" y="0" font-size="9" font-weight="600" fill="#166534">LIVE</text>
      <text x="0" y="14" font-size="9" fill="#9CA3AF">No. 142</text>
    </g>
  </g>

  {# Rule beneath masthead — editorial divider #}
  <line x1="34" y1="78" x2="366" y2="78" stroke="#1F2937" stroke-width="0.75"/>
  <line x1="34" y1="82" x2="366" y2="82" stroke="#1F2937" stroke-width="0.25"/>

  {# Lead headline — like a paper's hero story #}
  <g font-family="Source Serif 4, Iowan Old Style, serif" fill="#1F2937">
    <text x="34" y="116" font-size="11" font-weight="600" fill="#C2410C" letter-spacing="0.06em" font-family="Inter, system-ui, sans-serif">{% trans "TODAY'S RHYTHM" %}</text>
    <text x="34" y="146" font-size="22" font-weight="500" letter-spacing="-0.02em">{% trans "A Tuesday in five bells." %}</text>
    <text x="34" y="166" font-size="11" fill="#6B7280" font-family="Inter, system-ui, sans-serif">{% trans "Cover sorted. Fees flowing. Year 9 trip cleared by lunch." %}</text>
  </g>

  {# Timeline — the heart of the artifact: 5 bells of the day #}
  <g font-family="Inter, system-ui, sans-serif" transform="translate(34 192)">
    {# Vertical guideline #}
    <line x1="42" y1="6" x2="42" y2="266" stroke="#E5E1D8" stroke-width="1"/>

    {# Bell 1 — Morning #}
    <g transform="translate(0 0)">
      <circle cx="42" cy="14" r="11" fill="#FFFFFF" stroke="#1F2937" stroke-width="1.5"/>
      <text x="42" y="18" font-size="10" font-weight="600" fill="#1F2937" text-anchor="middle">1</text>
      <text x="0"  y="11" font-size="10" font-weight="600" fill="#6B7280" letter-spacing="0.06em">8:15 A.M.</text>
      <text x="0"  y="26" font-size="9" fill="#9CA3AF">{% trans "Morning bell" %}</text>
      <text x="64" y="11" font-family="Source Serif 4, Iowan Old Style, serif" font-size="14" font-weight="500" fill="#1F2937" letter-spacing="-0.01em">{% trans "Morning roll marked" %}</text>
      <text x="64" y="26" font-size="10" fill="#6B7280">{% trans "942 of 1,002 students · 3 late · 1 absent" %}</text>
    </g>

    {# Bell 2 — Mid-morning #}
    <g transform="translate(0 54)">
      <circle cx="42" cy="14" r="11" fill="#FFFFFF" stroke="#1F2937" stroke-width="1.5"/>
      <text x="42" y="18" font-size="10" font-weight="600" fill="#1F2937" text-anchor="middle">2</text>
      <text x="0"  y="11" font-size="10" font-weight="600" fill="#6B7280" letter-spacing="0.06em">10:30</text>
      <text x="0"  y="26" font-size="9" fill="#9CA3AF">{% trans "Leadership" %}</text>
      <text x="64" y="11" font-family="Source Serif 4, Iowan Old Style, serif" font-size="14" font-weight="500" fill="#1F2937" letter-spacing="-0.01em">{% trans "Olu signs Y9 trip" %}</text>
      <text x="64" y="26" font-size="10" fill="#6B7280">{% trans "27 of 28 slips returned · 1 reminder sent" %}</text>
    </g>

    {# Bell 3 — Lunch #}
    <g transform="translate(0 108)">
      <circle cx="42" cy="14" r="11" fill="#FFFFFF" stroke="#1F2937" stroke-width="1.5"/>
      <text x="42" y="18" font-size="10" font-weight="600" fill="#1F2937" text-anchor="middle">3</text>
      <text x="0"  y="11" font-size="10" font-weight="600" fill="#6B7280" letter-spacing="0.06em">12:00 P.M.</text>
      <text x="0"  y="26" font-size="9" fill="#9CA3AF">{% trans "Lunch" %}</text>
      <text x="64" y="11" font-family="Source Serif 4, Iowan Old Style, serif" font-size="14" font-weight="500" fill="#1F2937" letter-spacing="-0.01em">{% trans "412 hot meals counted" %}</text>
      <text x="64" y="26" font-size="10" fill="#6B7280">{% trans "Kitchen ledger reconciles · 3 dietary flags noted" %}</text>
    </g>

    {# Bell 4 — Afternoon #}
    <g transform="translate(0 162)">
      <circle cx="42" cy="14" r="11" fill="#FFFFFF" stroke="#1F2937" stroke-width="1.5"/>
      <text x="42" y="18" font-size="10" font-weight="600" fill="#1F2937" text-anchor="middle">4</text>
      <text x="0"  y="11" font-size="10" font-weight="600" fill="#6B7280" letter-spacing="0.06em">3:15</text>
      <text x="0"  y="26" font-size="9" fill="#9CA3AF">{% trans "Dismissal" %}</text>
      <text x="64" y="11" font-family="Source Serif 4, Iowan Old Style, serif" font-size="14" font-weight="500" fill="#1F2937" letter-spacing="-0.01em">{% trans "Buses out, parents notified" %}</text>
      <text x="64" y="26" font-size="10" fill="#6B7280">{% trans "47 routes · 6 messages quietly sent" %}</text>
    </g>

    {# Bell 5 — Evening #}
    <g transform="translate(0 216)">
      <circle cx="42" cy="14" r="11" fill="url(#tb-banner-grad)"/>
      <text x="42" y="18" font-size="10" font-weight="600" fill="#FAF7F2" text-anchor="middle">5</text>
      <text x="0"  y="11" font-size="10" font-weight="600" fill="#6B7280" letter-spacing="0.06em">5:30 P.M.</text>
      <text x="0"  y="26" font-size="9" fill="#9CA3AF">{% trans "Day closed" %}</text>
      <text x="64" y="11" font-family="Source Serif 4, Iowan Old Style, serif" font-size="14" font-weight="500" fill="#1F2937" letter-spacing="-0.01em">{% trans "Briefing emailed to Olu" %}</text>
      <text x="64" y="26" font-size="10" fill="#6B7280">{% trans "Tomorrow's plan staged · zero items waiting" %}</text>
    </g>
  </g>

  {# Quiet pulse row — three small metrics #}
  <g font-family="Inter, system-ui, sans-serif" transform="translate(34 488)">
    <text font-size="10" font-weight="600" fill="#6B7280" letter-spacing="0.08em">{% trans "QUIETLY HAPPENING" %}</text>
    {# Metric 1 — Attendance #}
    <g transform="translate(0 14)" filter="url(#tb-card-shadow)">
      <rect width="106" height="56" rx="10" fill="url(#tb-card-grad)" stroke="#E8E2D5"/>
      <text x="12" y="22" font-size="9" font-weight="600" fill="#9CA3AF" letter-spacing="0.06em">ATTENDANCE</text>
      <text x="12" y="44" font-family="Source Serif 4, Iowan Old Style, serif" font-size="20" font-weight="500" fill="#1F2937" letter-spacing="-0.02em">94%</text>
      <g transform="translate(86 38)">
        <path d="M 0 8 L 4 0 L 8 4" fill="none" stroke="#166534" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
      </g>
    </g>
    {# Metric 2 — Fees #}
    <g transform="translate(112 14)" filter="url(#tb-card-shadow)">
      <rect width="106" height="56" rx="10" fill="url(#tb-card-grad)" stroke="#E8E2D5"/>
      <text x="12" y="22" font-size="9" font-weight="600" fill="#9CA3AF" letter-spacing="0.06em">FEES TODAY</text>
      <text x="12" y="44" font-family="Source Serif 4, Iowan Old Style, serif" font-size="20" font-weight="500" fill="#1F2937" letter-spacing="-0.02em">£1,240</text>
    </g>
    {# Metric 3 — Messages #}
    <g transform="translate(224 14)" filter="url(#tb-card-shadow)">
      <rect width="108" height="56" rx="10" fill="url(#tb-card-grad)" stroke="#E8E2D5"/>
      <text x="12" y="22" font-size="9" font-weight="600" fill="#9CA3AF" letter-spacing="0.06em">MESSAGES</text>
      <text x="12" y="44" font-family="Source Serif 4, Iowan Old Style, serif" font-size="20" font-weight="500" fill="#1F2937" letter-spacing="-0.02em">3 <tspan font-size="10" fill="#6B7280" font-family="Inter, system-ui, sans-serif">waiting</tspan></text>
    </g>
  </g>

  {# "Up next this week" mini editorial calendar — like a paper's "this week" rail #}
  <g font-family="Inter, system-ui, sans-serif" transform="translate(34 580)">
    <text font-size="10" font-weight="600" fill="#6B7280" letter-spacing="0.08em">{% trans "UP NEXT" %}</text>
    <g transform="translate(0 14)">
      <line x1="0" y1="0" x2="332" y2="0" stroke="#1F2937" stroke-width="0.5"/>
    </g>
    {# Row 1 — Thu #}
    <g transform="translate(0 28)">
      <text x="0" y="0" font-size="10" font-weight="600" fill="#1F2937" letter-spacing="0.04em">THU</text>
      <text x="0" y="14" font-size="9" fill="#9CA3AF">20 Mar</text>
      <text x="64" y="0" font-family="Source Serif 4, Iowan Old Style, serif" font-size="14" fill="#1F2937">{% trans "Parents' evening" %}</text>
      <text x="64" y="14" font-size="10" fill="#6B7280">{% trans "5 — 8 p.m. · 142 slots booked" %}</text>
    </g>
    <line x1="0" y1="52" x2="332" y2="52" stroke="#F0EBE0" stroke-width="0.75"/>
    {# Row 2 — Fri #}
    <g transform="translate(0 64)">
      <text x="0" y="0" font-size="10" font-weight="600" fill="#1F2937" letter-spacing="0.04em">FRI</text>
      <text x="0" y="14" font-size="9" fill="#9CA3AF">21 Mar</text>
      <text x="64" y="0" font-family="Source Serif 4, Iowan Old Style, serif" font-size="14" fill="#1F2937">{% trans "Mid-term reports issued" %}</text>
      <text x="64" y="14" font-size="10" fill="#6B7280">{% trans "Auto-emailed to 638 families at 3 p.m." %}</text>
    </g>
    <line x1="0" y1="88" x2="332" y2="88" stroke="#F0EBE0" stroke-width="0.75"/>
    {# Row 3 — Mon #}
    <g transform="translate(0 100)">
      <text x="0" y="0" font-size="10" font-weight="600" fill="#1F2937" letter-spacing="0.04em">MON</text>
      <text x="0" y="14" font-size="9" fill="#9CA3AF">24 Mar</text>
      <text x="64" y="0" font-family="Source Serif 4, Iowan Old Style, serif" font-size="14" fill="#1F2937">{% trans "Year 9 history trip" %}</text>
      <text x="64" y="14" font-size="10" fill="#6B7280">{% trans "27 students · risk plan filed" %}</text>
    </g>
  </g>
</svg>
