{% load i18n %}
{# Leader overview artifact — a school-at-a-glance dashboard. #}
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 340" role="img" aria-labelledby="leader-overview-title">
  <title id="leader-overview-title">{% trans "School-leader overview showing today's attendance, fees, and staffing for Cedar Ridge Academy" %}</title>

  {# Window frame #}
  <rect x="0" y="0" width="520" height="340" rx="14" fill="#FFFFFF" stroke="#E5E1D8"/>

  {# Header bar #}
  <g>
    <rect x="0" y="0" width="520" height="44" rx="14" fill="#F2EDE4"/>
    <rect x="0" y="34" width="520" height="10" fill="#F2EDE4"/>
    <g transform="translate(20 22)" fill="#9CA3AF">
      <circle cx="0" cy="0" r="4"/>
      <circle cx="14" cy="0" r="4"/>
      <circle cx="28" cy="0" r="4"/>
    </g>
    <text x="260" y="27" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="500" fill="#4B5563" text-anchor="middle">{% trans "Cedar Ridge Academy · Today" %}</text>
  </g>

  {# Title row #}
  <g font-family="Inter, system-ui, sans-serif" fill="#1F2937">
    <text x="28" y="80" font-family="Source Serif 4, Iowan Old Style, serif" font-size="20" font-weight="400">{% trans "Good morning, Olu" %}</text>
    <text x="28" y="100" font-size="12" fill="#6B7280">{% trans "Tuesday · 18 March" %}</text>
  </g>

  {# 4 KPI tiles — 2x2 grid #}
  <g font-family="Inter, system-ui, sans-serif">
    {# Tile 1 — Attendance #}
    <g transform="translate(28 124)">
      <rect width="220" height="84" rx="10" fill="#FAF7F2" stroke="#E5E1D8"/>
      <text x="16" y="26" font-size="10" font-weight="500" fill="#6B7280" letter-spacing="0.06em">{% trans "ATTENDANCE" %}</text>
      <text x="16" y="60" font-family="Source Serif 4, Iowan Old Style, serif" font-size="28" fill="#1F2937">94%</text>
      <text x="200" y="60" font-size="11" fill="#166534" text-anchor="end">▲ 2.1%</text>
      <text x="16" y="76" font-size="10" fill="#6B7280">{% trans "942 of 1,002 in by 9:00" %}</text>
    </g>

    {# Tile 2 — Outstanding fees #}
    <g transform="translate(272 124)">
      <rect width="220" height="84" rx="10" fill="#FAF7F2" stroke="#E5E1D8"/>
      <text x="16" y="26" font-size="10" font-weight="500" fill="#6B7280" letter-spacing="0.06em">{% trans "OUTSTANDING" %}</text>
      <text x="16" y="60" font-family="Source Serif 4, Iowan Old Style, serif" font-size="28" fill="#1F2937">£3,200</text>
      <text x="16" y="76" font-size="10" fill="#6B7280">{% trans "5 families · 7 days+" %}</text>
    </g>

    {# Tile 3 — Behaviour #}
    <g transform="translate(28 220)">
      <rect width="220" height="84" rx="10" fill="#FAF7F2" stroke="#E5E1D8"/>
      <text x="16" y="26" font-size="10" font-weight="500" fill="#6B7280" letter-spacing="0.06em">{% trans "INCIDENTS" %}</text>
      <text x="16" y="60" font-family="Source Serif 4, Iowan Old Style, serif" font-size="28" fill="#1F2937">3</text>
      <circle cx="62" cy="52" r="4" fill="#C2410C"/>
      <text x="16" y="76" font-size="10" fill="#6B7280">{% trans "1 needs review" %}</text>
    </g>

    {# Tile 4 — Staff in #}
    <g transform="translate(272 220)">
      <rect width="220" height="84" rx="10" fill="#FAF7F2" stroke="#E5E1D8"/>
      <text x="16" y="26" font-size="10" font-weight="500" fill="#6B7280" letter-spacing="0.06em">{% trans "STAFF SIGNED IN" %}</text>
      <text x="16" y="60" font-family="Source Serif 4, Iowan Old Style, serif" font-size="28" fill="#1F2937">42 / 45</text>
      <text x="16" y="76" font-size="10" fill="#6B7280">{% trans "3 absent · cover arranged" %}</text>
    </g>
  </g>

  {# Status footer #}
  <text x="28" y="324" font-family="Inter, system-ui, sans-serif" font-size="10" fill="#9CA3AF">{% trans "Updated quietly · 11 seconds ago" %}</text>
</svg>
