{% load i18n %}
{% comment %} Leader overview artifact — a school-at-a-glance dashboard. {% endcomment %}
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360" role="img" aria-labelledby="leader-overview-title">
  <title id="leader-overview-title">{% trans "School-leader overview showing today's attendance, fees, behavior incidents, and staffing for Cedar Ridge Academy" %}</title>

  <defs>
    <linearGradient id="window-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#FDFCF9"/>
    </linearGradient>
    <linearGradient id="header-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F5F1E8"/>
      <stop offset="100%" stop-color="#F2EDE4"/>
    </linearGradient>
    <linearGradient id="leader-accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#EA580C"/>
      <stop offset="100%" stop-color="#C2410C"/>
    </linearGradient>
    <filter id="leader-shadow" x="-2%" y="-2%" width="104%" height="106%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3"/>
      <feOffset dx="0" dy="2" result="o"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.05"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  {% comment %} Window frame {% endcomment %}
  <rect x="0" y="0" width="560" height="360" rx="16" fill="url(#window-grad)" stroke="#E5E1D8" stroke-width="1"/>

  {% comment %} Header bar {% endcomment %}
  <rect x="0" y="0" width="560" height="44" rx="16" fill="url(#header-grad)"/>
  <rect x="0" y="34" width="560" height="10" fill="url(#header-grad)"/>
  <line x1="0" y1="44" x2="560" y2="44" stroke="#E5E1D8"/>
  {% comment %} Window controls {% endcomment %}
  <g transform="translate(20 22)">
    <circle cx="0"  cy="0" r="5" fill="#F87171"/>
    <circle cx="14" cy="0" r="5" fill="#FBBF24"/>
    <circle cx="28" cy="0" r="5" fill="#34D399"/>
  </g>
  <text x="280" y="28" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="500" fill="#4B5563" text-anchor="middle">Cedar Ridge Academy · Today</text>

  {% comment %} Greeting row {% endcomment %}
  <g font-family="Inter, system-ui, sans-serif" fill="#1F2937">
    <text x="28" y="82" font-family="Source Serif 4, Iowan Old Style, serif" font-size="24" font-weight="500" letter-spacing="-0.015em">{% trans "Good morning, Olu" %}</text>
    <text x="28" y="104" font-size="12" fill="#6B7280">{% trans "Tuesday · 18 March · 942 of 1,002 students expected" %}</text>
  </g>

  {% comment %} Live indicator {% endcomment %}
  <g transform="translate(520 80)">
    <circle cx="0" cy="0" r="4" fill="#22C55E"/>
    <circle cx="0" cy="0" r="6" fill="none" stroke="#22C55E" stroke-opacity="0.3" stroke-width="2"/>
    <text x="-12" y="4" font-family="Inter, system-ui, sans-serif" font-size="10" font-weight="500" fill="#166534" text-anchor="end">LIVE</text>
  </g>

  {% comment %} KPI tiles — 4 in a row, refined {% endcomment %}
  <g font-family="Inter, system-ui, sans-serif">
    {% comment %} Tile 1 — Attendance with mini bar chart {% endcomment %}
    <g transform="translate(28 132)" filter="url(#leader-shadow)">
      <rect width="124" height="104" rx="12" fill="#FFFFFF" stroke="#E5E1D8"/>
      <text x="16" y="24" font-size="10" font-weight="600" fill="#6B7280" letter-spacing="0.06em">ATTENDANCE</text>
      <text x="16" y="56" font-family="Source Serif 4, Iowan Old Style, serif" font-size="28" font-weight="500" fill="#1F2937" letter-spacing="-0.02em">94%</text>
      <g transform="translate(74 38)" fill="#166534">
        <path d="M 0 8 L 4 0 L 8 4" fill="none" stroke="#166534" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
      </g>
      <text x="86" y="46" font-size="10" font-weight="500" fill="#166534">+2.1%</text>
      {% comment %} Mini sparkbars {% endcomment %}
      <g transform="translate(16 70)">
        <rect x="0"  y="14" width="8" height="6"  rx="1" fill="#E5E1D8"/>
        <rect x="12" y="10" width="8" height="10" rx="1" fill="#E5E1D8"/>
        <rect x="24" y="6"  width="8" height="14" rx="1" fill="#E5E1D8"/>
        <rect x="36" y="8"  width="8" height="12" rx="1" fill="#E5E1D8"/>
        <rect x="48" y="2"  width="8" height="18" rx="1" fill="#E5E1D8"/>
        <rect x="60" y="6"  width="8" height="14" rx="1" fill="#E5E1D8"/>
        <rect x="72" y="0"  width="8" height="20" rx="1" fill="#1F2937"/>
      </g>
    </g>

    {% comment %} Tile 2 — Outstanding fees {% endcomment %}
    <g transform="translate(164 132)" filter="url(#leader-shadow)">
      <rect width="124" height="104" rx="12" fill="#FFFFFF" stroke="#E5E1D8"/>
      <text x="16" y="24" font-size="10" font-weight="600" fill="#6B7280" letter-spacing="0.06em">OUTSTANDING</text>
      <text x="16" y="56" font-family="Source Serif 4, Iowan Old Style, serif" font-size="22" font-weight="500" fill="#1F2937" letter-spacing="-0.02em">£3,200</text>
      <text x="16" y="72" font-size="11" fill="#6B7280">{% trans "5 families · 7d+" %}</text>
      <g transform="translate(16 82)">
        <rect width="84" height="3" rx="1.5" fill="#E5E1D8"/>
        <rect width="32" height="3" rx="1.5" fill="url(#leader-accent)"/>
      </g>
      <text x="16" y="96" font-size="9" fill="#9CA3AF">{% trans "92% collected" %}</text>
    </g>

    {% comment %} Tile 3 — Incidents with severity dots {% endcomment %}
    <g transform="translate(300 132)" filter="url(#leader-shadow)">
      <rect width="124" height="104" rx="12" fill="#FFFFFF" stroke="#E5E1D8"/>
      <text x="16" y="24" font-size="10" font-weight="600" fill="#6B7280" letter-spacing="0.06em">INCIDENTS</text>
      <text x="16" y="56" font-family="Source Serif 4, Iowan Old Style, serif" font-size="28" font-weight="500" fill="#1F2937">3</text>
      <g transform="translate(58 42)">
        <circle cx="0"  cy="0" r="5" fill="#22C55E"/>
        <circle cx="12" cy="0" r="5" fill="#FBBF24"/>
        <circle cx="24" cy="0" r="5" fill="#C2410C"/>
      </g>
      <text x="16" y="80" font-size="11" fill="#6B7280">{% trans "1 needs leadership review" %}</text>
      <text x="16" y="94" font-size="10" font-weight="500" fill="#C2410C">{% trans "Open Year 9 case →" %}</text>
    </g>

    {% comment %} Tile 4 — Staff in {% endcomment %}
    <g transform="translate(436 132)" filter="url(#leader-shadow)">
      <rect width="96" height="104" rx="12" fill="#FFFFFF" stroke="#E5E1D8"/>
      <text x="12" y="24" font-size="10" font-weight="600" fill="#6B7280" letter-spacing="0.06em">STAFF IN</text>
      <text x="12" y="56" font-family="Source Serif 4, Iowan Old Style, serif" font-size="22" font-weight="500" fill="#1F2937" letter-spacing="-0.02em">42 / 45</text>
      <text x="12" y="74" font-size="10" fill="#6B7280">{% trans "3 absent" %}</text>
      <text x="12" y="88" font-size="10" font-weight="500" fill="#166534">{% trans "Cover sorted" %}</text>
    </g>
  </g>

  {% comment %} Bottom row — quick actions / day at a glance {% endcomment %}
  <g transform="translate(28 256)" font-family="Inter, system-ui, sans-serif" filter="url(#leader-shadow)">
    <rect width="504" height="80" rx="12" fill="#FAF7F2" stroke="#E5E1D8"/>
    <text x="20" y="22" font-size="10" font-weight="600" fill="#6B7280" letter-spacing="0.06em">UPCOMING TODAY</text>
    {% comment %} Three event chips {% endcomment %}
    <g transform="translate(20 36)">
      <rect width="146" height="32" rx="8" fill="#FFFFFF" stroke="#E5E1D8"/>
      <circle cx="14" cy="16" r="4" fill="#C2410C"/>
      <text x="26" y="14" font-size="10" fill="#9CA3AF">10:30 AM</text>
      <text x="26" y="28" font-size="11" font-weight="500" fill="#1F2937">{% trans "Leadership stand-up" %}</text>
    </g>
    <g transform="translate(178 36)">
      <rect width="146" height="32" rx="8" fill="#FFFFFF" stroke="#E5E1D8"/>
      <circle cx="14" cy="16" r="4" fill="#1F2937"/>
      <text x="26" y="14" font-size="10" fill="#9CA3AF">1:00 PM</text>
      <text x="26" y="28" font-size="11" font-weight="500" fill="#1F2937">{% trans "Y9 parent meeting" %}</text>
    </g>
    <g transform="translate(336 36)">
      <rect width="146" height="32" rx="8" fill="#FFFFFF" stroke="#E5E1D8"/>
      <circle cx="14" cy="16" r="4" fill="#6B7280"/>
      <text x="26" y="14" font-size="10" fill="#9CA3AF">3:30 PM</text>
      <text x="26" y="28" font-size="11" font-weight="500" fill="#1F2937">{% trans "Term 2 review" %}</text>
    </g>
  </g>
</svg>
