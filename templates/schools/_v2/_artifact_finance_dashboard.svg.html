{% load i18n %}
{# Finance dashboard artifact — fees this week. #}
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 340" role="img" aria-labelledby="finance-dashboard-title">
  <title id="finance-dashboard-title">{% trans "Finance team's view of fees this week, with one overdue account ready to nudge" %}</title>

  <rect x="0" y="0" width="520" height="340" rx="14" fill="#FFFFFF" stroke="#E5E1D8"/>

  {# Header #}
  <g>
    <rect x="0" y="0" width="520" height="44" rx="14" fill="#F2EDE4"/>
    <rect x="0" y="34" width="520" height="10" fill="#F2EDE4"/>
    <g transform="translate(20 22)" fill="#9CA3AF">
      <circle cx="0" cy="0" r="4"/>
      <circle cx="14" cy="0" r="4"/>
      <circle cx="28" cy="0" r="4"/>
    </g>
    <text x="260" y="27" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="500" fill="#4B5563" text-anchor="middle">{% trans "Fees · This week" %}</text>
  </g>

  {# Title #}
  <g font-family="Inter, system-ui, sans-serif" fill="#1F2937">
    <text x="28" y="80" font-family="Source Serif 4, Iowan Old Style, serif" font-size="20">{% trans "Where the term stands" %}</text>
    <text x="28" y="100" font-size="12" fill="#6B7280">{% trans "Mon 11 Mar – Sun 17 Mar" %}</text>
  </g>

  {# 3 KPI tiles #}
  <g font-family="Inter, system-ui, sans-serif">
    <g transform="translate(28 124)">
      <rect width="148" height="84" rx="10" fill="#FAF7F2" stroke="#E5E1D8"/>
      <text x="14" y="24" font-size="10" font-weight="500" fill="#6B7280" letter-spacing="0.06em">{% trans "COLLECTED" %}</text>
      <text x="14" y="58" font-family="Source Serif 4, Iowan Old Style, serif" font-size="22" fill="#1F2937">£12,450</text>
      <text x="134" y="58" font-size="10" fill="#166534" text-anchor="end">▲ 8%</text>
      <text x="14" y="74" font-size="10" fill="#6B7280">{% trans "vs. last week" %}</text>
    </g>

    <g transform="translate(186 124)">
      <rect width="148" height="84" rx="10" fill="#FAF7F2" stroke="#E5E1D8"/>
      <text x="14" y="24" font-size="10" font-weight="500" fill="#6B7280" letter-spacing="0.06em">{% trans "OUTSTANDING" %}</text>
      <text x="14" y="58" font-family="Source Serif 4, Iowan Old Style, serif" font-size="22" fill="#1F2937">£3,200</text>
      <text x="14" y="74" font-size="10" fill="#6B7280">{% trans "5 families · 7 days+" %}</text>
    </g>

    <g transform="translate(344 124)">
      <rect width="148" height="84" rx="10" fill="#FAF7F2" stroke="#E5E1D8"/>
      <text x="14" y="24" font-size="10" font-weight="500" fill="#6B7280" letter-spacing="0.06em">{% trans "PAID" %}</text>
      <text x="14" y="58" font-family="Source Serif 4, Iowan Old Style, serif" font-size="22" fill="#1F2937">87 / 92</text>
      {# progress bar #}
      <rect x="14" y="64" width="120" height="4" rx="2" fill="#E5E1D8"/>
      <rect x="14" y="64" width="113" height="4" rx="2" fill="#1F2937"/>
    </g>
  </g>

  {# Overdue row — primary action #}
  <g transform="translate(28 232)" font-family="Inter, system-ui, sans-serif">
    <rect width="464" height="68" rx="10" fill="#FAF7F2" stroke="#E5E1D8"/>
    <text x="20" y="24" font-size="10" font-weight="500" fill="#6B7280" letter-spacing="0.06em">{% trans "READY TO NUDGE" %}</text>
    <text x="20" y="48" font-size="13" font-weight="500" fill="#1F2937">{% trans "Aisha Khan · Year 5B" %}</text>
    <text x="20" y="62" font-size="11" fill="#4B5563">£445 · {% trans "7 days overdue · 2 reminders sent" %}</text>
    <rect x="346" y="20" width="100" height="28" rx="6" fill="#1F2937"/>
    <text x="396" y="38" font-size="11" font-weight="500" fill="#FAF7F2" text-anchor="middle">{% trans "Send reminder" %}</text>
  </g>

  <text x="28" y="324" font-family="Inter, system-ui, sans-serif" font-size="10" fill="#9CA3AF">{% trans "Reconciles to ledger · last sync 3 min ago" %}</text>
</svg>
