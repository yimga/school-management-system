# Architectural-boundary CI gate.
#
# Enforces the platform's bounded-context rules by AST-scanning for
# forbidden import patterns. Each scanner produces a JSON baseline; CI
# fails when a NEW violation is introduced.
#
# Update a baseline ONLY when you have intentionally removed a violation
# (and the diff in the PR makes that obvious) — never to silence a new one.

name: architectural-boundaries

on:
  # Direct pushes to the deploy branches would otherwise BYPASS these gates
  # entirely (branch protection is unavailable on this plan), so a violation
  # can silently land on main. Run on push with NO path filter so the boundary
  # scanners always execute on main — visibility is the enforcement here.
