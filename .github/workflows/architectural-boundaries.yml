  boundary-scanners-deps:
    name: Boundary scanners (12 gates, needs requirements)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install requirements once (was 12 separate installs)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run 12 dependency-backed boundary gates
        run: |
          set -uo pipefail
          failed=""
          passed=0

          # Each unit is one former job. `set -e` inside the subshell reproduces
          # step-aborts-on-failure WITHIN a job; the caller never aborts, so every unit
          # still runs and every failure is still reported -- which is what 108 separate
          # jobs bought, and the only property worth preserving from them.
          run_unit() {
            local fn="$1" label="$2"
            echo "::group::${label}"
            # NOT `if ( set -e; "$fn" )`. POSIX disables set -e inside anything used as an
            # if-condition, so that form runs a unit's REMAINING commands after one fails
            # and then reports PASS. Verified: a unit of `false; echo X` printed X and
            # passed. Run the subshell on its own line and read $? instead.
            ( set -e; "$fn" )
            rc=$?
            if [ "$rc" -eq 0 ]; then
              echo "PASS  ${label}"
              passed=$((passed + 1))
            else
              echo "::error title=${label}::boundary gate failed (exit ${rc})"
              failed="${failed}  - ${label}"$'\n'
            fi
            echo "::endgroup::"
          }

