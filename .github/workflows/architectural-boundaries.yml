        run: python scripts/audit_emotional_ux_signals.py

  rbac-matrix:
    name: RBAC matrix (candidate-anonymous gate)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run RBAC matrix scanner with baseline gate
        # v2.83: any NEW candidate-anonymous route (no @login_required,
        # @role_required, @permission_required, DRF permission_classes,
        # auth-enforcing mixin, inline is_authenticated check, or
        # `# rbac-allow:` marker detectable by AST) makes the gate fail.
        # Pin to the current count. If a new route is intentionally
        # public, add the right decorator; if it's protected by
        # middleware/RLS, add `# rbac-allow: <reason>` on the same line
        # as path(...). NEVER raise this number to silence the scanner.
        run: |
          python scripts/audit_role_permission_matrix.py --max-candidate-anonymous 0

