# Architectural-boundary CI gate.
#
# Enforces the platform's bounded-context rules by AST-scanning for
# forbidden import patterns. Each scanner produces a JSON baseline; CI
# fails when a NEW violation is introduced.
#
# Update a baseline ONLY when you have intentionally removed a violation
# (and the diff in the PR makes that obvious) — never to silence a new one.

name: architectural-boundaries

on:
  pull_request:
    paths:
      - "beta/school-management-system/apps/**/*.py"
      - "beta/school-management-system/services/**/*.py"
      - "beta/school-management-system/scripts/scan_ai_gateway_boundary.py"
      - "beta/school-management-system/scripts/scan_sentry_boundary.py"
      - "beta/school-management-system/scripts/scan_print_statements.py"
      - "beta/school-management-system/scripts/scan_bare_except.py"
      - "beta/school-management-system/scripts/scan_migration_model_imports.py"
      - "beta/school-management-system/scripts/scan_drf_schema_coverage.py"
      - "beta/school-management-system/scripts/scan_role_strings.py"
      - "beta/school-management-system/scripts/scan_assert_in_production.py"
      - "beta/school-management-system/scripts/scan_magic_numbers.py"
      - "beta/school-management-system/scripts/scan_subprocess_shell_true.py"
      - "beta/school-management-system/scripts/scan_rls_bypass.py"
      - "beta/school-management-system/scripts/scan_money_float.py"
      - "beta/school-management-system/scripts/scan_locale_coverage.py"
      - "beta/school-management-system/scripts/verify_service_worker_version.py"
      - "beta/school-management-system/scripts/verify_slo_registry.py"
      - "beta/school-management-system/scripts/scan_sri_required.py"
      - "beta/school-management-system/scripts/verify_csp_nonce_emission.py"
      - "beta/school-management-system/scripts/scan_pwa_manifest_coverage.py"
      - "beta/school-management-system/scripts/verify_sentry_alert_rule_drift.py"
      - "beta/school-management-system/scripts/audit_template_render_safety.py"
      - "beta/school-management-system/scripts/scan_inline_style_off_token.py"
      - "beta/school-management-system/scripts/scan_undefined_css_classes.py"
      - "beta/school-management-system/scripts/scan_off_token_colors.py"
      - "beta/school-management-system/scripts/scan_theme_locked_token_text.py"
      - "beta/school-management-system/var/security-audit-baseline-theme-locked-token-text.json"
      - "beta/school-management-system/scripts/scan_pii_logging_smell.py"
      - "beta/school-management-system/var/security-audit-baseline-pii-logging-smell.json"
      - "beta/school-management-system/scripts/scan_companion_canonical_headers_drift.py"
      - "beta/school-management-system/var/security-audit-baseline-canonical-headers-drift.json"
      - "beta/school-management-system/apps/migration_cloud/accelerators/runmycampus_canonical.py"
      - "beta/school-management-system/companion-tauri/src-tauri/src/canonical_headers.json"
      - "beta/school-management-system/companion-docker/app/canonical_headers.json"
      - "beta/school-management-system/templates/**/*.html"
      - "beta/school-management-system/static/css/**/*.css"
      - "beta/school-management-system/static/marketing/css/**/*.css"
      - "beta/school-management-system/var/security-audit-baseline-inline-style-off-token.json"
      - "beta/school-management-system/var/security-audit-baseline-undefined-css-classes.json"
      - "beta/school-management-system/var/security-audit-baseline-ai-gateway-boundary.json"
      - "beta/school-management-system/var/security-audit-baseline-sentry-boundary.json"
      - "beta/school-management-system/var/security-audit-baseline-print-statements.json"
      - "beta/school-management-system/var/security-audit-baseline-bare-except.json"
      - "beta/school-management-system/var/security-audit-baseline-migration-model-imports.json"
      - "beta/school-management-system/var/security-audit-baseline-drf-schema-coverage.json"
      - "beta/school-management-system/var/security-audit-baseline-role-strings.json"
      - "beta/school-management-system/var/security-audit-baseline-assert-in-production.json"
      - "beta/school-management-system/var/security-audit-baseline-magic-numbers.json"
      - "beta/school-management-system/var/security-audit-baseline-subprocess-shell.json"
      - "beta/school-management-system/var/security-audit-baseline-rls-bypass.json"
      - "beta/school-management-system/var/security-audit-baseline-money-float.json"
      - "beta/school-management-system/var/security-audit-baseline-locale-coverage.json"
      - "beta/school-management-system/var/security-audit-baseline-service-worker-version.json"
      - "beta/school-management-system/var/security-audit-baseline-sri-required.json"
      - "beta/school-management-system/var/security-audit-baseline-csp-nonce-emission.json"
      - "beta/school-management-system/var/security-audit-baseline-pwa-manifest-coverage.json"
      - "beta/school-management-system/static/js/service-worker.js"
      - "beta/school-management-system/apps/observability/slo.py"
      - "beta/school-management-system/locale/**/*.po"
      - "beta/school-management-system/apps/platform_runtime/management/commands/verify_platform_readiness.py"
      - "beta/school-management-system/apps/security/csp_readiness.py"
      - "beta/school-management-system/apps/analytics/at_risk_readiness.py"
      - "beta/school-management-system/apps/schools/residency_readiness.py"
      - "beta/school-management-system/apps/schools/rls_readiness.py"
      - "beta/school-management-system/scripts/check_documented_baselines.py"
      - "beta/school-management-system/scripts/audit_role_permission_matrix.py"
      - "beta/school-management-system/scripts/scan_bell_clock_consistency.py"
      - "beta/school-management-system/scripts/check_marketing_assets_claimed_vs_present.py"
      - "beta/school-management-system/scripts/verify_theme_visibility_platform.py"
      - "beta/school-management-system/scripts/verify_manager_admin_cp_layout.py"
      - "beta/school-management-system/scripts/scan_main_content_text_utilities.py"
      - "beta/school-management-system/var/security-audit-baseline-main-content-text-utilities.json"
      - "beta/school-management-system/static/css/theme-platform-contrast.css"
      - "beta/school-management-system/static/css/dark-mode-safety-net.css"
      - "beta/school-management-system/static/js/theme-preference-bootstrap.js"
      - "beta/school-management-system/apps/**/urls*.py"
      - ".github/workflows/architectural-boundaries.yml"
  workflow_dispatch: {}

defaults:
  run:
    working-directory: beta/school-management-system

jobs:
  ai-gateway-boundary:
    name: AI gateway import boundary
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run scanner --compare
        run: |
          python scripts/scan_ai_gateway_boundary.py --compare

  sentry-boundary:
    name: Sentry SDK import boundary
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run scanner --compare
        run: |
          python scripts/scan_sentry_boundary.py --compare

  print-statements:
    name: print() statement boundary
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run scanner --compare
        run: |
          python scripts/scan_print_statements.py --compare

  bare-except:
    name: "Bare except: clause boundary"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run scanner --compare
        run: |
          python scripts/scan_bare_except.py --compare

  migration-model-imports:
    name: Migration live-model-import boundary
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run scanner --compare
        run: |
          python scripts/scan_migration_model_imports.py --compare

  drf-schema-coverage:
    name: DRF view schema coverage
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run scanner --compare
        run: |
          python scripts/scan_drf_schema_coverage.py --compare

  role-strings:
    name: Hardcoded role-string boundary
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run scanner --compare
        run: |
          python scripts/scan_role_strings.py --compare

  assert-in-production:
    name: assert statements in production code
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run scanner --compare
        run: |
          python scripts/scan_assert_in_production.py --compare

  magic-numbers:
    name: Magic-number (>= 100) drift
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run scanner --compare
        run: |
          python scripts/scan_magic_numbers.py --compare

  subprocess-shell-true:
    name: "subprocess(..., shell=True) / os.system boundary"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run scanner --compare
        run: |
          python scripts/scan_subprocess_shell_true.py --compare

  rls-bypass:
    name: "RLS bypass (raw SQL / cursor.execute) boundary"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run scanner --compare
        run: |
          python scripts/scan_rls_bypass.py --compare

  money-float:
    name: "FinTech: float() on money paths (Decimal-only)"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run scanner --compare
        # P5 seven-pillar FinTech guardrail: prevents new Decimal->float
        # casts on amount/balance/fee/tax/etc. expressions in apps/finance,
        # apps/billing, apps/marketplace, payment/. Allowlist marker:
        #   # money-float-allow: <reason>
        run: |
          python scripts/scan_money_float.py --compare

  tenant-isolation-marker-quality:
    name: "P3: Tenant-isolation marker reason quality"
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run scanner --compare
        # Sister gate to scan_tenant_queryset_safety (count) and
        # verify_tenant_scoping_burndown (schedule). This one audits
        # the REASON STRING on each `# tenant-isolation-allow:` marker.
        # Flags: empty reasons, "TODO"/"FIXME"/"WIP", "fix later",
        # "see above", reasons <8 chars, single-token generic strings.
        # Baseline-pinned at 0 from day one (the 802 existing markers
        # all have plausibly-descriptive reasons).
        run: |
          python scripts/scan_tenant_isolation_marker_quality.py --compare

  dr-drill-schedule:
    name: "P12: DR restore drill cadence"
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run schedule verifier --strict
        # Reads var/dr-drill-schedule.json (cadence + next due date) and
        # docs/generated/dr_drill_log.json (history). Fails when today
        # is past the next-due date AND no in-window drill is recorded.
        # Pairs with scripts/restore_drill.py (the dry-run scaffold that
        # appends to the log).
        run: |
          python scripts/verify_dr_drill_schedule.py --strict

  locale-coverage:
    name: "i18n: per-locale msgstr coverage (drift detection)"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run scanner --compare
        # P11 seven-pillar i18n guardrail: per-locale translated/total
        # ratio is baselined; a locale that USED to have translations
        # cannot regress to zero without CI flagging it.
        run: |
          python scripts/scan_locale_coverage.py --compare

  service-worker-version:
    name: "PWA: service-worker CACHE_VERSION shape + monotonicity"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run verifier --check-monotonic
        # P9 seven-pillar mobile/offline guardrail: every wave bumps
        # CACHE_VERSION per CLAUDE.md deploy checklist. Shape must match
        # sms-vMAJOR.MINOR.PATCH[-slug]-YYYY-MM-DD and (MAJOR,MINOR,PATCH)
        # must be >= baseline.
        run: |
          python scripts/verify_service_worker_version.py --check-monotonic

  slo-registry:
    name: "SRE: SLO registry structural integrity"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run verifier --strict
        # P10 seven-pillar observability guardrail: apps/observability/slo.py
        # SLODefinition tuple must have unique keys, valid kinds, sane
        # targets, and threshold_ms only on latency SLOs.
        run: |
          python scripts/verify_slo_registry.py --strict

  sri-required:
    name: "P1: Subresource Integrity required on third-party HTTPS assets"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run scanner --compare
        run: |
          python scripts/scan_sri_required.py --compare

  csp-nonce-emission:
    name: "P1: CSP nonce emission across shells"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run verifier --compare
        run: |
          python scripts/verify_csp_nonce_emission.py --compare

  pwa-manifest-coverage:
    name: "P9: PWA manifest coverage across dashboard shells"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run scanner --compare
        run: |
          python scripts/scan_pwa_manifest_coverage.py --compare

  plan-deliverables-12-pillar:
    name: "12-pillar plan deliverables (all P0-P12 artifacts present)"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run 12-pillar deliverables verifier --strict
        run: |
          python scripts/verify_plan_deliverables_12_pillar.py --strict

  ai-engine-room:
    name: "AI engine room completeness (tiers 1-5)"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: beta/school-management-system
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: verify_ai_engine_room
        run: python scripts/verify_ai_engine_room.py

  reveal-armed-invariants:
    name: "Reveal-armed defense + no-duplicate-class-attrs invariants"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run reveal-armed invariants scanner --strict
        run: |
          python scripts/scan_reveal_armed_invariants.py --strict

  theme-attribute-contract:
    name: "Theme attribute contract (data-theme = effective, never preference)"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run theme-attribute-contract scanner --strict
        run: |
          python scripts/scan_theme_attribute_contract.py --strict

  pii-logging-smell:
    name: "PII logging smell (passwords/tokens/secrets interpolated into logger calls)"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run pii-logging-smell scanner --strict
        run: |
          python scripts/scan_pii_logging_smell.py --strict

  canonical-headers-drift:
    name: "Companion canonical_headers.json drift vs Django SOT"
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run canonical-headers drift scanner --strict
        # v3.39.0 Agent 3 introduction (2026-05-19). Sister gate to the
        # v3.38.0 per-vendor CSV pre-processors. Asserts the
        # `DOMAIN_CANONICAL_HEADERS` dict in
        # apps/migration_cloud/accelerators/runmycampus_canonical.py is
        # mirrored byte-for-byte (order-sensitive) into both
        # companion-tauri/src-tauri/src/canonical_headers.json AND
        # companion-docker/app/canonical_headers.json. Drift = silently
        # wrong canonical mappings client-side. Stdlib-only; no Django
        # boot required.
        run: |
          python scripts/scan_companion_canonical_headers_drift.py --strict

  sentry-alert-rule-drift:
    name: "P6: Sentry alert-rule drift (rules-as-code vs snapshot)"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Django runtime
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run drift detector --strict
        # Soft-passes when snapshot is missing (operator runs the export
        # asynchronously). Hard-fails on any drift between two present sets.
        run: |
          python scripts/verify_sentry_alert_rule_drift.py --strict

  template-render-safety:
    name: "Template render-safety (leaks / unclosed tags / missing refs)"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run scanner --compare
        # Zero-tolerance gate: any of these is a real bug.
        #   - multi-line `{# ... #}` (Django supports single-line only)
        #   - orphan template tokens that would render as visible page text
        #   - unbalanced {% if/for/block/with/comment/verbatim/... %} tags
        #   - {% include %} / {% extends %} pointing to a missing template
        #   - {% static %} pointing to a missing file under static/
        run: |
          python scripts/audit_template_render_safety.py --compare

  inline-style-off-token:
    name: "Apple HIG: inline styles off the token system"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run scanner --compare
        # Drift-detection gate. Inline `style="font-size:..."` /
        # `style="color: #..."` / `style="transition: ... cubic-bezier(...)"`
        # bypass the token system, defeat tenant brand cascade, and break
        # Apple-tier quiet-luxury consistency. Baseline allows existing debt;
        # CI fails on any new violation. Mark intentional exceptions with
        # `<!-- inline-style-allow: <reason> -->` or `inline-style-allow:`
        # inside the style itself.
        run: |
          python scripts/scan_inline_style_off_token.py --compare

  off-token-colors:
    name: "Off-token color literals in CSS (theme switching safety)"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run scanner --strict
        # Drift-detection gate: a color/background/border declaration in
        # static/css or static/marketing/css that contains a hex / rgb / rgba
        # literal AND sits outside a theme block (:root, [data-theme=...],
        # [data-bs-theme=...], [data-rmc-aesthetic=...], @media prefers-color-scheme)
        # cannot adapt across the light/dark/system theme cascade. This is
        # the root cause of "elements invisible in dark mode" bugs.
        # Mark intentional literals with /* off-token-allow: <reason> */ on
        # the declaration. Baseline allows existing debt; CI fails on any
        # NEW violation while the burndown wave reduces the existing 897.
        run: |
          python scripts/scan_off_token_colors.py --strict

  theme-locked-token-text:
    name: "Theme-locked token references in CSS (subtle invisibility bugs)"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run scanner --strict
        # Companion to off-token-colors. That scanner catches raw hex literals;
        # this one catches the more subtle bug where the literal hides behind a
        # token reference (var(--color-base-900) etc.) that's defined once in
        # :root and never theme-overridden — same dark-on-dark / light-on-light
        # bug class. Drift-detection: baseline allows existing debt, CI fails
        # on any NEW occurrence. Mark intentional sites with
        # /* theme-locked-allow: <reason> */ on the declaration line.
        run: |
          python scripts/scan_theme_locked_token_text.py --strict

  undefined-css-classes:
    name: "Undefined CSS classes (typos & silent layout bugs)"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run scanner --compare
        # Drift-detection gate. Catches project-prefixed CSS class names
        # referenced in templates but never defined in any CSS file —
        # the class of bug that hid `content-max-960` (referenced 25x,
        # never defined → silent empty-column on every manager page).
        # Scans both `static/css/` and `static/marketing/css/` for definitions.
        # Tailwind / Bootstrap / icon-font utilities are allowlisted; only
        # project-prefixed classes (rmc-, cp-, mkt-, portal-, ccc-, etc.)
        # are flagged. Baseline allows existing debt; CI fails on any new
        # undefined class.
        run: |
          python scripts/scan_undefined_css_classes.py --compare

  real-migration-drift:
    name: "Real migration drift (cosmetic F2 drift filtered)"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install runtime dependencies
        # Required for manage.py makemigrations --dry-run inside the helper.
        working-directory: beta/school-management-system
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
      - name: Detect real schema drift
        # Wave L (v2.48+L1b): `manage.py makemigrations --check` is
        # noisy after F2's callable inlining (v2.47), reporting ~38
        # cosmetic AlterField ops on every run. This wrapper filters
        # those out and exits 1 only when a REAL schema change has
        # slipped past the migration graph. Without this, operators
        # can't tell ambient drift from genuine forgotten migrations.
        run: |
          python scripts/check_real_migration_drift.py

  settings-registry-strict:
    name: Settings registry coverage (strict)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
      - name: verify_settings_registry_coverage --strict
        run: python scripts/verify_settings_registry_coverage.py --strict

  documented-baselines:
    name: "Documented baselines (CLAUDE.md vs var/*.json drift)"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Detect doc-vs-baseline drift
        # Wave N (v2.53+). Every scanner has three numbers that should
        # agree: CLAUDE.md table, var/security-audit-baseline-*.json,
        # and live scanner output. CI already catches #2 vs #3 on every
        # PR; this gate catches #1 vs #2 — the L1a failure mode where
        # the JSON moved but the doc didn't.
        run: |
          python scripts/check_documented_baselines.py

  platform-readiness:
    name: "Platform readiness preflight (csp / at_risk / baselines)"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DEBUG: "0"
      SECRET_KEY: "ci-platform-readiness-not-for-production-use-64chars______________________"
      ALLOWED_HOSTS: "localhost,127.0.0.1,testserver,runmycampus.com,.runmycampus.com"
      MULTI_TENANT_BASE_DOMAIN: runmycampus.com
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install runtime dependencies
        # verify_platform_readiness boots Django to import the readiness
        # modules. residency / rls are intentionally skipped here — they
        # need a populated tenants DB and run in operator pre-deploy
        # workflows (see docs/PLATFORM_READINESS_PREFLIGHTS.md).
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run readiness preflight (csp + at_risk + baselines)
        # Tier 1 gap closure (v2.60). The N1 preflight was previously
        # manual-only; this CI gate ensures the same release-blocker
        # criteria the operator runs pre-deploy are evaluated on every
        # PR. Exit codes: 0 ready / 1 not-ready / 2 invocation error.
        run: |
          python manage.py verify_platform_readiness \
            --settings=config.settings \
            --section csp at_risk baselines

  emotional-ux-signals:
    name: Emotional UX signals (ratchet-only)
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run emotional UX scanner with ratchet baseline
        # v2.86: heuristic proxies for bad emotional UX (hostile error copy,
        # naked exception leakage, alarming numbers without context, hostile
        # empty states, imperative tone without reason). Ratchet-only:
        # baseline pinned in var/security-audit-baseline-emotional-ux.json.
        # Mark intentional sites with `<!-- ux-allow: <reason> -->`. Lower
        # the baseline as you fix; NEVER raise it to silence the scanner.
        run: python scripts/audit_emotional_ux_signals.py

  rbac-matrix:
    name: RBAC matrix (candidate-anonymous gate)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run RBAC matrix scanner with baseline gate
        # v2.83: any NEW candidate-anonymous route (no @login_required,
        # @role_required, @permission_required, DRF permission_classes,
        # auth-enforcing mixin, inline is_authenticated check, or
        # `# rbac-allow:` marker detectable by AST) makes the gate fail.
        # Pin to the current count. If a new route is intentionally
        # public, add the right decorator; if it's protected by
        # middleware/RLS, add `# rbac-allow: <reason>` on the same line
        # as path(...). NEVER raise this number to silence the scanner.
        run: |
          python scripts/audit_role_permission_matrix.py --max-candidate-anonymous 0

