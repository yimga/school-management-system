defaults:
  run:
    working-directory: .

jobs:
  # These two jobs were 108 separate jobs until 2026-08-23. Actions bills per
  # JOB rounded up to the minute, so 108 scanners taking 1-6s each cost >=108
  # billable minutes per push -- essentially all of it VM boot, checkout and
  # setup-python, repeated 108 times. That is what exhausted the allowance.
  #
  # Nothing stopped being checked: every former job is a unit below, its
  # commands verbatim, and a unit failure fails the job. The split is only
  # whether the job needed `pip install -r requirements.txt`, so the 12 that
  # did now share ONE install instead of paying for twelve.
  boundary-scanners:
    name: Boundary scanners (97 gates, stdlib only)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Run 96 stdlib boundary gates
        run: |
          set -uo pipefail
          failed=""
          passed=0

          # Each unit is one former job. `set -e` inside the subshell reproduces
          # step-aborts-on-failure WITHIN a job; the caller never aborts, so every unit
          # still runs and every failure is still reported -- which is what 108 separate
          # jobs bought, and the only property worth preserving from them.
          run_unit() {
            local fn="$1" label="$2"
            echo "::group::${label}"
            # NOT `if ( set -e; "$fn" )`. POSIX disables set -e inside anything used as an
            # if-condition, so that form runs a unit's REMAINING commands after one fails
            # and then reports PASS. Verified: a unit of `false; echo X` printed X and
            # passed. Run the subshell on its own line and read $? instead.
            ( set -e; "$fn" )
            rc=$?
            if [ "$rc" -eq 0 ]; then
              echo "PASS  ${label}"
              passed=$((passed + 1))
            else
              echo "::error title=${label}::boundary gate failed (exit ${rc})"
              failed="${failed}  - ${label}"$'\n'
            fi
            echo "::endgroup::"
          }

          u_ai_gateway_boundary() {
            python scripts/scan_ai_gateway_boundary.py --compare
