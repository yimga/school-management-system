  documented-baselines:
    name: "Documented baselines (CLAUDE.md vs var/*.json drift)"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Detect doc-vs-baseline drift
        # Wave N (v2.53+). Every scanner has three numbers that should
        # agree: CLAUDE.md table, var/security-audit-baseline-*.json,
        # and live scanner output. CI already catches #2 vs #3 on every
        # PR; this gate catches #1 vs #2 — the L1a failure mode where
        # the JSON moved but the doc didn't.
        run: |
          python scripts/check_documented_baselines.py
      - name: Verify CI gate wiring
        # Meta-gate: assert every critical gate (the reference-integrity
        # family + key zero-tolerance scanners) is still invoked in a
        # workflow, so an unrelated workflow edit can never silently
        # un-enforce a gate (the url-name-step-dropped regression).
        run: |
          python scripts/verify_ci_gate_wiring.py

  platform-readiness:
    name: "Platform readiness preflight (csp / at_risk / baselines)"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DEBUG: "0"
      SECRET_KEY: "ci-platform-readiness-not-for-production-use-64chars______________________"
      ALLOWED_HOSTS: "localhost,127.0.0.1,testserver,runmycampus.com,.runmycampus.com"
      MULTI_TENANT_BASE_DOMAIN: runmycampus.com
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install runtime dependencies
        # verify_platform_readiness boots Django to import the readiness
        # modules. residency / rls are intentionally skipped here — they
        # need a populated tenants DB and run in operator pre-deploy
        # workflows (see docs/PLATFORM_READINESS_PREFLIGHTS.md).
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run readiness preflight (csp + at_risk + baselines)
        # Tier 1 gap closure (v2.60). The N1 preflight was previously
        # manual-only; this CI gate ensures the same release-blocker
        # criteria the operator runs pre-deploy are evaluated on every
        # PR. Exit codes: 0 ready / 1 not-ready / 2 invocation error.
        run: |
          python manage.py verify_platform_readiness \
            --settings=config.settings \
            --section csp at_risk baselines

