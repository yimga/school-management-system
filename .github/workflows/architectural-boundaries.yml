# Architectural-boundary CI gate.
#
# Enforces the platform's bounded-context rules by AST-scanning for
# forbidden import patterns. Each scanner produces a JSON baseline; CI
# fails when a NEW violation is introduced.
#
# Update a baseline ONLY when you have intentionally removed a violation
# (and the diff in the PR makes that obvious) — never to silence a new one.

name: architectural-boundaries

on:
  pull_request:
    paths:
      - "beta/school-management-system/apps/**/*.py"
      - "beta/school-management-system/services/**/*.py"
      - "beta/school-management-system/scripts/scan_ai_gateway_boundary.py"
      - "beta/school-management-system/scripts/scan_sentry_boundary.py"
      - "beta/school-management-system/scripts/scan_print_statements.py"
      - "beta/school-management-system/scripts/scan_bare_except.py"
      - "beta/school-management-system/scripts/scan_migration_model_imports.py"
      - "beta/school-management-system/scripts/scan_drf_schema_coverage.py"
      - "beta/school-management-system/scripts/scan_role_strings.py"
      - "beta/school-management-system/scripts/scan_assert_in_production.py"
      - "beta/school-management-system/scripts/scan_magic_numbers.py"
      - "beta/school-management-system/scripts/scan_subprocess_shell_true.py"
      - "beta/school-management-system/scripts/scan_rls_bypass.py"
      - "beta/school-management-system/scripts/audit_template_render_safety.py"
      - "beta/school-management-system/scripts/scan_inline_style_off_token.py"
      - "beta/school-management-system/scripts/scan_undefined_css_classes.py"
      - "beta/school-management-system/templates/**/*.html"
      - "beta/school-management-system/static/css/**/*.css"
      - "beta/school-management-system/static/marketing/css/**/*.css"
      - "beta/school-management-system/var/security-audit-baseline-inline-style-off-token.json"
      - "beta/school-management-system/var/security-audit-baseline-undefined-css-classes.json"
      - "beta/school-management-system/var/security-audit-baseline-ai-gateway-boundary.json"
      - "beta/school-management-system/var/security-audit-baseline-sentry-boundary.json"
      - "beta/school-management-system/var/security-audit-baseline-print-statements.json"
      - "beta/school-management-system/var/security-audit-baseline-bare-except.json"
      - "beta/school-management-system/var/security-audit-baseline-migration-model-imports.json"
      - "beta/school-management-system/var/security-audit-baseline-drf-schema-coverage.json"
      - "beta/school-management-system/var/security-audit-baseline-role-strings.json"
      - "beta/school-management-system/var/security-audit-baseline-assert-in-production.json"
      - "beta/school-management-system/var/security-audit-baseline-magic-numbers.json"
      - "beta/school-management-system/var/security-audit-baseline-subprocess-shell.json"
      - "beta/school-management-system/var/security-audit-baseline-rls-bypass.json"
      - ".github/workflows/architectural-boundaries.yml"
  workflow_dispatch: {}

defaults:
  run:
    working-directory: beta/school-management-system

jobs:
  ai-gateway-boundary:
    name: AI gateway import boundary
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run scanner --compare
        run: |
          python scripts/scan_ai_gateway_boundary.py --compare

  sentry-boundary:
    name: Sentry SDK import boundary
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run scanner --compare
        run: |
          python scripts/scan_sentry_boundary.py --compare

  print-statements:
    name: print() statement boundary
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run scanner --compare
        run: |
          python scripts/scan_print_statements.py --compare

  bare-except:
    name: "Bare except: clause boundary"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run scanner --compare
        run: |
          python scripts/scan_bare_except.py --compare

  migration-model-imports:
    name: Migration live-model-import boundary
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run scanner --compare
        run: |
          python scripts/scan_migration_model_imports.py --compare

  drf-schema-coverage:
    name: DRF view schema coverage
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run scanner --compare
        run: |
          python scripts/scan_drf_schema_coverage.py --compare

  role-strings:
    name: Hardcoded role-string boundary
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run scanner --compare
        run: |
          python scripts/scan_role_strings.py --compare

  assert-in-production:
    name: assert statements in production code
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run scanner --compare
        run: |
          python scripts/scan_assert_in_production.py --compare

  magic-numbers:
    name: Magic-number (>= 100) drift
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run scanner --compare
        run: |
          python scripts/scan_magic_numbers.py --compare

  subprocess-shell-true:
    name: "subprocess(..., shell=True) / os.system boundary"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run scanner --compare
        run: |
          python scripts/scan_subprocess_shell_true.py --compare

  rls-bypass:
    name: "RLS bypass (raw SQL / cursor.execute) boundary"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run scanner --compare
        run: |
          python scripts/scan_rls_bypass.py --compare

  template-render-safety:
    name: "Template render-safety (leaks / unclosed tags / missing refs)"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run scanner --compare
        # Zero-tolerance gate: any of these is a real bug.
        #   - multi-line `{# ... #}` (Django supports single-line only)
        #   - orphan template tokens that would render as visible page text
        #   - unbalanced {% if/for/block/with/comment/verbatim/... %} tags
        #   - {% include %} / {% extends %} pointing to a missing template
        #   - {% static %} pointing to a missing file under static/
        run: |
          python scripts/audit_template_render_safety.py --compare

  inline-style-off-token:
    name: "Apple HIG: inline styles off the token system"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run scanner --compare
        # Drift-detection gate. Inline `style="font-size:..."` /
        # `style="color: #..."` / `style="transition: ... cubic-bezier(...)"`
        # bypass the token system, defeat tenant brand cascade, and break
        # Apple-tier quiet-luxury consistency. Baseline allows existing debt;
        # CI fails on any new violation. Mark intentional exceptions with
        # `<!-- inline-style-allow: <reason> -->` or `inline-style-allow:`
        # inside the style itself.
        run: |
          python scripts/scan_inline_style_off_token.py --compare

  undefined-css-classes:
    name: "Undefined CSS classes (typos & silent layout bugs)"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run scanner --compare
        # Drift-detection gate. Catches project-prefixed CSS class names
        # referenced in templates but never defined in any CSS file —
        # the class of bug that hid `content-max-960` (referenced 25x,
        # never defined → silent empty-column on every manager page).
        # Scans both `static/css/` and `static/marketing/css/` for definitions.
        # Tailwind / Bootstrap / icon-font utilities are allowlisted; only
        # project-prefixed classes (rmc-, cp-, mkt-, portal-, ccc-, etc.)
        # are flagged. Baseline allows existing debt; CI fails on any new
        # undefined class.
        run: |
          python scripts/scan_undefined_css_classes.py --compare

  real-migration-drift:
    name: "Real migration drift (cosmetic F2 drift filtered)"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install runtime dependencies
        # Required for manage.py makemigrations --dry-run inside the helper.
        working-directory: beta/school-management-system
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
      - name: Detect real schema drift
        # Wave L (v2.48+L1b): `manage.py makemigrations --check` is
        # noisy after F2's callable inlining (v2.47), reporting ~38
        # cosmetic AlterField ops on every run. This wrapper filters
        # those out and exits 1 only when a REAL schema change has
        # slipped past the migration graph. Without this, operators
        # can't tell ambient drift from genuine forgotten migrations.
        run: |
          python scripts/check_real_migration_drift.py

  documented-baselines:
    name: "Documented baselines (CLAUDE.md vs var/*.json drift)"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Detect doc-vs-baseline drift
        # Wave N (v2.53+). Every scanner has three numbers that should
        # agree: CLAUDE.md table, var/security-audit-baseline-*.json,
        # and live scanner output. CI already catches #2 vs #3 on every
        # PR; this gate catches #1 vs #2 — the L1a failure mode where
        # the JSON moved but the doc didn't.
        run: |
          python scripts/check_documented_baselines.py
