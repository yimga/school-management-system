name: Marketing visual truth

on:
  workflow_dispatch: {}
  pull_request:
    branches: [main]
    paths:
      - "templates/marketing/**"
      - "templates/schools/marketing_landing_v2.html"
      - "templates/schools/marketing_page_layout.html"
      - "templates/marketing/pages/**"
      - "apps/schools/marketing_views.py"
      - "apps/schools/marketing_v3_surfaces.py"
      - "static/marketing/**"
      - "tests/e2e/marketing-visual-truth.spec.js"
      - "scripts/run_marketing_visual_truth.sh"
      - ".github/workflows/marketing-visual-truth.yml"
      - "config/public_urls.py"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  marketing-visual-truth:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      SECRET_KEY: "ci-marketing-visual-truth-not-production-64chars______________"
      ALLOWED_HOSTS: "127.0.0.1,localhost,testserver,runmycampus.com,.runmycampus.com"
      VISUAL_QA_PORT: "8010"

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          npm ci

      - name: Install Playwright Chromium
        run: node node_modules/playwright/cli.js install --with-deps chromium

      - name: Migrate and seed admin
        run: |
          python manage.py migrate --noinput
          python manage.py ensure_superuser --password VisualQaPass123! --no-input || true

      - name: Axe CI readiness
        run: python scripts/verify_marketing_axe_ci_ready.py

      - name: Marketing visual truth Playwright (axe enabled)
        env:
          SKIP_AXE: "0"
        run: bash scripts/run_marketing_visual_truth.sh

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: marketing-visual-truth-artifacts
          path: |
            artifacts/marketing-visual-truth
            test-results
          if-no-files-found: ignore
