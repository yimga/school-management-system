# Smoke test: pre-deploy gate (check, migrations, smoke URLs, theme matrix, phase checks).
# Runs on push/PR to main so merges are validated.
# Manual run: GitHub → Actions → "Smoke test" → Run workflow (workflow_dispatch).
name: Smoke test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

# Added 2026-08-31. Without a concurrency group a superseded run bills in
# full, and this repo takes hundreds of commits a week. Cancelling an
# obsolete run removes no enforcement -- the tip of the branch still runs
# every job. Same group/cancel pair peers already use in
# django-tests-postgres.yml and tenants-rls.yml.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          npm ci

      - name: Install Playwright Chromium
        run: |
          node node_modules/playwright/cli.js install --with-deps chromium

      - name: Dependency vulnerability check (pip-audit)
        run: |
          pip install pip-audit
          pip-audit --desc

      - name: SAST (bandit — high severity must be 0)
        run: |
          pip install "bandit[toml]"
          python -m bandit -r apps config -lll -q \
            --exclude '*/tests/*' \
            --exclude '*/migrations/*' \
            -f custom --msg-template '{relpath}:{line}: {test_id}' \
            || { echo "::error::Bandit reported HIGH severity findings"; exit 1; }
          echo "Bandit HIGH severity: 0"

      - name: Django check --deploy (production settings sanity)
        env:
          DEBUG: "0"
          SECRET_KEY: "ci-check-deploy-not-for-production-use-64chars________________________________"
          ALLOWED_HOSTS: "localhost,127.0.0.1,testserver"
        run: python manage.py check --deploy

      - name: Generate SBOM (Software Bill of Materials)
        run: |
          pip install cyclonedx-bom
          cyclonedx-py requirements requirements.txt -o sbom.json

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom.json
          retention-days: 1

      - name: Pre-deploy gate (check, migrations, smoke, theme matrix, phase checks)
        # PR budget raised 30->50: the full gate now runs end-to-end on PRs
        # (~12 min just for migrate_gate_test_db on the full migration set, then
        # the Phase 3 portal crawl + UX/i18n suites). main keeps 55 for its
        # extra post-merge backlog-unlock evaluation.
        timeout-minutes: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && 55 || 50 }}
        env:
          DEBUG: "0"
          # DEBUG=0 puts settings in production mode, which requires SECRET_KEY at
          # import; the gate runs `manage.py check`, so it must be set (mirrors the
          # Django check --deploy step above). CI-only placeholder, never prod.
          SECRET_KEY: "ci-pre-deploy-gate-not-for-production-use-64chars_______________________"
          LOG_LEVEL: WARNING
          # After a green main merge, refresh backlog unlock snapshot + transition events (shared cache in prod when gate runs there).
          RUN_BACKLOG_UNLOCK_EVAL: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && '1' || '0' }}
        run: bash scripts/pre_deploy_gate.sh

      - name: World Engine i18n CI (catalog freshness + compile)
        run: python scripts/verify_world_engine_i18n_ci.py

      - name: Upload visual QA artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-qa-artifacts
          path: |
            artifacts/visual-qa
            test-results
            playwright-report
          if-no-files-found: ignore
          retention-days: 1
