# Smoke test: URL resolution only, no database required.
# Runs on push/PR to main so merges are validated.
name: Smoke test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Smoke test (URL resolution, no DB)
        run: python manage.py test apps.accounts.tests.test_smoke_urls -v 1

      - name: Theme stress matrix (templates + token CSS)
        run: python manage.py test apps.siteconfig.tests.test_theme_visibility_matrix -v 1
