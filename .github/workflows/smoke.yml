# Smoke test: pre-deploy gate (check, migrations, smoke URLs, theme matrix, phase checks).
# Runs on push/PR to main so merges are validated.
# Manual run: GitHub → Actions → "Smoke test" → Run workflow (workflow_dispatch).
name: Smoke test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          npm ci

      - name: Install Playwright Chromium
        run: |
          node node_modules/playwright/cli.js install --with-deps chromium

      - name: Dependency vulnerability check (pip-audit)
        run: |
          pip install pip-audit
          pip-audit --desc

      - name: SAST (bandit — high-severity informational)
        continue-on-error: true
        run: |
          pip install "bandit[toml]"
          python -m bandit -r apps config -lll -q \
            --exclude '*/tests/*' \
            --exclude '*/migrations/*' || true

      - name: Django check --deploy (production settings sanity)
        env:
          DEBUG: "0"
          SECRET_KEY: "ci-check-deploy-not-for-production-use-64chars________________________________"
          ALLOWED_HOSTS: "localhost,127.0.0.1,testserver"
        run: python manage.py check --deploy

      - name: Generate SBOM (Software Bill of Materials)
        run: |
          pip install cyclonedx-bom
          cyclonedx-py requirements requirements.txt -o sbom.json

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom.json
          retention-days: 90

      - name: Pre-deploy gate (check, migrations, smoke, theme matrix, phase checks)
        timeout-minutes: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && 55 || 30 }}
        env:
          DEBUG: "0"
          LOG_LEVEL: WARNING
          # After a green main merge, refresh backlog unlock snapshot + transition events (shared cache in prod when gate runs there).
          RUN_BACKLOG_UNLOCK_EVAL: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && '1' || '0' }}
        run: bash scripts/pre_deploy_gate.sh

      - name: i18n (makemessages + compilemessages)
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq gettext > /dev/null 2>&1 || true
          if command -v xgettext > /dev/null 2>&1; then
            python manage.py makemessages -l en -a --no-obsolete --no-wrap 2>/dev/null || true
            python manage.py compilemessages 2>/dev/null || true
          fi

      - name: Upload visual QA artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-qa-artifacts
          path: |
            artifacts/visual-qa
            test-results
            playwright-report
          if-no-files-found: ignore
          retention-days: 14
