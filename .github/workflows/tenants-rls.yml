# Single-schema RLS isolation gate: spins up Postgres, applies RLS policy migrations,
# and runs the @tag("tenants_rls") Django test suite.
#
# Why this workflow exists:
# - django-tests.yml uses SQLite, so RLS-tagged tests are skipped (skipIf vendor != postgresql).
# - playwright-tenant-postgres.yml uses USE_DJANGO_TENANTS=1 (schema mode), which the
#   tenants_rls tests explicitly override to False — so they skip there too.
# - Without this gate, the RLS default-deny policies are never exercised in CI.
#
# Local parity (Docker, same DB name as CI):
#   docker run -d --rm --name pg-tenants-rls -e POSTGRES_PASSWORD=postgres \
#     -e POSTGRES_DB=ci_tenants_rls -p 5432:5432 postgres:15
#   export SECRET_KEY=local-dev-only-not-for-production-64chars_____________________
#   export DATABASE_URL=postgresql://postgres:postgres@127.0.0.1:5432/ci_tenants_rls
#   export USE_DJANGO_TENANTS=0
#   python manage.py migrate --noinput
#   python manage.py test --tag=tenants_rls --settings=config.settings --noinput
name: Tenants RLS (Postgres)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    paths:
      - "apps/tenancy/**"
      - "apps/schools/rls.py"
      - "apps/schools/rls_context.py"
      - "apps/schools/models.py"
      - "apps/schools/middleware.py"
      - "apps/schools/tests/test_tenant_isolation_rls_mode.py"
      - "apps/*/migrations/**rls**.py"
      - "apps/schoolops/migrations/**"
      - "apps/schoolops/tests/test_resource_booking.py"
      - "apps/schoolops/tests/test_inventory_movement.py"
      - "apps/schoolops/migrations/0032_*.py"
      - "apps/schoolops/migrations/0033_*.py"
      - "config/settings.py"
      - ".github/workflows/tenants-rls.yml"
      - "requirements.txt"
  workflow_dispatch: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  tenants-rls:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: pgvector/pgvector:pg15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ci_tenants_rls
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d ci_tenants_rls"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      PGCONNECT_TIMEOUT: "15"
      SECRET_KEY: "ci-tenants-rls-not-for-production-64chars________________________________"
      # Connect as a NON-superuser, NON-BYPASSRLS role. Postgres superusers (and
      # the default `postgres` service user) bypass RLS unconditionally, so the
      # default-deny / scoped-visibility tests can only be validated as rls_app.
      # The role is provisioned in the step below.
      DATABASE_URL: postgresql://rls_app:rls_app@127.0.0.1:5432/ci_tenants_rls
      USE_DJANGO_TENANTS: "0"
      # DEBUG=1 only so settings computes ssl_require=not DEBUG=False at import time:
      # the CI postgres:15 service offers no SSL, but ssl_require=True forces
      # sslmode=require and fails the connection. Django's test runner forces
      # settings.DEBUG=False at runtime, so RLS test behaviour is unaffected.
      DEBUG: "1"
      ALLOWED_HOSTS: "127.0.0.1,localhost,testserver,runmycampus.com,.runmycampus.com"
      MULTI_TENANT_BASE_DOMAIN: runmycampus.com

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Provision non-superuser RLS app role + pgvector
        env:
          PGPASSWORD: postgres
        run: |
          set -euo pipefail
          PSQL="psql -h 127.0.0.1 -U postgres -v ON_ERROR_STOP=1 -X -q"
          # pgvector is an UNTRUSTED extension (superuser-only). Pre-create it as
          # the postgres superuser in template1 (so the test DB the runner creates
          # inherits it) and in the maintenance DB, so migration 0123's
          # `CREATE EXTENSION IF NOT EXISTS vector` is a privilege-free no-op for
          # the non-superuser app role.
          $PSQL -d template1 -c "CREATE EXTENSION IF NOT EXISTS vector;"
          $PSQL -d ci_tenants_rls -c "CREATE EXTENSION IF NOT EXISTS vector;"
          # Non-superuser, non-BYPASSRLS role that owns the schema so it can run
          # migrations (incl. FORCE ROW LEVEL SECURITY) yet remains SUBJECT to RLS.
          $PSQL -d postgres -tc "SELECT 1 FROM pg_roles WHERE rolname='rls_app'" | grep -q 1 \
            || $PSQL -d postgres -c "CREATE ROLE rls_app LOGIN PASSWORD 'rls_app' NOSUPERUSER NOBYPASSRLS CREATEDB;"
          # rls_app must own the maintenance DB + public schema to migrate it, and
          # have createdb (granted above) to build the test database.
          $PSQL -d postgres -c "ALTER DATABASE ci_tenants_rls OWNER TO rls_app;"
          $PSQL -d ci_tenants_rls -c "GRANT ALL ON SCHEMA public TO rls_app; ALTER SCHEMA public OWNER TO rls_app;"
          # template1's public schema owned by rls_app so freshly-created test DBs
          # let rls_app create tables under PG15's locked-down public-schema rules.
          $PSQL -d template1 -c "GRANT ALL ON SCHEMA public TO rls_app;"

      - name: Apply migrations (incl. RLS policy migrations)
        run: |
          python manage.py migrate --noinput --settings=config.settings

      - name: Run @tag("tenants_rls") Django tests
        run: |
          # Scope discovery to apps/ (all @tag("tenants_rls") tests live there).
          # A bare `manage.py test` discovers from '.' and crashes on the
          # hyphen-named companion siblings' pytest packages (same root cause as
          # django-tests.yml). The --tag filter still selects only RLS tests.
          python manage.py test apps --tag=tenants_rls --settings=config.settings --noinput -v 2
