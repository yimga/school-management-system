# Explicit Django test suite — runs as its own PR check so failures are
# attributed to the test suite directly, not to the broader pre-deploy gate.
#
# Complements smoke.yml (which calls pre_deploy_gate.sh): this workflow is
# faster, has a tighter timeout, and gives a clean signal to PR reviewers.

name: Django tests

on:
  push:
    # `improvements` added 2026-08-31. ci.yml named that branch and carried
    # the only suite run for it -- a run that crashed at discovery and so
    # never executed a test. Naming it here makes the coverage real.
    branches: [main, improvements]
  pull_request:
    branches: [main, improvements]
  workflow_dispatch: {}

# Added 2026-08-31. Without a concurrency group a superseded run bills in
# full, and this repo takes hundreds of commits a week. Cancelling an
# obsolete run removes no enforcement -- the tip of the branch still runs
# every job. Same group/cancel pair peers already use in
# django-tests-postgres.yml and tenants-rls.yml.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  django-tests:
    runs-on: ubuntu-latest
    # The reliable runner forces parallel=0 (config/reliable_test_runner.py), so
    # the full ~10,168-test suite runs serially on sqlite — including multi-minute
    # integration classes (the portal-role crawl alone is ~12 min). 35 min was a
    # mid-suite job timeout (GitHub reports it as "cancelled"), NOT a hang (the
    # RequestTimeoutMiddleware deadlock is fixed; 0 Gateway Timeouts now). Give the
    # serial suite a realistic budget (75 min still timed out mid-suite; the
    # reliable runner forbids parallelism, so the full ~10k serial run needs more).
    timeout-minutes: 110
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Django test suite
        env:
          DEBUG: "0"
          SECRET_KEY: "ci-django-tests-not-for-production-use-64chars___________________________"
          ALLOWED_HOSTS: "localhost,127.0.0.1,testserver"
          RMC_RELIABLE_TEST_RUNNER: "1"
          DJANGO_TEST_DB_FILE: ".django_test_dbs/ci_django_tests.sqlite3"
        run: |
          mkdir -p .django_test_dbs
          # Scope discovery to the Django roots (10,168 tests). A bare
          # `manage.py test` discovers from '.', descends into the hyphen-named
          # companion siblings (companion-docker/, companion-extension/) whose
          # pytest packages Django's unittest loader cannot import, and crashes
          # the ENTIRE run at discovery.
          # NOTE: payment/ and emis/ hold their tests in a bare `tests/` package
          # directly under the app. A *path* label ("payment") routes Django to
          # unittest discover(start_dir="payment"), which imports that package as
          # bare `tests` and collides across labels. The *dotted* form
          # ("payment.tests") routes to loadTestsFromName instead and resolves
          # cleanly. apps/config/services have no such bare top-level tests pkg.
          # (All payment/emis tests live under their tests/ package, so the
          # dotted form misses nothing.)
          python manage.py test apps config services payment.tests emis.tests --settings=config.settings --noinput

  npm-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install JS dependencies
        run: npm ci --no-audit --no-fund

      - name: npm audit (high+ severity blocks)
        run: npm audit --omit=dev --audit-level=high
