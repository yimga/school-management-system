# CI: tests, accessibility (pa11y), Lighthouse
name: CI

on:
  push:
    branches: [main, improvements]
  pull_request:
    branches: [main, improvements]

jobs:
  django-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt 2>/dev/null || pip install django djangorestframework
      - name: Run Django checks
        run: python manage.py check
      - name: Verify get_model registry integrity
        run: python scripts/verify_get_model_integrity.py --compare
      - name: Verify URL-name integrity
        run: python scripts/verify_url_name_integrity.py --compare
      - name: Verify cross-host template reverse
        run: python scripts/verify_cross_host_template_reverse.py --compare
      - name: Scan hardcoded dead paths
        run: python scripts/scan_hardcoded_dead_paths.py
      - name: Scan RBAC permission catalog
        run: python scripts/scan_rbac_permission_catalog.py
      - name: Verify template-reference integrity
        run: python scripts/verify_template_reference_integrity.py --compare
      - name: Verify every template compiles (TemplateSyntaxError gate)
        run: python scripts/verify_template_compiles.py --compare
      - name: Verify static-asset reference integrity
        run: python scripts/verify_static_reference_integrity.py --compare
      - name: Verify settings-key integrity
        run: python scripts/verify_settings_key_integrity.py --compare
      - name: Verify i18n catalog freshness (ratchet - no NEW wrapped-but-unextracted strings)
        # Per-push early-warning tier: fails only on a translatable string wrapped in
        # {% trans %}/gettext() but NOT extracted into locale/en/.../django.po beyond the
        # frozen baseline. Complements the binary deploy gate (scripts/pre_deploy_gate.sh).
        # Fix: `python manage.py sync_i18n_catalog` then commit locale/.
        run: python scripts/verify_i18n_catalog_fresh.py --compare
      - name: Verify per-app READMEs (metric 24 - docs must not invent surface)
        run: python scripts/verify_app_readmes.py
      - name: Scan RLS table-level coverage (no NEW unenumerated tenant-scoped tables)
        run: python scripts/scan_rls_table_coverage.py --compare

      - name: RLS relation-scoped coverage (child tables reach school via a parent)
        run: python scripts/scan_rls_relation_scoped_coverage.py --compare

      - name: RLS NULL-school arm (a platform-scope row must not be invisible)
        run: python scripts/scan_rls_null_school_arm.py --compare
      - name: Scan tenant-admin scope for SHARED models with no school column
        # The auto-scoping mixin only applies to models that HAVE a `school`
        # field. A SHARED_APPS model without one got none, and its table lives in
        # `public` -- 53 registrations let one school's admin read and export
        # every tenant's audit trail.
        run: python scripts/scan_unscoped_shared_tenant_admin.py
      - name: Migrate DB (grade-scale registry gate needs tables)
        # Was `2>/dev/null || true`, which threw away the exit code AND the
        # error text. Verified on a fresh sqlite DB (what this job uses -- no
        # services:, no DATABASE_URL) that migrate exits 0 clean, so the mask
        # was protecting nothing and would have hidden a partial migration:
        # later steps would then read an incomplete schema as green.
        run: python manage.py migrate --noinput
      - name: Audit tenant/operator admin form intelligence
        run: |
          python manage.py shell -c "from django.contrib.auth import get_user_model; from apps.schools.models import School; User=get_user_model(); user,_=User.objects.get_or_create(username='ci_admin_form_audit', defaults={'is_active':True,'is_staff':True,'is_superuser':True}); user.is_active=True; user.is_staff=True; user.is_superuser=True; user.set_unusable_password(); user.save(); School.objects.get_or_create(slug='ci-admin-form-audit', defaults={'name':'CI Admin Form Audit','subdomain':'ci-admin-form-audit','is_active':True})"
          python scripts/audit_admin_form_intelligence_contract.py
      - name: Ratchet admin auto-fill coverage (structural floor only)
        run: python scripts/audit_admin_autofill_coverage.py --compare var/admin-autofill-coverage-baseline.json --top 0
      - name: admin-emergency-surface-contract
        run: python scripts/audit_admin_emergency_surface_contract.py
      - name: django-admin-canvas-templates-compile
        run: python scripts/verify_django_admin_canvas_templates_compile.py
      - name: Verify grading-scale registry coverage
        run: python scripts/verify_grading_scale_registry_coverage.py --strict
      - name: Verify field-reference integrity
        run: python scripts/verify_field_reference_integrity.py --compare
      - name: Verify relation-path integrity
        run: python scripts/verify_relation_path_integrity.py --compare
      - name: Verify ORM filter-field integrity
        run: python scripts/verify_orm_filter_field_integrity.py --compare
      - name: URL kwarg contract (views must accept their own URL kwargs)
        run: python scripts/audit_url_kwarg_contract.py
      - name: Shell chrome cross-host {% url %} contract
        run: python scripts/audit_shell_url_namespace_contract.py
      - name: Single migration leaf per app (a merge can create two silently)
        run: python scripts/verify_single_migration_leaf.py
      - name: blank+unique text fields (optional exactly once)
        run: python scripts/scan_blank_unique_text_fields.py
      - name: Unit tests for the two field/migration shape gates
        run: |
          python -m unittest scripts.tests.test_scan_blank_unique_text_fields -v
          python -m unittest scripts.tests.test_verify_single_migration_leaf -v
      - name: Verify offline manifest taxonomy (operational_state always present)
        run: python scripts/verify_offline_manifest_taxonomy.py
      - name: Verify tenant cannot reach operator routes (super-segment coverage)
        run: python scripts/verify_tenant_cannot_reach_operator_routes.py
      - name: Verify /super/ per-view platform-scope coverage
        run: python scripts/verify_super_platform_scope_coverage.py
      - name: Verify tenant offboarding is operator-only
        run: python scripts/verify_tenant_offboarding_operator_only.py
      - name: Verify RuntimeDefaults first-class <-> model parity (config SOT drift)
        run: python scripts/verify_runtime_defaults_model_parity.py
      - name: Verify unified-lifecycle FSM integrity (states/transitions/spine map)
        run: python scripts/verify_unified_lifecycle_fsm_integrity.py
      - name: Verify middleware topology parity (base MIDDLEWARE vs tenants MIDDLEWARE)
        run: python scripts/verify_middleware_topology_parity.py
      - name: Verify every beat entry names a registered task (silent no-op guard)
        run: python scripts/verify_beat_task_registry.py
      - name: Eager filter-arg VariableDoesNotExist completion (full)
        # Proof harness for ops_surface / |default:missing / |slice:missing 500s.
        # Must print EAGER_FILTER_ARG_COMPLETION_PASS. Static-only subset also
        # runs in architectural-boundaries.yml.
        run: python scripts/verify_eager_filter_arg_completion.py
      - name: Nav Engine coverage (static + reverse)
        # Catalog ids reverse on tenant + manager urlconfs; static wiring is
        # also gated in architectural-boundaries.yml.
        run: python scripts/verify_nav_engine_coverage.py
      - name: Run Django tests
        run: python manage.py test --noinput -v 0

  # The a11y-lighthouse job was REMOVED on 2026-08-22. All three of its steps
  # carried continue-on-error, and none of them could have reported a failure
  # even without it:
  #   * `npm run lint:a11y` and `npm run lighthouse:assert` name package.json
  #     scripts that DO NOT EXIST. Both steps failed with "Missing script" on
  #     every run and had never once invoked axe or Lighthouse -- the flag is
  #     the only reason nobody noticed the job was hollow.
  #   * `npm run lint:accessibility` does exist, but the script itself ended in
  #     `|| true`, so pa11y's exit code was already discarded inside npm before
  #     continue-on-error saw it. (That `|| true` is removed in this same
  #     change, so the script is honest for local use.)
  # The real, ENFORCING coverage is unaffected and lives in dedicated
  # workflows: pa11y-ci.yml, a11y-axe.yml and lighthouse-ci.yml each run their
  # tool with no continue-on-error and no `|| true` on the assertion. Deleting
  # this job removes a green checkmark that stood for nothing. It removes no
  # coverage.

  e2e-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt 2>/dev/null || pip install django
      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci 2>/dev/null || npm install
      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps
      - name: Migrate
        # Was `2>/dev/null || true`, which threw away the exit code AND the
        # error text. Verified on a fresh sqlite DB (what this job uses -- no
        # services:, no DATABASE_URL) that migrate exits 0 clean, so the mask
        # was protecting nothing and would have hidden a partial migration:
        # later steps would then read an incomplete schema as green.
        run: python manage.py migrate --noinput
      - name: Start server
        run: python manage.py runserver 0.0.0.0:8000 & sleep 6
      - name: Run smoke E2E (login page load)
        # Enforcing since 2026-08-22. Unlike the two deleted above, this is a
        # REAL invocation -- the `chromium` project is defined in
        # playwright.config.js -- so masking it was discarding a genuine browser
        # proof, which is exactly the evidence class the audit caps a score for
        # lacking.
        run: npx playwright test --project=chromium
        env:
          CI: true
          BASE_URL: 'http://localhost:8000'
