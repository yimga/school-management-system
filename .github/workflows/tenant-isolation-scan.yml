# Tenant-isolation queryset safety scan.
#
# Builds and compares against the baseline JSON at
# `var/security-audit-baseline-tenant-isolation.json`. New unscoped
# `<TenantModel>.objects.filter()` / `.get()` / `.all()` queries cause CI to fail.
#
# Update the baseline only when you've intentionally fixed (removed) an
# existing finding — never to silence a new one.
#
# Hand-edit the baseline file with care; format is deterministic JSON.

name: tenant-isolation-scan

on:
  # Direct pushes to the deploy branches would otherwise BYPASS this scan
  # (branch protection is unavailable on this plan), letting a NEW unscoped
  # tenant query land silently on main. Run on push too so the scan always
  # executes on main.
  push:
    branches: [main, improvements]
  pull_request:
    paths:
      - "apps/**/*.py"
      - "scripts/scan_tenant_queryset_safety.py"
      - "var/security-audit-baseline-tenant-isolation.json"
      - ".github/workflows/tenant-isolation-scan.yml"
  workflow_dispatch: {}

defaults:
  run:
    working-directory: .

# Added 2026-08-31. Without a concurrency group a superseded run bills in
# full, and this repo takes hundreds of commits a week. Cancelling an
# obsolete run removes no enforcement -- the tip of the branch still runs
# every job. Same group/cancel pair peers already use in
# django-tests-postgres.yml and tenants-rls.yml.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  scan:
    name: Compare against tenant-isolation baseline
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run scanner --compare
        run: |
          python scripts/scan_tenant_queryset_safety.py --compare
