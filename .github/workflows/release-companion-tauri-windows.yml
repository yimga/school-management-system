# RunMyCampus Companion (Tauri sibling) — Windows signed-release workflow.
#
# Triggers ONLY on tags matching `companion-tauri-v*` (same tags fire
# both the macOS and Windows signed builds). Does NOT run on push to
# main; does NOT run on PRs.
#
# Tag -> version-string contract:
#   The tag suffix after `companion-tauri-v` MUST match the
#   `version = "X.Y.Z"` value in `companion-tauri/src-tauri/Cargo.toml`.
#   Enforced by `scripts/preflight_signed_release.py` BEFORE push and
#   re-checked here after checkout.
#
# Authentication: Authenticode signing via `signtool`. Required GitHub
# Actions secrets:
#   * WIN_CERT_PFX_BASE64        - EV / OV code-signing cert exported
#   *                              as .pfx, then
#   *                              base64 -i cert.pfx | tr -d '\n'
#   *                              (EV certs typically live on an HSM
#   *                              and require a hardware token; for
#   *                              CI the cert MUST be exported in a
#   *                              software-key form per the issuer's
#   *                              policy. Many EV CAs do NOT allow
#   *                              this -- see docs/COMPANION_SIBLINGS
#   *                              _SIGNED_RELEASE.md for the cloud-
#   *                              HSM alternative via AzureSignTool.)
#   * WIN_CERT_PASSWORD          - password for the .pfx export
#   * WIN_SIGN_TIMESTAMP_URL     - RFC 3161 timestamp authority URL.
#   *                              Default: http://timestamp.digicert.com
#
# Procurement: docs/COMPANION_SIBLINGS_SIGNED_RELEASE.md describes the
# EV / OV cert procurement path (DigiCert / Sectigo / GlobalSign /
# SSL.com) and the AzureSignTool cloud-HSM alternative.

name: release-companion-tauri-windows

on:
  push:
    tags:
      - "companion-tauri-v*"
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "publish" to confirm release to GitHub Releases (Authenticode-signed)'
        required: true
        type: string
      release_tag:
        description: 'Release tag to publish, e.g. companion-tauri-v3.40.0'
        required: true
        type: string
      skip_reproducibility:
        description: 'Skip the double-build reproducibility verification (incident-response use only). Set to "true" to bypass.'
        required: false
        default: 'false'
        type: string
      signtool_provider:
        description: 'Signing tool: "signtool" (default, software .pfx) or "azuresigntool" (cloud HSM via Azure Key Vault, EV-grade).'
        required: false
        default: 'signtool'
        type: choice
        options:
          - signtool
          - azuresigntool

# Do NOT trigger on push to main / PRs.
permissions:
  contents: write  # release-asset upload

env:
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.release_tag || github.ref_name }}
  SIGNTOOL_PROVIDER: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.signtool_provider || 'signtool' }}

defaults:
  run:
    working-directory: beta/school-management-system/companion-tauri

jobs:
  confirm:
    name: Manual confirmation gate
    runs-on: ubuntu-latest
    steps:
      - name: Require explicit confirm input on manual dispatch
        if: github.event_name == 'workflow_dispatch'
        run: |
          if [ "${{ github.event.inputs.confirm }}" != "publish" ]; then
            echo "::error::workflow_dispatch requires confirm='publish' (got '${{ github.event.inputs.confirm }}')"
            exit 1
          fi
          case "${{ github.event.inputs.release_tag }}" in
            companion-tauri-v*) ;;
            *)
              echo "::error::workflow_dispatch release_tag must match companion-tauri-v*"
              exit 1
              ;;
          esac
          echo "Manual dispatch confirmed for ${{ github.event.inputs.release_tag }}."
      - name: Tag-triggered run (no manual confirm required)
        if: github.event_name == 'push'
        run: echo "Triggered by tag ${{ github.ref_name }} - no manual confirm required."

  build-sign:
    name: Build + Authenticode-sign Windows installer
    runs-on: windows-2022
    needs: confirm
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Verify tag matches Cargo.toml version (PowerShell)
        shell: pwsh
        run: |
          $tag = $env:RELEASE_TAG
          $expected = $tag -replace '^companion-tauri-v', ''
          $cargo = Get-Content -Raw -Path "src-tauri/Cargo.toml"
          if ($cargo -notmatch '(?m)^version = "([^"]+)"') {
            Write-Error "Cannot read version from Cargo.toml"
            exit 1
          }
          $actual = $Matches[1]
          if ($expected -ne $actual) {
            Write-Error "Tag suffix '$expected' does not match Cargo.toml version '$actual'"
            exit 1
          }
          Write-Host "Tag/version aligned: $actual"

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Set up Node (Tauri front-end build)
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2.0" --locked

      - name: Compute SOURCE_DATE_EPOCH + RUSTFLAGS for reproducibility
        # See companion-tauri/REPRODUCIBLE_BUILDS.md for the contract.
        shell: bash
        run: |
          set -euo pipefail
          SDE=$(git log -1 --format=%ct "${RELEASE_TAG}")
          echo "SOURCE_DATE_EPOCH=$SDE" >> "$GITHUB_ENV"
          # On windows-2022 runners GITHUB_WORKSPACE uses forward slashes
          # when accessed from bash; --remap-path-prefix accepts either.
          echo "RUSTFLAGS=--remap-path-prefix=${GITHUB_WORKSPACE}=/build --remap-path-prefix=${USERPROFILE:-$HOME}/.cargo=/cargo" >> "$GITHUB_ENV"
          echo "SOURCE_DATE_EPOCH set to $SDE"

      - name: Front-end install + build (frozen lockfile)
        run: |
          npm ci --no-audit --no-fund
          npm run build

      - name: Build Windows installer via cargo tauri build (locked + frozen)
        working-directory: beta/school-management-system/companion-tauri/src-tauri
        env:
          SOURCE_DATE_EPOCH: ${{ env.SOURCE_DATE_EPOCH }}
          RUSTFLAGS: ${{ env.RUSTFLAGS }}
        run: cargo tauri build -- --locked --frozen

      - name: Record unsigned-bundle sha256 for in-toto subject
        shell: pwsh
        run: |
          $bundle = "src-tauri/target/release/bundle"
          $artifacts = @()
          if (Test-Path "$bundle/msi") {
            $artifacts += Get-ChildItem "$bundle/msi" -Filter *.msi | Select-Object -ExpandProperty FullName
          }
          if (Test-Path "$bundle/nsis") {
            $artifacts += Get-ChildItem "$bundle/nsis" -Filter *.exe | Select-Object -ExpandProperty FullName
          }
          if ($artifacts.Count -eq 0) {
            Write-Error "No .msi or .exe to subject-hash"
            exit 1
          }
          $intotoDir = Join-Path $env:RUNNER_TEMP "intoto"
          New-Item -ItemType Directory -Force -Path $intotoDir | Out-Null
          $subjects = @()
          foreach ($a in $artifacts) {
            $hash = (Get-FileHash -Algorithm SHA256 $a).Hash.ToLower()
            $name = [IO.Path]::GetFileName($a)
            $subjects += [pscustomobject]@{ name = $name; sha256 = $hash }
            Write-Host "Subject: $name sha256=$hash"
          }
          $out = Join-Path $intotoDir "windows-subject.json"
          $subjects | ConvertTo-Json -Depth 4 | Set-Content -Encoding utf8 -Path $out
          Write-Host "Wrote $out"

      - name: Upload in-toto subject manifest (Windows)
        uses: actions/upload-artifact@v4
        with:
          name: intoto-subject-windows
          path: ${{ runner.temp }}/intoto/windows-subject.json
          if-no-files-found: error

      - name: Sign installers (signtool branch)
        if: ${{ env.SIGNTOOL_PROVIDER == 'signtool' }}
        env:
          WIN_CERT_PFX_BASE64: ${{ secrets.WIN_CERT_PFX_BASE64 }}
          WIN_CERT_PASSWORD: ${{ secrets.WIN_CERT_PASSWORD }}
          WIN_SIGN_TIMESTAMP_URL: ${{ secrets.WIN_SIGN_TIMESTAMP_URL }}
        shell: pwsh
        run: |
          if (-not $env:WIN_CERT_PFX_BASE64) {
            Write-Error "WIN_CERT_PFX_BASE64 secret is empty"
            exit 1
          }
          $pfx = Join-Path $env:RUNNER_TEMP "rmc-cert.pfx"
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WIN_CERT_PFX_BASE64))
          $tsa = $env:WIN_SIGN_TIMESTAMP_URL
          if (-not $tsa) { $tsa = "http://timestamp.digicert.com" }
          $bundle = "src-tauri/target/release/bundle"
          $artifacts = @()
          if (Test-Path "$bundle/msi") {
            $artifacts += Get-ChildItem "$bundle/msi" -Filter *.msi | Select-Object -ExpandProperty FullName
          }
          if (Test-Path "$bundle/nsis") {
            $artifacts += Get-ChildItem "$bundle/nsis" -Filter *.exe | Select-Object -ExpandProperty FullName
          }
          if ($artifacts.Count -eq 0) {
            Write-Error "No .msi or .exe produced by cargo tauri build"
            exit 1
          }
          foreach ($a in $artifacts) {
            Write-Host "Signing $a (provider=signtool)"
            & signtool sign /fd SHA256 /f $pfx /p $env:WIN_CERT_PASSWORD /tr $tsa /td SHA256 $a
            if ($LASTEXITCODE -ne 0) {
              Write-Error "signtool failed for $a"
              exit 1
            }
            & signtool verify /pa $a
            if ($LASTEXITCODE -ne 0) {
              Write-Error "signtool verify failed for $a"
              exit 1
            }
          }
          Remove-Item $pfx -Force

      - name: Sign installers (AzureSignTool / cloud-HSM EV branch)
        if: ${{ env.SIGNTOOL_PROVIDER == 'azuresigntool' }}
        env:
          AZURE_KEY_VAULT_URI: ${{ secrets.AZURE_KEY_VAULT_URI }}
          AZURE_KEY_VAULT_CERT_NAME: ${{ secrets.AZURE_KEY_VAULT_CERT_NAME }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          WIN_SIGN_TIMESTAMP_URL: ${{ secrets.WIN_SIGN_TIMESTAMP_URL }}
        shell: pwsh
        run: |
          # Fail fast if any of the 5 Azure secrets are missing.
          $missing = @()
          foreach ($name in @('AZURE_KEY_VAULT_URI','AZURE_KEY_VAULT_CERT_NAME','AZURE_CLIENT_ID','AZURE_CLIENT_SECRET','AZURE_TENANT_ID')) {
            if (-not (Get-Item "env:$name" -ErrorAction SilentlyContinue).Value) {
              $missing += $name
            }
          }
          if ($missing.Count -gt 0) {
            Write-Error "AzureSignTool path requires these org secrets to be set: $($missing -join ', '). See docs/COMPANION_TAURI_WINDOWS_EV_SIGNING.md."
            exit 1
          }
          $tsa = $env:WIN_SIGN_TIMESTAMP_URL
          if (-not $tsa) { $tsa = "http://timestamp.digicert.com" }

          Write-Host "Installing AzureSignTool 4.0.1 via dotnet tool"
          & dotnet tool install --global AzureSignTool --version 4.0.1
          if ($LASTEXITCODE -ne 0) {
            Write-Error "dotnet tool install AzureSignTool failed"
            exit 1
          }
          $azureSignTool = "$env:USERPROFILE\.dotnet\tools\AzureSignTool.exe"

          $bundle = "src-tauri/target/release/bundle"
          $artifacts = @()
          if (Test-Path "$bundle/msi") {
            $artifacts += Get-ChildItem "$bundle/msi" -Filter *.msi | Select-Object -ExpandProperty FullName
          }
          if (Test-Path "$bundle/nsis") {
            $artifacts += Get-ChildItem "$bundle/nsis" -Filter *.exe | Select-Object -ExpandProperty FullName
          }
          if ($artifacts.Count -eq 0) {
            Write-Error "No .msi or .exe produced by cargo tauri build"
            exit 1
          }
          foreach ($a in $artifacts) {
            Write-Host "Signing $a (provider=azuresigntool)"
            & $azureSignTool sign `
              -kvu $env:AZURE_KEY_VAULT_URI `
              -kvc $env:AZURE_KEY_VAULT_CERT_NAME `
              -kvi $env:AZURE_CLIENT_ID `
              -kvs $env:AZURE_CLIENT_SECRET `
              -kvt $env:AZURE_TENANT_ID `
              -tr $tsa `
              -td sha256 `
              -fd sha256 `
              $a
            if ($LASTEXITCODE -ne 0) {
              Write-Error "AzureSignTool failed for $a"
              exit 1
            }
            # verify_signed_build.sh contract: signtool verify /pa works
            # on Authenticode signatures produced by EITHER tool.
            & signtool verify /pa $a
            if ($LASTEXITCODE -ne 0) {
              Write-Error "signtool verify /pa failed for AzureSignTool-signed $a"
              exit 1
            }
          }

      - name: Attach signed artifacts to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            beta/school-management-system/companion-tauri/src-tauri/target/release/bundle/msi/*.msi
            beta/school-management-system/companion-tauri/src-tauri/target/release/bundle/nsis/*.exe
          tag_name: ${{ env.RELEASE_TAG }}
          fail_on_unmatched_files: false

  verify-reproducibility:
    name: Verify reproducibility (double-build sha256 compare)
    runs-on: windows-2022
    needs: build-sign
    if: ${{ github.event_name == 'push' || github.event.inputs.skip_reproducibility != 'true' }}
    defaults:
      run:
        working-directory: beta/school-management-system/companion-tauri
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2.0" --locked

      - name: Compute SOURCE_DATE_EPOCH + RUSTFLAGS (same derivation as build job)
        shell: bash
        run: |
          set -euo pipefail
          SDE=$(git log -1 --format=%ct "${RELEASE_TAG}")
          echo "SOURCE_DATE_EPOCH=$SDE" >> "$GITHUB_ENV"
          echo "RUSTFLAGS=--remap-path-prefix=${GITHUB_WORKSPACE}=/build --remap-path-prefix=${USERPROFILE:-$HOME}/.cargo=/cargo" >> "$GITHUB_ENV"

      - name: Front-end install + build (frozen)
        run: |
          npm ci --no-audit --no-fund
          npm run build

      - name: Re-build installer on clean runner
        working-directory: beta/school-management-system/companion-tauri/src-tauri
        env:
          SOURCE_DATE_EPOCH: ${{ env.SOURCE_DATE_EPOCH }}
          RUSTFLAGS: ${{ env.RUSTFLAGS }}
        run: cargo tauri build -- --locked --frozen

      - name: Compare unsigned-bundle sha256 against first build
        shell: pwsh
        run: |
          $bundle = "src-tauri/target/release/bundle"
          $artifacts = @()
          if (Test-Path "$bundle/msi") {
            $artifacts += Get-ChildItem "$bundle/msi" -Filter *.msi | Select-Object -ExpandProperty FullName
          }
          if (Test-Path "$bundle/nsis") {
            $artifacts += Get-ChildItem "$bundle/nsis" -Filter *.exe | Select-Object -ExpandProperty FullName
          }
          $secondMap = @{}
          foreach ($a in $artifacts) {
            $h = (Get-FileHash -Algorithm SHA256 $a).Hash.ToLower()
            $secondMap[[IO.Path]::GetFileName($a)] = $h
            Write-Host "Second build: $([IO.Path]::GetFileName($a)) sha256=$h"
          }
          # Download the first-build subject manifest.
          $tmp = Join-Path $env:RUNNER_TEMP "intoto-cmp"
          New-Item -ItemType Directory -Force -Path $tmp | Out-Null
          & gh run download $env:GITHUB_RUN_ID -n intoto-subject-windows -D $tmp
          if ($LASTEXITCODE -ne 0) {
            Write-Warning "could not load first-build subject manifest; manual diff required"
            exit 0
          }
          $first = Get-Content -Raw -Path (Join-Path $tmp "windows-subject.json") | ConvertFrom-Json
          foreach ($s in $first) {
            $expected = $s.sha256
            $name = $s.name
            $got = $secondMap[$name]
            if ($got -ne $expected) {
              Write-Error "Reproducibility mismatch for ${name}: first=$expected second=$got. See companion-tauri/REPRODUCIBLE_BUILDS.md section 6."
              exit 1
            }
            Write-Host "OK: $name reproducible at sha256=$expected"
          }
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  attest-and-publish-intoto:
    name: Generate + sign in-toto SLSA Provenance v1.0 for Windows bundle
    runs-on: ubuntu-latest
    needs: build-sign
    permissions:
      contents: write
      id-token: write  # OIDC for cosign keyless
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Download Windows in-toto subject
        uses: actions/download-artifact@v4
        with:
          name: intoto-subject-windows
          path: ${{ runner.temp }}/intoto

      - name: Install Cosign
        # Pinned by SHA for keyless OIDC signing security.
        uses: sigstore/cosign-installer@4959ce089c160fddf62f7b42464195ba1a56d382  # v3.6.0

      - name: Compose SLSA Provenance v1.0 statement (stdlib python)
        env:
          RELEASE_TAG: ${{ env.RELEASE_TAG }}
          SIGNTOOL_PROVIDER: ${{ env.SIGNTOOL_PROVIDER }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, pathlib
          subj = json.load(open(os.path.join(os.environ['RUNNER_TEMP'], 'intoto', 'windows-subject.json')))
          if isinstance(subj, dict):
              subj = [subj]
          stmt = {
            "_type": "https://in-toto.io/Statement/v1",
            "predicateType": "https://slsa.dev/provenance/v1",
            "subject": [{"name": s["name"], "digest": {"sha256": s["sha256"]}} for s in subj],
            "predicate": {
              "buildDefinition": {
                "buildType": "https://github.com/runmycampus/sms/companion-tauri-windows@v1",
                "externalParameters": {
                  "release_tag": os.environ["RELEASE_TAG"],
                  "workflow": ".github/workflows/release-companion-tauri-windows.yml",
                  "signtool_provider": os.environ.get("SIGNTOOL_PROVIDER", "signtool"),
                },
                "internalParameters": {"platform": "windows-2022"},
              },
              "runDetails": {
                "builder": {"id": "https://github.com/" + os.environ.get("GITHUB_REPOSITORY", "")},
                "metadata": {"invocationId": os.environ.get("GITHUB_RUN_ID", "")},
              },
            },
          }
          out = pathlib.Path(os.environ['RUNNER_TEMP']) / 'intoto' / 'windows-provenance.intoto.jsonl'
          out.write_text(json.dumps(stmt) + "\n")
          print("Wrote", out)
          PY

      - name: Cosign sign-blob the in-toto statement (keyless OIDC)
        env:
          COSIGN_EXPERIMENTAL: "1"
        run: |
          set -euo pipefail
          STMT="${RUNNER_TEMP}/intoto/windows-provenance.intoto.jsonl"
          cosign sign-blob --yes \
            --output-signature "${STMT}.sig" \
            --output-certificate "${STMT}.pem" \
            "${STMT}"

      - name: Attach in-toto statement + cosign sig + cert to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ runner.temp }}/intoto/windows-provenance.intoto.jsonl
            ${{ runner.temp }}/intoto/windows-provenance.intoto.jsonl.sig
            ${{ runner.temp }}/intoto/windows-provenance.intoto.jsonl.pem
          tag_name: ${{ env.RELEASE_TAG }}
          fail_on_unmatched_files: true
