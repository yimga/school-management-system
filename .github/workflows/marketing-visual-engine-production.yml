# Production-host Playwright for VISUAL-ENGINE-10X (optional; workflow_dispatch).
name: Marketing visual engine (production)

on:
  workflow_dispatch:
    inputs:
      base_url:
        description: "Marketing base URL"
        required: false
        default: "https://runmycampus.com"

defaults:
  run:
    working-directory: beta/school-management-system

jobs:
  production-visual-engine:
    name: Playwright vs production marketing host
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: beta/school-management-system/package-lock.json
      - name: Install Node deps
        run: npm ci
      - name: Install Playwright Chromium
        run: npx playwright install chromium --with-deps
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Preflight production host
        run: python scripts/preflight_marketing_production_url.py --url "${{ github.event.inputs.base_url }}"
      - name: VISUAL-ENGINE production smoke
        env:
          MARKETING_BASE_URL: ${{ github.event.inputs.base_url }}
        run: npx playwright test tests/e2e/marketing-visual-engine.spec.js
