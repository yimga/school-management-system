# Pass 10.D: opt-in axe-core accessibility scan on PRs.
#
# Runs the pass-10 axe-selenium smoke test (apps/compliance/tests/
# test_a11y_axe_smoke.py) against a freshly-migrated Postgres instance. The
# test is gated on RUN_A11Y_TESTS=1; we set that here, plus install Chrome
# + chromedriver so the headless run has a real browser.
#
# Fails the workflow on any "serious" or "critical" axe violation on
# 13 templates total (1 homepage + 6 public + 6 auth):
#   public:  /, /onboard/, /marketing/, /marketing/pricing/,
#            /authentication/login/, /authentication/forgot-password/, /healthz/
#   auth:    /portal/, /portal/teacher/, /portal/parent/, /backend/,
#            /portal/finance/invoices/, /portal/configure/
#
# Authenticated routes use the _login_via_session helper that drops a
# Django session cookie into the Chrome driver (see test file).

name: a11y-axe

on:
  pull_request:
    paths:
      - "templates/**"
      - "static/css/**"
      - "static/js/**"
      - "apps/**/views*.py"
      - "apps/**/templatetags/**.py"
      - "apps/compliance/tests/test_a11y_axe_smoke.py"
      - ".github/workflows/a11y-axe.yml"
  workflow_dispatch: {}

defaults:
  run:
    working-directory: beta/school-management-system

jobs:
  axe:
    name: axe-core scan (selenium)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: testdb
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-retries 12
    env:
      DJANGO_SETTINGS_MODULE: config.settings
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/testdb
      RUN_A11Y_TESTS: "1"
      SECRET_KEY: ci-axe-secret-not-for-prod
      DEBUG: "0"
      ALLOWED_HOSTS: "*"
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: beta/school-management-system/requirements.txt
      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Install Chrome + chromedriver
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable
      - name: Verify chrome
        run: |
          google-chrome --version
          chromedriver --version || true
      - name: Run axe smoke tests
        run: |
          python -m pytest \
            apps/compliance/tests/test_a11y_axe_smoke.py \
            -v --tb=short
