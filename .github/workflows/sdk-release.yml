# Pass 12.D — SDK release workflow.
#
# Manual-trigger only: operators run this from the Actions tab after creating
# a tag like `sdk-py-0.2.1` (PyPI) or `sdk-npm-0.1.1` (npm). The two halves run
# independently; either can be selected from the workflow_dispatch inputs.
#
# Required secrets (set in repo Settings -> Secrets):
#   PYPI_API_TOKEN  — scoped PyPI token, format `pypi-...`
#   NPM_TOKEN       — npm publish token (https://docs.npmjs.com/about-access-tokens)
#
# Until those secrets are added, the publish steps fail closed (`if: env.X != ''`).
# Building still succeeds so PRs can verify the artifacts.

name: sdk-release

on:
  workflow_dispatch:
    inputs:
      target:
        description: "Which SDK to release"
        required: true
        type: choice
        default: "both"
        options:
          - "python"
          - "npm"
          - "both"
      pypi_test:
        description: "Publish Python to test.pypi.org instead of PyPI"
        required: false
        type: boolean
        default: false

defaults:
  run:
    working-directory: beta/school-management-system

jobs:
  python:
    if: ${{ inputs.target == 'python' || inputs.target == 'both' }}
    name: Build + publish runmycampus to PyPI
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write   # trusted-publisher OIDC (optional alt-path)
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build deps
        run: |
          python -m pip install --upgrade pip
          pip install build twine
      - name: Build sdist + wheel
        working-directory: beta/school-management-system/sdk
        run: |
          python -m build
          ls -la dist/
          twine check dist/*
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pypi-dist
          path: beta/school-management-system/sdk/dist/*
          retention-days: 1
      - name: Publish to PyPI
        if: ${{ env.PYPI_API_TOKEN != '' && !inputs.pypi_test }}
        working-directory: beta/school-management-system/sdk
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
          PYPI_API_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
        run: twine upload dist/*
      - name: Publish to test.pypi.org
        if: ${{ env.PYPI_API_TOKEN != '' && inputs.pypi_test }}
        working-directory: beta/school-management-system/sdk
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
          PYPI_API_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
        run: twine upload --repository-url https://test.pypi.org/legacy/ dist/*

  npm:
    if: ${{ inputs.target == 'npm' || inputs.target == 'both' }}
    name: Publish @runmycampus/sdk to npm
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"
      - name: Pack
        working-directory: beta/school-management-system/sdk/js
        run: |
          npm pack --dry-run
          npm pack
          ls -la *.tgz
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: npm-tarball
          path: beta/school-management-system/sdk/js/*.tgz
          retention-days: 1
      - name: Publish to npm
        if: ${{ env.NPM_TOKEN != '' }}
        working-directory: beta/school-management-system/sdk/js
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --access public
