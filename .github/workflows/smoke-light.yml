# Lighter checks when full smoke.yml (pre_deploy_gate) is too slow for manual runs.
# Static Phase H audit + URL smoke tests; no Playwright, no theme matrix, no long gate.
#
# If `test_generate_platform_inventory_check_passes` fails: run locally
#   python scripts/generate_platform_inventory.py --write && python scripts/generate_platform_inventory.py --check
# and commit docs/generated/platform_inventory.* and scripts/generated/scoped_gravity_trend.json.
name: Smoke light

on:
  pull_request:
    branches: [main]
  workflow_dispatch: {}
  schedule:
    # 06:00 UTC — disable by removing `schedule` if not wanted
    - cron: "0 6 * * *"

jobs:
  smoke-light:
    runs-on: ubuntu-latest
    # migrate (x2) + mechanical pytest bundle (~3–5 min) + marketing crawl — leave headroom
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Ruff (unused imports / variables)
        run: python -m ruff check apps --select F401,F841

      - name: Django system check
        env:
          SECRET_KEY: "ci-smoke-light-not-for-production-use-64chars____________________"
          ALLOWED_HOSTS: "localhost,127.0.0.1,testserver"
        run: python manage.py check

      - name: Phase H static audit
        run: python scripts/phase_h_audit.py

      - name: Shell architecture matrix (static template contracts)
        run: python scripts/verify_shell_architecture_matrix.py

      - name: Gilead full-tree classification (no Django DB)
        run: python scripts/verify_gilead_full_tree_classification.py

      - name: Migrate DB (needed by mechanical bundle)
        env:
          SECRET_KEY: "ci-smoke-light-not-for-production-use-64chars____________________"
          ALLOWED_HOSTS: "localhost,127.0.0.1,testserver"
        run: python manage.py migrate --noinput

      - name: Phases 3–11 mechanical bundle (consolidated lint module)
        run: python -m pytest apps/platform_runtime/tests/test_tenant_settings_lint.py -q

      - name: Premium maturity signals (--strict)
        run: python scripts/report_premium_maturity_signals.py --strict

      - name: RAG retrieval isolation eval (tenant vs global scope)
        run: python -m pytest services/tests/test_ai_memory.py -q

      - name: Smoke URL resolution (no DB)
        env:
          SECRET_KEY: "ci-smoke-light-not-for-production-use-64chars____________________"
          ALLOWED_HOSTS: "localhost,127.0.0.1,testserver"
        run: python manage.py test apps.accounts.tests.test_smoke_urls -v 1

      - name: Marketing URLs (full + CMS seed)
        env:
          DEBUG: "1"
          SECRET_KEY: "ci-smoke-light-not-for-production-use-64chars____________________"
          ALLOWED_HOSTS: "localhost,127.0.0.1,testserver"
        run: |
          python manage.py migrate --noinput
          python manage.py validate_marketing_urls --full --seed-cms
