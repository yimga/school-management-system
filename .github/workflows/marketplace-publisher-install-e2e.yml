name: Marketplace publisher-install E2E

on:
  workflow_dispatch: {}
  pull_request:
    branches: [main]
    paths:
      - "apps/marketplace/**"
      - "templates/marketplace/governance_console.html"
      - "tests/e2e/marketplace-publisher-install.spec.js"
      - "tests/e2e/helpers/manager-login.js"
      - "tests/e2e/helpers/tenant-login.js"
      - ".github/workflows/marketplace-publisher-install-e2e.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  marketplace-publisher-install:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SECRET_KEY: "ci-mkt-install-e2e-not-production-64chars__________"
      ALLOWED_HOSTS: "127.0.0.1,localhost,testserver,runmycampus.com,.runmycampus.com"
      DEBUG: "0"
      DJANGO_SETTINGS_MODULE: "config.settings"
      MULTI_TENANT_BASE_DOMAIN: "runmycampus.com"
      VISUAL_QA_PORT: "8023"
      VISUAL_QA_PASSWORD: "VisualQaPass123!"
      VISUAL_QA_USERNAME: "visualqa_admin"
      E2E_LOGIN_USER: "visualqa_admin"
      E2E_LOGIN_PASSWORD: "VisualQaPass123!"
      TENANT_SLUG: "e2e-mkt-install"
      TENANT_ROUTING: "host"
      VISUAL_QA_TENANT_HOST: "e2e-mkt-install.runmycampus.com"
      TENANT_BASE_URL: "http://e2e-mkt-install.runmycampus.com:8023"
      MANAGER_BASE_URL: "http://manager.runmycampus.com:8023"
      MKT_E2E_TENANT_USER: "e2e-mkt-admin@runmycampus.test"
      MKT_E2E_TENANT_PASSWORD: "E2eMktInstall!RmC9"
      MKT_E2E_APP_SLUG: "e2e-install-widget"
      RMC_FORCE_DB_SESSIONS: "1"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          npm ci
          node node_modules/playwright/cli.js install --with-deps chromium

      - name: Migrate and seed E2E fixtures
        run: |
          python manage.py migrate --noinput
          python manage.py ensure_superuser --password "$VISUAL_QA_PASSWORD" --no-input
          python -c "
          import os, django
          os.environ.setdefault('DJANGO_SETTINGS_MODULE', 'config.settings')
          django.setup()
          from django.contrib.auth import get_user_model
          U = get_user_model()
          u, _ = U.objects.get_or_create(
              username='visualqa_admin',
              defaults={
                  'email': 'visualqa@runmycampus.com',
                  'is_staff': True,
                  'is_superuser': True,
                  'is_active': True,
              },
          )
          u.is_staff = True
          u.is_superuser = True
          u.is_active = True
          u.set_password('$VISUAL_QA_PASSWORD')
          u.save()
          "
          python manage.py seed_marketplace_publisher_e2e_fixtures \
            --tenant-password "$MKT_E2E_TENANT_PASSWORD" \
            --app-slug "$MKT_E2E_APP_SLUG"

      - name: Map hosts
        run: |
          sudo bash -c "echo '127.0.0.1 runmycampus.com manager.runmycampus.com e2e-mkt-install.runmycampus.com' >> /etc/hosts"

      - name: Start Django
        run: |
          mkdir -p artifacts/marketplace-publisher-install
          nohup python manage.py runserver "0.0.0.0:${VISUAL_QA_PORT}" --noreload \
            > artifacts/marketplace-publisher-install/runserver.log 2>&1 &
          for i in $(seq 1 30); do
            curl --silent --fail "http://127.0.0.1:${VISUAL_QA_PORT}/healthz/" && break || sleep 2
          done

      - name: Playwright marketplace publisher install
        run: npm run test:e2e:marketplace-publisher-install

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: marketplace-publisher-install-artifacts
          path: |
            artifacts/marketplace-publisher-install
            test-results
          if-no-files-found: ignore
