# First-school operating proof — Playwright lifecycle test against a real
# staging tenant (default: gilead-school).
#
# Manual trigger only. Requires three repository secrets:
#   RMC_STAGING_BASE_URL    e.g. https://gilead-school.staging.runmycampus.com
#   RMC_STAGING_TEST_USER   seeded test user
#   RMC_STAGING_TEST_PASS   the test user's password
#
# Without those secrets, the Playwright suite skips every test with a
# friendly message — the workflow still completes "green" so it's safe
# to wire up before secrets are configured.

name: first-school-operating-proof

on:
  workflow_dispatch:
    inputs:
      override_base_url:
        description: "Override RMC_STAGING_BASE_URL for this run (leave empty to use the secret)"
        required: false
        default: ""

defaults:
  run:
    working-directory: beta/school-management-system/tests/playwright

jobs:
  proof:
    name: Playwright lifecycle proof
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      RMC_STAGING_BASE_URL: ${{ inputs.override_base_url != '' && inputs.override_base_url || secrets.RMC_STAGING_BASE_URL }}
      RMC_STAGING_TEST_USER: ${{ secrets.RMC_STAGING_TEST_USER }}
      RMC_STAGING_TEST_PASS: ${{ secrets.RMC_STAGING_TEST_PASS }}
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: beta/school-management-system/tests/playwright/package.json
      - name: Install Playwright deps
        run: npm install
      - name: Install Chromium browser
        run: npx playwright install --with-deps chromium
      - name: Announce configuration state
        run: |
          if [ -z "$RMC_STAGING_BASE_URL" ] || [ -z "$RMC_STAGING_TEST_USER" ] || [ -z "$RMC_STAGING_TEST_PASS" ]; then
            echo "Staging credentials not configured. Tests will SKIP (this is expected if you have not added secrets yet)."
          else
            echo "Targeting staging tenant: $RMC_STAGING_BASE_URL"
          fi
      - name: Run lifecycle proof
        run: npm run test:proof
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: beta/school-management-system/tests/playwright/playwright-report
          retention-days: 1
