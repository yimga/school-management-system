# Template Marketplace CI gates (plan §11 file list).
#
# Storage hygiene: every artifact upload below carries retention-days: 1.
# Never let it default to GitHub's 90-day retention (prevents the storage
# outage that triggered this rule in the first place).
name: Template Marketplace gates

on:
  pull_request:
    paths:
      - "beta/school-management-system/apps/brand_experience/**"
      - "beta/school-management-system/apps/siteconfig/local_experience_profiles.py"
      - "beta/school-management-system/apps/platform_runtime/pack_contract.py"
      - "beta/school-management-system/apps/marketplace/template_*.py"
      - "beta/school-management-system/scripts/verify_template_*.py"
      - "beta/school-management-system/scripts/generate_template_*.py"
      - "beta/school-management-system/scripts/split_palette_bundles.py"
      - "beta/school-management-system/templates/marketplace/**"
      - "beta/school-management-system/templates/studio_os/partials/experience_templates_fold.html"
      - "beta/school-management-system/static/css/rmc-template-marketplace.css"
      - "beta/school-management-system/static/css/design-tokens-local-*.css"
  push:
    branches: [main]
    paths:
      - "beta/school-management-system/apps/brand_experience/**"
      - "beta/school-management-system/apps/siteconfig/local_experience_profiles.py"
      - "beta/school-management-system/apps/platform_runtime/pack_contract.py"
      - "beta/school-management-system/apps/marketplace/template_*.py"
      - "beta/school-management-system/scripts/verify_template_*.py"

jobs:
  registry-and-boundaries:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: beta/school-management-system
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install requirements (minimal)
        run: |
          python -m pip install -U pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
      - name: Registry shape (75 templates / 25 profiles / categories)
        run: python scripts/verify_experience_template_registry.py
      - name: Tenant boundaries (operator templates never visible to tenants)
        run: python scripts/verify_template_tenant_boundaries.py
      - name: Local-first coverage (priority markets)
        run: python scripts/verify_template_local_first_coverage.py
      - name: Accessibility floor (WCAG AA)
        run: python scripts/verify_template_a11y_floor.py
      - name: AI recommender gateway boundary
        run: python scripts/verify_template_ai_recommender_boundary.py
      - name: Plan compliance
        run: python scripts/verify_template_marketplace_plan_compliance.py
      - name: Upload audit pairs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: template-marketplace-audit-pairs
          path: beta/school-management-system/docs/generated/local_first_template_*
          if-no-files-found: ignore
          retention-days: 1  # Strict storage hygiene — never default 90d

  routes-and-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: registry-and-boundaries
    defaults:
      run:
        working-directory: beta/school-management-system
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install requirements (minimal)
        run: |
          python -m pip install -U pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
      - name: Django check
        run: python manage.py check --settings=config.settings
      - name: Migration drift gate
        run: python scripts/check_real_migration_drift.py
      - name: Route resolution
        run: python scripts/verify_template_marketplace_routes.py
      - name: AI recommender live-smoke (fallback OK; LIVE requires LITELLM_* on Render)
        run: python scripts/verify_template_ai_recommender_live_smoke.py
      - name: Template registry tests
        run: python manage.py test apps.brand_experience.tests.test_experience_template_registry --settings=config.settings --noinput --keepdb
      - name: Semantic-runtime gate (fold + tenant views + setup-studio + audit append-only)
        run: python scripts/verify_template_marketplace_semantic_runtime.py
      - name: Upload registry verifier JSON
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: template-marketplace-verifier-output
          path: beta/school-management-system/docs/generated/experience_template_registry.json
          if-no-files-found: ignore
          retention-days: 1  # Strict storage hygiene — never default 90d
      - name: Upload AI live-smoke JSON
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: template-marketplace-ai-smoke
          path: beta/school-management-system/docs/generated/template_ai_recommender_live_smoke.json
          if-no-files-found: ignore
          retention-days: 1  # Strict storage hygiene — never default 90d
      - name: Upload semantic-runtime JSON
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: template-marketplace-semantic-runtime
          path: beta/school-management-system/docs/generated/template_marketplace_semantic_runtime.json
          if-no-files-found: ignore
          retention-days: 1  # Strict storage hygiene — never default 90d
